<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avisos · Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><header class="topbar"><a class="brand" href="/admin"><span class="brand-copy"><strong>Torneig 2026</strong><span>Organització</span></span></a><nav class="portal-nav"><a href="/admin">Dashboard</a><a href="/admin/marcador">Marcador</a><a href="/admin/horaris">Horaris</a><a href="/admin/pagaments">Pagaments</a><a href="/admin/dinars">Dinars</a><a href="/admin/parelles">Parelles</a><a class="active" href="/admin/avisos">Avisos</a></nav></header><section class="section"><div class="section-head"><div><div class="eyebrow">Comunicació</div><h1 class="section-title">Avisos</h1></div></div><div class="form-panel"><div class="field"><label>Títol</label><input id="title"></div><div class="field" style="margin-top:10px"><label>Missatge</label><input id="text"></div><div class="actions"><button class="btn btn-accent" onclick="publish()">Publicar avís</button></div></div><div id="list" class="list" style="margin-top:18px"></div></section></div></main><script src="portal.js"></script><script>function render(){const s=Portal.load();list.innerHTML=(s.notices||[]).slice().reverse().map(n=>`<div class="notice-card"><strong>${Portal.esc(n.title)}</strong><div>${Portal.esc(n.text)}</div><div class="meta">${Portal.esc(n.date||'')}</div></div>`).join('')}function publish(){const s=Portal.load();if(!title.value.trim()||!text.value.trim())return;s.notices=s.notices||[];s.notices.push({title:title.value.trim(),text:text.value.trim(),date:new Date().toLocaleString()});Portal.save(s);title.value='';text.value='';render()}render();</script></body></html>
