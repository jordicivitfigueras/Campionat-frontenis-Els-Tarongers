<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Avisos · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Comunicació</div><h1 class="section-title">Avisos</h1></div></div><div class="grid grid-2"><div class="form-panel"><h2 style="margin-top:0">Publicar avís</h2><div class="field"><label>Tipus</label><select id="type"><option>Informació</option><option>Canvi d'horari</option><option>Canvi de pista</option><option>Dinar</option><option>Important</option></select></div><div class="field" style="margin-top:10px"><label>Títol</label><input id="title"></div><div class="field" style="margin-top:10px"><label>Missatge</label><input id="text"></div><div class="actions"><button id="publishBtn" class="btn btn-accent" onclick="publish()">Publicar avís</button></div></div><div><div class="notice-card"><strong>Publicació en temps real</strong><div class="meta">Els avisos es guarden a Supabase i apareixen a la web pública per a tothom.</div></div><div class="form-panel"><h2 style="margin-top:0">Consell d'organització</h2><p style="color:#617068;line-height:1.6">Per canvis de partit, publica sempre el codi del partit, l'hora anterior, la nova hora i la pista.</p></div></div></div><h2 class="section-title" style="font-size:36px;margin-top:30px">Historial</h2><div id="list" class="list"></div></section></div></main><script src="portal.js"></script><script>function render(){const s=Portal.load();list.innerHTML=(s.notices||[]).length?(s.notices||[]).map((n,i)=>({...n,_i:i})).reverse().map(n=>`<div class="notice-card"><strong>${Portal.esc(n.title)}</strong><div style="margin-top:5px">${Portal.esc(n.text)}</div><div class="meta">${Portal.esc(n.date||n.ts||'')}</div><div class="actions"><button class="btn btn-danger" onclick="removeNotice(${n._i})">Eliminar</button></div></div>`).join(''):'<div class="list-item">No hi ha avisos publicats.</div>'}async function publish(){const t=title.value.trim(),x=text.value.trim(),tp=type.value;if(!t||!x){alert('Cal posar títol i missatge.');return}publishBtn.disabled=true;try{const n={title:tp==='Informació'?t:`${tp} · ${t}`,text:x,type:tp.toLowerCase(),date:new Date().toLocaleString()};if(window.SupaSync){const db=await SupaSync.publishNotice(n);if(db?.[0])n.id=db[0].id}const s=Portal.load();s.notices=s.notices||[];s.notices.push(n);Portal.save(s);title.value='';text.value='';render()}catch(e){alert('No s’ha pogut publicar: '+e.message)}finally{publishBtn.disabled=false}}async function removeNotice(i){if(!confirm('Eliminar aquest avís?'))return;const s=Portal.load(),n=s.notices[i];try{if(window.SupaSync&&n?.id)await SupaSync.deleteNotice(n.id);s.notices.splice(i,1);Portal.save(s);render()}catch(e){alert('No s’ha pogut eliminar: '+e.message)}}window.addEventListener('supabase:ready',render);window.addEventListener('supabase:change',render);render();</script><script src="professional-shell.js"></script></body></html>
