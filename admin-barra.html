<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Barra ràpida · Campionat Frontenis Els Tarongers</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"><style>.bar-hero{background:linear-gradient(135deg,#043a28,#086443);color:#fff;border-radius:24px;padding:24px;margin-bottom:14px}.bar-hero h1{font-size:clamp(36px,8vw,64px);line-height:.95;margin:4px 0}.bar-hero p{color:#cfe4da;margin:8px 0 0}.bar-search{position:sticky;top:8px;z-index:10;background:#f4f7f5;padding:8px 0 12px}.bar-search input{font-size:22px!important;padding:17px!important;border:2px solid #0b5f43!important}.recent{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.person-chip{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.person{background:#fff;border:1px solid var(--border);border-radius:18px;padding:15px;text-align:left;cursor:pointer;min-height:82px}.person strong{display:block;font-size:16px;color:var(--brand)}.person span{font-size:12px;color:var(--muted)}.person.active{outline:3px solid var(--accent);background:#fffaf0}.panel{position:sticky;bottom:8px;margin-top:16px;background:#fff;border:2px solid var(--brand);border-radius:22px;padding:16px;box-shadow:0 18px 55px rgba(0,0,0,.2);z-index:20}.selected{font-size:21px;font-weight:950;color:var(--brand);margin-bottom:12px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qbtn{border:0;border-radius:16px;padding:15px 7px;font-weight:950;font-size:14px;cursor:pointer;background:#edf4f0;color:#0b5f43}.qbtn b{display:block;font-size:25px}.qbtn.primary{background:var(--accent)}.undo{margin-top:9px;width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:11px;font-weight:900}.toast{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:#10251d;color:#fff;border-radius:14px;padding:13px 18px;font-weight:900;z-index:50;display:none}.totals{display:flex;gap:12px;margin:12px 0}.totalbox{background:#fff;border:1px solid var(--border);border-radius:15px;padding:12px 15px}.totalbox b{font-size:22px;color:var(--brand)}@media(max-width:800px){.people{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.panel{bottom:5px}.toast{bottom:270px}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="bar-hero"><div class="eyebrow" style="color:#ffc46e!important">1 palet = 2 €</div><h1>Barra ràpida</h1><p>Busca una persona, toca el seu nom i afegeix la consumició.</p><div id="barState" style="margin-top:8px;font-size:12px;color:#cfe4da">Carregant dades…</div></div><div class="totals"><div class="totalbox"><b id="totalSticks">0</b><div class="meta">palets totals</div></div><div class="totalbox"><b id="totalEuro">0 €</b><div class="meta">import acumulat</div></div></div><div class="bar-search"><input id="barSearch" type="search" autocomplete="off" placeholder="🔎 Escriu un nom…"><div class="recent" id="recent"></div></div><div class="people" id="people"><div class="meta">Carregant persones…</div></div><div class="panel"><div class="selected" id="selected">Selecciona una persona</div><div class="quick"><button class="qbtn primary" data-add="1" data-item="Beguda"><b>🍺 +1</b>Beguda · 2 €</button><button class="qbtn" data-add="2" data-item="Vi / cava"><b>🍷 +2</b>Vi / cava · 4 €</button><button class="qbtn" data-add="3" data-item="Bocata"><b>🥖 +3</b>Bocata · 6 €</button><button class="qbtn" data-add="3" data-item="Vermut"><b>🫒 +3</b>Vermut · 6 €</button></div><button class="undo" id="undoBtn" disabled>↶ Desfer última acció</button></div></section></div></main><div class="toast" id="toast"></div><script>(function(){let tabs=[],chosen=null,lastTx=null,started=false;const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function waitSync(){for(let i=0;i<100;i++){if(window.SupaSync&&typeof SupaSync.req==='function')return SupaSync;await new Promise(r=>setTimeout(r,75))}throw new Error('Supabase no disponible')}async function load(){try{const s=await waitSync();tabs=await s.req('/rest/v1/bar_tabs?order=updated_at.desc&select=*')||[];$('barState').textContent=`${tabs.length} persones carregades · dades actualitzades`;render()}catch(e){$('barState').textContent='Error carregant dades';$('people').innerHTML='<div class="meta">No s’han pogut carregar les persones.</div>'}}function render(){const q=norm($('barSearch').value),arr=tabs.filter(x=>!q||norm(x.full_name).includes(q));$('people').innerHTML=arr.map(x=>`<button class="person ${chosen===x.id?'active':''}" data-person="${x.id}"><strong>${esc(x.full_name)}</strong><span>${x.sticks} palets · ${x.sticks*2} €</span></button>`).join('')||'<div class="meta">No hi ha coincidències.</div>';document.querySelectorAll('[data-person]').forEach(b=>{b.onclick=()=>choose(b.dataset.person);b.ondblclick=()=>quickOne(b.dataset.person)});$('recent').innerHTML=tabs.filter(x=>x.sticks>0).slice(0,10).map(x=>`<button class="person-chip" data-recent="${x.id}">${esc(x.full_name)} · ${x.sticks}</button>`).join('');document.querySelectorAll('[data-recent]').forEach(b=>b.onclick=()=>choose(b.dataset.recent));const st=tabs.reduce((a,x)=>a+Number(x.sticks||0),0);$('totalSticks').textContent=st;$('totalEuro').textContent=(st*2)+' €';const p=tabs.find(x=>x.id===chosen);$('selected').textContent=p?`${p.full_name} · ${p.sticks} palets / ${p.sticks*2} €`:'Selecciona una persona'}function choose(id){chosen=id;render()}async function quickOne(id){chosen=id;await add(1,'Beguda ràpida')}async function add(sticks,item){if(!chosen)return show('Selecciona una persona');const p=tabs.find(x=>x.id===chosen);if(!p)return;const old=p.sticks;p.sticks+=sticks;p.updated_at=new Date().toISOString();render();try{await SupaSync.req(`/rest/v1/bar_tabs?id=eq.${chosen}`,{method:'PATCH',body:{sticks:p.sticks,updated_at:p.updated_at}});const tx=await SupaSync.req('/rest/v1/bar_transactions',{method:'POST',body:{tab_id:chosen,sticks,item}});lastTx={id:tx?.[0]?.id,tab:chosen,sticks,item,name:p.full_name};$('undoBtn').disabled=false;tabs.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));show(`✓ ${p.full_name} · +${sticks} palet${sticks>1?'s':''} · Total ${p.sticks} / ${p.sticks*2} €`);render()}catch(e){p.sticks=old;render();show('No s’ha pogut guardar.')}}async function undo(){if(!lastTx)return;const p=tabs.find(x=>x.id===lastTx.tab);if(!p)return;const old=p.sticks;p.sticks=Math.max(0,p.sticks-lastTx.sticks);render();try{await SupaSync.req(`/rest/v1/bar_tabs?id=eq.${p.id}`,{method:'PATCH',body:{sticks:p.sticks,updated_at:new Date().toISOString()}});if(lastTx.id)await SupaSync.req(`/rest/v1/bar_transactions?id=eq.${lastTx.id}`,{method:'DELETE'});show(`↶ Desfet · ${p.full_name} · ${p.sticks} palets`);lastTx=null;$('undoBtn').disabled=true;render()}catch(e){p.sticks=old;render();show('No s’ha pogut desfer.')}}function show(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').style.display='none',1800)}$('barSearch').oninput=render;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(Number(b.dataset.add),b.dataset.item));$('undoBtn').onclick=undo;async function start(){if(started)return;started=true;await load()}window.addEventListener('admin:ready',start);window.addEventListener('supabase:change',()=>{if(started)load()});setTimeout(start,1400)})();</script><script src="/professional-shell.js?v=2026.08.11.10"></script></body></html>
