<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Configuració · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Paràmetres generals</div><h1 class="section-title">Configuració</h1></div></div><div class="grid grid-2"><div class="form-panel"><h2 style="margin-top:0">Torneig</h2><div class="field"><label>Nom</label><input id="cfgName" value="Torneig Frontó Gelida 2026"></div><div class="field" style="margin-top:10px"><label>Dates</label><input id="cfgDates" value="10–13 setembre 2026"></div><div class="field" style="margin-top:10px"><label>Màxim de parelles</label><input id="cfgMaxPairs" type="number" value="32"></div></div><div class="form-panel"><h2 style="margin-top:0">Pagaments i contingut</h2><div class="field"><label>Número / instrucció Bizum</label><input id="cfgBizum" placeholder="Pendent de definir"></div><div class="field" style="margin-top:10px"><label>Enllaç Dropbox</label><input id="cfgDb" placeholder="https://dropbox.com/..."></div><div class="field" style="margin-top:10px"><label>Telèfon de contacte</label><input id="cfgPhone" placeholder="+34 ..."></div></div></div><div class="form-panel" style="margin-top:16px"><h2 style="margin-top:0">Preus</h2><div class="form-grid"><div class="field"><label>Inscripció normal</label><input id="cfgNormalPrice" type="number" value="22"></div><div class="field"><label>Inscripció + soci</label><input id="cfgMemberPrice" type="number" value="35"></div><div class="field"><label>Dinar / persona</label><input id="cfgMealPrice" type="number" value="10"></div></div></div><div class="form-panel" style="margin-top:16px"><h2 style="margin-top:0">Obrir / tancar serveis</h2><div class="form-grid"><div class="field"><label>Inscripcions</label><select id="cfgRegistrationOpen"><option value="true">Obertes</option><option value="false">Tancades</option></select></div><div class="field"><label>Dinars</label><select id="cfgLunchOpen"><option value="true">Oberts</option><option value="false">Tancats</option></select></div><div class="field"><label>Merchandising</label><select id="cfgMerchOpen"><option value="true">Obert</option><option value="false">Tancat</option></select></div><div class="field"><label>Votació MVP</label><select id="cfgMvpOpen"><option value="false">Tancada</option><option value="true">Oberta</option></select></div></div><div class="actions"><button class="btn btn-accent" onclick="saveCfg()">Desar configuració</button></div></div><div class="production-note" style="margin-top:16px">Aquesta configuració queda guardada localment. Quan connectem Supabase, aquests paràmetres seran únics per a tota l'organització i podran alimentar automàticament totes les pantalles.</div></section></div></main><script src="portal.js"></script><script>const p=Portal.load(),cfg=p.config||{};function setVal(id,v){if(v!==undefined&&v!==null)document.getElementById(id).value=String(v)}setVal('cfgName',cfg.name);setVal('cfgDates',cfg.dates);setVal('cfgMaxPairs',cfg.maxPairs);setVal('cfgBizum',cfg.bizum);setVal('cfgDb',p.dropboxUrl||cfg.dropbox);setVal('cfgPhone',cfg.phone);setVal('cfgNormalPrice',cfg.normalPrice);setVal('cfgMemberPrice',cfg.memberPrice);setVal('cfgMealPrice',cfg.mealPrice);setVal('cfgRegistrationOpen',cfg.registrationOpen);setVal('cfgLunchOpen',cfg.lunchOpen);setVal('cfgMerchOpen',cfg.merchOpen);setVal('cfgMvpOpen',cfg.mvpOpen);function bool(id){return document.getElementById(id).value==='true'}function saveCfg(){const s=Portal.load();s.config={name:document.getElementById('cfgName').value.trim(),dates:document.getElementById('cfgDates').value.trim(),maxPairs:Number(document.getElementById('cfgMaxPairs').value),bizum:document.getElementById('cfgBizum').value.trim(),phone:document.getElementById('cfgPhone').value.trim(),normalPrice:Number(document.getElementById('cfgNormalPrice').value),memberPrice:Number(document.getElementById('cfgMemberPrice').value),mealPrice:Number(document.getElementById('cfgMealPrice').value),registrationOpen:bool('cfgRegistrationOpen'),lunchOpen:bool('cfgLunchOpen'),merchOpen:bool('cfgMerchOpen'),mvpOpen:bool('cfgMvpOpen')};s.dropboxUrl=document.getElementById('cfgDb').value.trim();Portal.save(s);alert('Configuració desada.')} </script><script src="professional-shell.js"></script></body></html>
