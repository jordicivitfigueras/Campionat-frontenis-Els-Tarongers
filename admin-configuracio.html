<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Configuració · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Paràmetres generals</div><h1 class="section-title">Configuració</h1></div></div><div class="grid grid-2"><div class="form-panel"><h2 style="margin-top:0">Torneig</h2><div class="field"><label>Nom</label><input id="name" value="Torneig Frontó Gelida 2026"></div><div class="field" style="margin-top:10px"><label>Dates</label><input id="dates" value="10–13 setembre 2026"></div><div class="field" style="margin-top:10px"><label>Màxim de parelles</label><input id="maxPairs" type="number" value="32"></div></div><div class="form-panel"><h2 style="margin-top:0">Pagaments i contingut</h2><div class="field"><label>Número / instrucció Bizum</label><input id="bizum" placeholder="Pendent de definir"></div><div class="field" style="margin-top:10px"><label>Enllaç Dropbox</label><input id="db" placeholder="https://dropbox.com/..."></div><div class="field" style="margin-top:10px"><label>Telèfon de contacte</label><input id="phone" placeholder="+34 ..."></div></div></div><div class="form-panel" style="margin-top:16px"><h2 style="margin-top:0">Preus</h2><div class="form-grid"><div class="field"><label>Inscripció normal</label><input id="normalPrice" type="number" value="22"></div><div class="field"><label>Inscripció + soci</label><input id="memberPrice" type="number" value="35"></div><div class="field"><label>Dinar / persona</label><input id="mealPrice" type="number" value="10"></div></div><div class="actions"><button class="btn btn-accent" onclick="saveCfg()">Desar configuració</button></div></div><div class="production-note" style="margin-top:16px">Aquesta configuració queda guardada localment. Quan connectem Supabase, aquests paràmetres seran únics per a tota l'organització i podran alimentar automàticament totes les pantalles.</div></section></div></main><script src="portal.js"></script><script>const p=Portal.load(),cfg=p.config||{};function set(id,v){document.getElementById(id).value=v??document.getElementById(id).value}set('name',cfg.name);set('dates',cfg.dates);set('maxPairs',cfg.maxPairs);set('bizum',cfg.bizum);set('db',p.dropboxUrl||cfg.dropbox);set('phone',cfg.phone);set('normalPrice',cfg.normalPrice);set('memberPrice',cfg.memberPrice);set('mealPrice',cfg.mealPrice);function saveCfg(){const s=Portal.load();s.config={name:name.value.trim(),dates:dates.value.trim(),maxPairs:Number(maxPairs.value),bizum:bizum.value.trim(),phone:phone.value.trim(),normalPrice:Number(normalPrice.value),memberPrice:Number(memberPrice.value),mealPrice:Number(mealPrice.value)};s.dropboxUrl=db.value.trim();Portal.save(s);alert('Configuració desada.')} </script><script src="professional-shell.js"></script></body></html>
