<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinars · Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><header class="topbar"><a class="brand" href="/admin"><span class="brand-copy"><strong>Torneig 2026</strong><span>Organització</span></span></a><nav class="portal-nav"><a href="/admin">Dashboard</a><a href="/admin/marcador">Marcador</a><a href="/admin/horaris">Horaris</a><a href="/admin/pagaments">Pagaments</a><a class="active" href="/admin/dinars">Dinars</a><a href="/admin/parelles">Parelles</a><a href="/admin/avisos">Avisos</a></nav></header><section class="section"><div class="section-head"><div><div class="eyebrow">Reserves</div><h1 class="section-title">Dinars</h1></div><div class="field" style="min-width:260px"><label>Dinar</label><select id="meal"></select></div></div><div class="dashboard-grid"><div class="quick-card"><div class="qtitle">Total inscrits</div><div id="count" class="qvalue">0</div></div></div><div id="list" class="list"></div></section></div></main><script src="portal.js"></script><script>const meal=document.getElementById('meal');function render(){const s=Portal.load(),keys=Object.keys(s.lunches||{});if(!meal.options.length)meal.innerHTML=keys.map(k=>`<option>${Portal.esc(k)}</option>`).join('');const arr=(s.lunches||{})[meal.value]||[];count.textContent=arr.length;list.innerHTML=arr.length?arr.map((x,i)=>{const name=typeof x==='string'?x:(x.name||'');const status=typeof x==='string'?'inscrit':(x.status||'pendent');return `<div class="list-item"><div><strong>${Portal.esc(name)}</strong><div class="meta">${Portal.esc(status.replace('_',' '))}</div></div><button class="btn btn-danger" onclick="removePerson(${i})">Eliminar</button></div>`}).join(''):'<div class="list-item">No hi ha inscrits.</div>'}function removePerson(i){const s=Portal.load();s.lunches[meal.value].splice(i,1);Portal.save(s);render()}meal.onchange=render;render();</script></body></html>
