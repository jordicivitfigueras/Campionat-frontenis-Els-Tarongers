<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Dinars · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Reserves</div><h1 class="section-title">Gestió de dinars</h1></div></div><div class="form-panel"><div class="form-grid"><div class="field"><label>Dinar</label><select id="meal"></select></div><div class="field"><label>Buscar</label><input id="search" placeholder="Nom o cognom"></div></div></div><div class="dashboard-grid" style="margin-top:14px"><div class="quick-card"><div class="qtitle">Total inscrits</div><div id="count" class="qvalue">0</div></div><div class="quick-card"><div class="qtitle">Bizum verificat</div><div id="paid" class="qvalue">0</div></div><div class="quick-card"><div class="qtitle">Pendents</div><div id="pending" class="qvalue">0</div></div></div><div id="list" class="list"></div></section></div></main><script src="portal.js"></script><script>const meal=document.getElementById('meal');function obj(x){return typeof x==='string'?{name:x,status:'pendent'}:x}function render(){const s=Portal.load(),keys=Object.keys(s.lunches||{});if(!meal.options.length)meal.innerHTML=keys.map(k=>`<option>${Portal.esc(k)}</option>`).join('');const all=((s.lunches||{})[meal.value]||[]).map(obj),q=document.getElementById('search').value.toLowerCase(),arr=all.map((x,i)=>({...x,_i:i})).filter(x=>(x.name||'').toLowerCase().includes(q));document.getElementById('count').textContent=all.length;document.getElementById('paid').textContent=all.filter(x=>x.status==='verificat').length;document.getElementById('pending').textContent=all.filter(x=>x.status!=='verificat').length;document.getElementById('list').innerHTML=arr.length?arr.map(x=>`<div class="list-item"><div><strong>${Portal.esc(x.name)}</strong><div class="meta">${x.status==='verificat'?'Pagament verificat':x.status==='bizum_enviat'?'Bizum enviat · pendent de verificar':'Pagament pendent'}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="badge ${x.status==='verificat'?'green':'orange'}">${x.status==='verificat'?'Pagat':'Pendent'}</span><button class="btn btn-danger" onclick="removePerson(${x._i})">Eliminar</button></div></div>`).join(''):'<div class="list-item">No hi ha inscrits amb aquest filtre.</div>'}function removePerson(i){if(!confirm('Eliminar aquesta persona del dinar?'))return;const s=Portal.load();s.lunches[meal.value].splice(i,1);Portal.save(s);render()}meal.onchange=render;document.getElementById('search').oninput=render;render();</script><script src="professional-shell.js"></script></body></html>
