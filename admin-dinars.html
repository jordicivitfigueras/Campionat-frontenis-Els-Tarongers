<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Dinars · Campionat Frontenis Els Tarongers 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Hospitality</div><h1 class="section-title">Gestió de dinars</h1></div></div><div class="dashboard-grid"><div class="quick-card"><div class="qtitle">Reserves totals</div><div id="total" class="qvalue">—</div><div class="meta">persones registrades</div></div><div class="quick-card"><div class="qtitle">Pagats</div><div id="paid" class="qvalue">—</div><div class="meta">Bizum verificat</div></div><div class="quick-card"><div class="qtitle">Pendents</div><div id="pending" class="qvalue">—</div><div class="meta">per comprovar</div></div><div class="quick-card"><div class="qtitle">Import previst</div><div id="amount" class="qvalue">—</div><div class="meta">segons preu configurat</div></div></div><div class="form-panel" style="margin-top:16px"><div class="form-grid"><div class="field"><label>Dinar</label><select id="meal"></select></div><div class="field"><label>Buscar assistent</label><input id="search" placeholder="Nom o cognom"></div><div class="field"><label>Estat</label><select id="status"><option value="all">Tots</option><option value="verified">Pagats</option><option value="pending">Pendents</option></select></div></div></div><div class="admin-section-title"><div><div class="eyebrow">Llista d’assistents</div><h2 id="mealTitle">Dinar</h2></div><span id="mealMeta"></span></div><div class="form-panel" style="padding:0!important;overflow:auto"><table class="admin-table"><thead><tr><th>Nom</th><th>Bizum</th><th>Estat</th><th>Alta</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>let events=[],reservations=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){if(!window.SupaSync)return;events=await SupaSync.req('/rest/v1/lunch_events?order=title.asc&select=*').catch(()=>[]);reservations=await SupaSync.req('/rest/v1/lunch_reservations?order=created_at.asc&select=*').catch(()=>[]);meal.innerHTML=events.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('');render()}function render(){const id=meal.value,e=events.find(x=>x.id===id),q=search.value.toLowerCase(),f=status.value,all=reservations.filter(r=>r.lunch_id===id),out=all.filter(r=>`${r.full_name} ${r.bizum_name||''}`.toLowerCase().includes(q)).filter(r=>f==='all'||(f==='verified'?r.payment_status==='verified':r.payment_status!=='verified'));const totalAll=reservations.length,paidAll=reservations.filter(r=>r.payment_status==='verified').length;total.textContent=totalAll;paid.textContent=paidAll;pending.textContent=totalAll-paidAll;amount.textContent=`${(totalAll*Number(e?.price||10)).toFixed(0)} €`;mealTitle.textContent=e?.title||'Dinar';mealMeta.textContent=`${all.length} reserves · ${Number(e?.price||10).toFixed(0)} €/persona`;rows.innerHTML=out.length?out.map(r=>`<tr><td><strong>${esc(r.full_name)}</strong></td><td>${esc(r.bizum_name||'—')}</td><td><span class="badge ${r.payment_status==='verified'?'green':'orange'}">${r.payment_status==='verified'?'Verificat':r.payment_status==='bizum_sent'?'Bizum enviat':'Pendent'}</span></td><td>${new Date(r.created_at).toLocaleDateString('ca-ES')}</td><td>${r.payment_status==='verified'?'✓':`<button class="btn btn-primary" onclick="verify('${r.id}')">Verificar</button>`}</td></tr>`).join(''):'<tr><td colspan="5">No hi ha reserves amb aquests filtres.</td></tr>'}async function verify(id){if(!confirm('Marcar aquest Bizum com a verificat?'))return;await SupaSync.req(`/rest/v1/lunch_reservations?id=eq.${id}`,{method:'PATCH',body:{payment_status:'verified'}});await load()}meal.onchange=render;search.oninput=render;status.onchange=render;window.addEventListener('admin:ready',load);setTimeout(load,900);</script><script src="professional-shell.js"></script></body></html>
