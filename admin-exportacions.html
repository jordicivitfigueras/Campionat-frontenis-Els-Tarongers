<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Exportacions · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Dades</div><h1 class="section-title">Exportacions</h1></div></div><div class="production-note">Descarrega còpies CSV per treballar amb Excel o guardar un backup ràpid abans i després de cada jornada.</div><div class="admin-cards"><button class="admin-link" onclick="exportRegistrations()"><b>Inscripcions</b><span>Jugadors, modalitat, import i estat Bizum.</span></button><button class="admin-link" onclick="exportLunches()"><b>Dinars</b><span>Assistents per dinar i estat de pagament.</span></button><button class="admin-link" onclick="exportMerch()"><b>Merchandising</b><span>Producte, talla, quantitat i pagament.</span></button><button class="admin-link" onclick="exportMatches()"><b>Partits</b><span>Horaris, pistes, parelles i resultats.</span></button><button class="admin-link" onclick="exportPayments()"><b>Bizums</b><span>Tots els pagaments i estat de verificació.</span></button><button class="admin-link" onclick="backupJson()"><b>Backup complet</b><span>Descarrega totes les dades locals en JSON.</span></button></div></section></div></main><script src="app.js"></script><script src="portal.js"></script><script>function csv(name,rows){if(!rows.length){alert('No hi ha dades per exportar.');return}const keys=Object.keys(rows[0]),esc=v=>`"${String(v??'').replaceAll('"','""')}"`,text='\ufeff'+[keys.join(';'),...rows.map(r=>keys.map(k=>esc(r[k])).join(';'))].join('\n'),blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadJson(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportRegistrations(){const p=Portal.load();csv('inscripcions_torneig_2026.csv',(p.tournamentRegistrations||[]).map(r=>({Jugador1:r.p1,Modalitat1:r.member1?'Soci':'Normal',Jugador2:r.p2,Modalitat2:r.member2?'Soci':'Normal',Import:r.amount,NomBizum:r.bizumName,Estat:r.status})))}function exportLunches(){const p=Portal.load(),rows=[];Object.entries(p.lunches||{}).forEach(([meal,arr])=>(arr||[]).forEach(x=>{x=typeof x==='string'?{name:x,status:'pendent'}:x;rows.push({Dinar:meal,Nom:x.name,NomBizum:x.bizumName||'',Estat:x.status||'pendent'})}));csv('dinars_torneig_2026.csv',rows)}function exportMerch(){const p=Portal.load();csv('merchandising_torneig_2026.csv',(p.merchOrders||[]).map(o=>({Nom:o.buyer,Producte:o.product,Talla:o.size,Quantitat:o.qty,Import:o.total,NomBizum:o.bizumName,Estat:o.status})))}function exportMatches(){const s=Torneig.loadState();csv('partits_torneig_2026.csv',Torneig.allIds().map(id=>{const m=s.matches[id];return {Partit:id,Fase:m.stage,Hora:m.time,Pista:m.court||'Pista 1',Parella1:Torneig.pairName(m.team1),Resultat1:m.s1,Parella2:Torneig.pairName(m.team2),Resultat2:m.s2,Estat:m.status}}))}function exportPayments(){const p=Portal.load();csv('bizums_torneig_2026.csv',(p.payments||[]).map(x=>({Concepte:x.kind||x.type,Referencia:x.ref||x.name,NomBizum:x.bizumName,Import:x.amount,Estat:x.status,Data:x.date||''})))}function backupJson(){downloadJson('backup_torneig_2026.json',{competition:Torneig.loadState(),portal:Portal.load(),exportedAt:new Date().toISOString()})}</script><script src="professional-shell.js"></script></body></html>
