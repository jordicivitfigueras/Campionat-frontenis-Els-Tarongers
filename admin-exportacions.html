<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Exportacions · Campionat Frontenis Els Tarongers 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Dades i còpies de seguretat</div><h1 class="section-title">Exportacions</h1></div></div><div class="dashboard-grid"><div class="quick-card"><div class="qtitle">Socis</div><div id="members" class="qvalue">—</div><div class="meta">registres exportables</div></div><div class="quick-card"><div class="qtitle">Jugadors</div><div id="players" class="qvalue">—</div><div class="meta">participants</div></div><div class="quick-card"><div class="qtitle">Parelles</div><div id="pairs" class="qvalue">—</div><div class="meta">places</div></div><div class="quick-card"><div class="qtitle">Partits</div><div id="matches" class="qvalue">—</div><div class="meta">registres</div></div></div><div class="admin-section-title"><div><div class="eyebrow">CSV</div><h2>Exportacions operatives</h2></div><span>Compatibles amb Excel</span></div><div class="admin-cards"><button class="admin-link" onclick="exportMembers()"><div class="admin-icon">#</div><b>Socis</b><span>Número de soci i activitat 2023–2026.</span></button><button class="admin-link" onclick="exportPlayers()"><div class="admin-icon">◉</div><b>Jugadors</b><span>Participants, número de soci i estat actual.</span></button><button class="admin-link" onclick="exportPairs()"><div class="admin-icon">Ⅱ</div><b>Parelles</b><span>32 places, seeds i estat de confirmació.</span></button><button class="admin-link" onclick="exportMatches()"><div class="admin-icon">▣</div><b>Partits</b><span>Fase, horari, pista, marcador i estat.</span></button><button class="admin-link" onclick="exportPayments()"><div class="admin-icon">€</div><b>Pagaments</b><span>Històric d’inscripcions i verificació.</span></button><button class="admin-link" onclick="exportLunches()"><div class="admin-icon">♨</div><b>Dinars</b><span>Assistents, Bizum i estat de pagament.</span></button><button class="admin-link" onclick="exportNotices()"><div class="admin-icon">!</div><b>Avisos</b><span>Historial de comunicacions publicades.</span></button><button class="admin-link" onclick="backupJson()"><div class="admin-icon">⇩</div><b>Backup complet</b><span>Totes les dades administratives en un sol JSON.</span></button></div><div class="production-note" style="margin-top:18px"><strong>Recomanació:</strong> fes un backup complet abans de començar cada jornada i un altre en acabar-la.</div></section></div></main><script>let d=null;function csv(name,rows){if(!rows.length)return alert('No hi ha dades per exportar.');const keys=Object.keys(rows[0]),esc=v=>`"${String(v??'').replaceAll('"','""')}"`,text='\ufeff'+[keys.join(';'),...rows.map(r=>keys.map(k=>esc(r[k])).join(';'))].join('\n'),blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function json(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function load(){if(!window.AdminData)return;d=await AdminData.load();members.textContent=d.stats.members;players.textContent=d.stats.players;pairs.textContent=d.stats.pairs;matches.textContent=d.stats.matches}function exportMembers(){csv('socis_2026.csv',d.members.map(x=>({Numero:x.member_number,Nom:x.full_name,2023:x.active_2023?'SI':'',2024:x.active_2024?'SI':'',2025:x.active_2025?'SI':'',2026:x.active_2026?'SI':''})))}function exportPlayers(){csv('jugadors_2026.csv',d.players.map(x=>({Nom:x.full_name,NumeroSoci:x.member_number||'',Soci2026:x.is_member?'SI':'NO'})))}function exportPairs(){const p=new Map(d.players.map(x=>[x.id,x.full_name]));csv('parelles_2026.csv',d.pairs.map(x=>({Seed:x.seed,Jugador1:p.get(x.player1_id)||'',Jugador2:p.get(x.player2_id)||'',Estat:x.status})))}function exportMatches(){csv('partits_2026.csv',d.matches.map(x=>({Partit:x.id,Fase:x.stage,Horari:x.scheduled_at,Pista:x.court,Resultat1:x.score1,Resultat2:x.score2,Estat:x.status})))}function exportPayments(){csv('pagaments_2026.csv',d.payments.map(x=>({Nom:x.full_name,Import:x.amount||'',Data:x.payment_date||'',Modalitat:x.registration_type||'',Verificat:x.verified?'SI':'NO'})))}function exportLunches(){csv('dinars_2026.csv',d.lunches.map(x=>({Nom:x.full_name,Bizum:x.bizum_name||'',Estat:x.payment_status,Alta:x.created_at})))}function exportNotices(){csv('avisos_2026.csv',d.notices.map(x=>({Titol:x.title,Missatge:x.body,Tipus:x.notice_type,Publicat:x.published?'SI':'NO',Data:x.created_at})))}function backupJson(){json('backup_campionat_frontenis_els_tarongers_2026.json',{exportedAt:new Date().toISOString(),...d})}window.addEventListener('admin:ready',load);setTimeout(load,900);</script><script src="professional-shell.js"></script></body></html>
