<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Exportacions · Campionat Frontenis Els Tarongers 2026</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Dades i còpies de seguretat</div><h1 class="section-title">Exportacions</h1></div><span id="exportState">Carregant…</span></div><div class="dashboard-grid"><div class="quick-card"><div class="qtitle">Socis</div><div id="members" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Jugadors</div><div id="players" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Parelles</div><div id="pairs" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Partits</div><div id="matches" class="qvalue">—</div></div></div><div class="admin-section-title"><div><div class="eyebrow">CSV</div><h2>Exportacions operatives</h2></div><span>Compatibles amb Excel</span></div><div class="admin-cards"><button class="admin-link" data-exp="members"><div class="admin-icon">#</div><b>Socis</b><span>Registre permanent i activitat anual.</span></button><button class="admin-link" data-exp="players"><div class="admin-icon">◉</div><b>Jugadors</b><span>Participants del quadre.</span></button><button class="admin-link" data-exp="pairs"><div class="admin-icon">Ⅱ</div><b>Parelles</b><span>Seeds i estat.</span></button><button class="admin-link" data-exp="matches"><div class="admin-icon">▣</div><b>Partits</b><span>Fase, horari, pista i resultat.</span></button><button class="admin-link" data-exp="registrations"><div class="admin-icon">✓</div><b>Inscripcions</b><span>Modalitats i estat de pagament.</span></button><button class="admin-link" data-exp="payments"><div class="admin-icon">€</div><b>Històric pagaments</b><span>Imports verificats per persona.</span></button><button class="admin-link" data-exp="lunches"><div class="admin-icon">♨</div><b>Àpats</b><span>Reserves i Bizums de dinars i sopar.</span></button><button class="admin-link" data-exp="merch"><div class="admin-icon">◼</div><b>Merchandising</b><span>Comandes, talles i pagaments.</span></button><button class="admin-link" data-exp="notices"><div class="admin-icon">!</div><b>Avisos</b><span>Comunicacions publicades.</span></button><button class="admin-link" data-exp="backup"><div class="admin-icon">⇩</div><b>Backup complet</b><span>Totes les dades administratives en JSON.</span></button></div><div class="production-note" style="margin-top:18px"><strong>Recomanació:</strong> fes un backup complet abans de començar cada jornada i un altre en acabar-la.</div></section></div></main><script>(function(){let d=null,started=false;const $=id=>document.getElementById(id);function csv(name,rows){if(!rows?.length)return alert('No hi ha dades per exportar.');const keys=Object.keys(rows[0]),esc=v=>`"${String(v??'').replaceAll('"','""')}"`,text='\ufeff'+[keys.join(';'),...rows.map(r=>keys.map(k=>esc(r[k])).join(';'))].join('\n'),blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function json(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function waitData(){for(let i=0;i<100;i++){if(window.AdminData)return AdminData;await new Promise(r=>setTimeout(r,75))}throw new Error('Dades no disponibles')}async function load(){try{const a=await waitData();d=await a.load();members.textContent=d.stats.members;players.textContent=d.stats.players;pairs.textContent=d.stats.pairs;matches.textContent=d.stats.matches;exportState.textContent='Dades actualitzades'}catch(e){exportState.textContent='Error carregant dades'}}function run(k){if(!d)return alert('Les dades encara s’estan carregant.');if(k==='members')return csv('socis_2026.csv',d.members.map(x=>({Numero:x.member_number,Nom:x.full_name,2023:x.active_2023?'SI':'',2024:x.active_2024?'SI':'',2025:x.active_2025?'SI':'',2026:x.active_2026?'SI':''})));if(k==='players')return csv('jugadors_2026.csv',d.players.map(x=>({Nom:x.full_name,NumeroSoci:x.member_number||'',Soci2026:x.is_member?'SI':'NO'})));if(k==='pairs'){const p=new Map(d.players.map(x=>[x.id,x.full_name]));return csv('parelles_2026.csv',d.pairs.map(x=>({Seed:x.seed,Jugador1:p.get(x.player1_id)||'',Jugador2:p.get(x.player2_id)||'',Estat:x.status})))}if(k==='matches')return csv('partits_2026.csv',d.matches.map(x=>({Partit:x.id,Fase:x.stage,Horari:x.scheduled_at,Pista:x.court,Resultat1:x.score1,Resultat2:x.score2,Estat:x.status})));if(k==='registrations')return csv('inscripcions_2026.csv',d.regs.map(x=>({Jugador1:x.player1_name,Modalitat1:x.player1_type,Pagat1:x.player1_paid?'SI':'NO',Import1:x.player1_paid_amount||'',Jugador2:x.player2_name,Modalitat2:x.player2_type,Pagat2:x.player2_paid?'SI':'NO',Import2:x.player2_paid_amount||'',Estat:x.payment_status})));if(k==='payments')return csv('pagaments_2026.csv',d.payments.map(x=>({Nom:x.full_name,Import:x.amount||'',Data:x.payment_date||'',Modalitat:x.registration_type||'',Verificat:x.verified?'SI':'NO'})));if(k==='lunches')return csv('apats_2026.csv',d.lunches.map(x=>({Nom:x.full_name,Bizum:x.bizum_name||'',Estat:x.payment_status,Alta:x.created_at})));if(k==='merch')return csv('merchandising_2026.csv',d.orders.map(x=>({Nom:x.buyer_name,Producte:x.merch_products?.name||'',Talla:x.size||'',Quantitat:x.quantity,Import:x.amount||'',Bizum:x.bizum_name||'',Estat:x.payment_status})));if(k==='notices')return csv('avisos_2026.csv',d.notices.map(x=>({Titol:x.title,Missatge:x.body,Tipus:x.notice_type,Publicat:x.published?'SI':'NO',Data:x.created_at})));if(k==='backup')return json('backup_campionat_frontenis_els_tarongers_2026.json',{exportedAt:new Date().toISOString(),...d})}document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>run(b.dataset.exp));async function start(){if(started)return;started=true;await load()}window.addEventListener('admin:ready',start);window.addEventListener('supabase:change',()=>{if(started)load()});setTimeout(start,1400)})();</script><script src="/professional-shell.js?v=launch3"></script></body></html>
