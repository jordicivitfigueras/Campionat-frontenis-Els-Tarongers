<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horaris · Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><header class="topbar"><a class="brand" href="/admin"><span class="brand-copy"><strong>Torneig 2026</strong><span>Organització</span></span></a><nav class="portal-nav"><a href="/admin">Dashboard</a><a href="/admin/marcador">Marcador</a><a class="active" href="/admin/horaris">Horaris</a><a href="/admin/pagaments">Pagaments</a><a href="/admin/dinars">Dinars</a><a href="/admin/parelles">Parelles</a><a href="/admin/avisos">Avisos</a></nav></header><section class="section"><div class="section-head"><div><div class="eyebrow">Planificació</div><h1 class="section-title">Horaris i pistes</h1></div></div><div class="form-panel"><div class="form-grid"><div class="field"><label>Partit</label><select id="match"></select></div><div class="field"><label>Horari</label><input id="time"></div><div class="field"><label>Pista</label><input id="court" placeholder="Pista 1"></div></div><div class="actions"><button class="btn btn-accent" onclick="saveChange()">Guardar i publicar avís</button></div></div><div id="rows" class="list" style="margin-top:18px"></div></section></div></main><script src="app.js"></script><script>let s=Torneig.loadState();const ids=Torneig.allIds(),sel=document.getElementById('match');sel.innerHTML=ids.map(id=>`<option value="${id}">${id} · ${s.matches[id].stage}</option>`).join('');function fill(){s=Torneig.loadState();const m=s.matches[sel.value];time.value=m.time||'';court.value=m.court||'Pista 1'}function render(){s=Torneig.loadState();rows.innerHTML=ids.map(id=>{const m=s.matches[id];return `<div class="list-item"><div><strong>${id} · ${Torneig.escapeHtml(m.stage)}</strong><div class="meta">${Torneig.escapeHtml(m.time||'Horari pendent')} · ${Torneig.escapeHtml(m.court||'Pista pendent')}</div></div></div>`}).join('')}function saveChange(){s=Torneig.loadState();const m=s.matches[sel.value],old=m.time||'sense hora';m.time=time.value.trim();m.court=court.value.trim()||'Pista 1';Torneig.saveState(s);const p=JSON.parse(localStorage.getItem('torneig2026_portal_data')||'{}');p.notices=p.notices||[];p.notices.push({title:'Canvi d’horari',text:`Partit ${sel.value}: ${old} → ${m.time} · ${m.court}`,date:new Date().toLocaleString()});localStorage.setItem('torneig2026_portal_data',JSON.stringify(p));render();alert('Canvi publicat')}sel.onchange=fill;fill();render();</script></body></html>
