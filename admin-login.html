<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Accés organització · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><section class="section" style="max-width:560px;margin:0 auto;padding-top:8vh!important"><div class="form-panel"><div class="eyebrow">Accés privat</div><h1 class="section-title" style="font-size:52px">Organització</h1><p style="color:#617068;line-height:1.6">Inicia sessió amb l'usuari de Supabase de l'organització. L'accés a marcador, horaris, pagaments i configuració està protegit per rols.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Contrasenya</label><input id="password" type="password" autocomplete="current-password"></div><div id="err" class="production-note" style="display:none;margin-top:14px"></div><div class="actions"><button class="btn btn-accent" onclick="login()">Entrar</button><a class="btn btn-secondary" style="color:#17332a;border:1px solid #dfe6e2" href="/">Tornar a la web</a></div></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>async function login(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,err=document.getElementById('err');err.style.display='none';try{await SupaSync.signIn(e,p);if(!(await SupaSync.isStaff())){SupaSync.signOut();throw new Error('Aquest usuari no té permisos d’organització.')}location.href='/admin';}catch(x){err.textContent=x.message||'No s’ha pogut iniciar sessió';err.style.display='block';}}if(SupaSync.session())SupaSync.isStaff().then(ok=>{if(ok)location.href='/admin'});</script></body></html>
