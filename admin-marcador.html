<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#086443"><title>Marcador · Campionat Frontenis Els Tarongers 2026</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"><style>.ref-app{max-width:1220px;margin:auto}.hero{background:linear-gradient(135deg,#043a28,#08734d);color:#fff;border-radius:28px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:end;box-shadow:0 24px 65px rgba(5,64,43,.22)}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.9;margin:5px 0}.hero p{color:#cfe4da;max-width:620px}.live-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:11px 14px;border-radius:999px;font-weight:900;white-space:nowrap}.selector-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;margin:14px 0;display:grid;grid-template-columns:1.4fr .6fr;gap:12px;box-shadow:var(--shadow)}.selector-card select{font-size:18px!important;font-weight:900!important;padding:15px!important}.match-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.meta-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px}.meta-card span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.meta-card b{display:block;font-size:17px;color:var(--brand);margin-top:3px}.board{display:grid;grid-template-columns:1fr 100px 1fr;gap:14px}.team{background:#fff;border:1px solid var(--border);border-radius:25px;padding:22px;box-shadow:var(--shadow);text-align:center}.team-name{font-size:clamp(20px,3vw,32px);font-weight:950;min-height:70px;display:flex;align-items:center;justify-content:center}.points{font-size:clamp(100px,14vw,160px);font-weight:950;line-height:.9;color:var(--brand);letter-spacing:-.07em}.controls{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:18px}.controls button{min-height:72px;font-size:26px;font-weight:950;border-radius:16px}.versus{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}.vs{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#eef4f0;font-weight:950}.match-no{background:#ffc46e;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:950}.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}.actions button{min-height:58px;font-weight:950}.correction{margin-top:14px;background:#f7faf8;border:1px solid var(--border);border-radius:18px;padding:15px}.cor-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.cor-grid input{font-size:25px!important;text-align:center;font-weight:950}.footlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty{background:#fff7e8;border:1px solid #f1d9aa;border-radius:18px;padding:20px;font-weight:800}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#143d2f;color:#fff;padding:13px 18px;border-radius:14px;font-weight:900;z-index:99;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.hero{align-items:flex-start;flex-direction:column}.selector-card{grid-template-columns:1fr}.match-meta{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}.versus{flex-direction:row}.team{padding:18px}.team-name{min-height:auto}.points{font-size:110px}.actions{grid-template-columns:1fr}.cor-grid{grid-template-columns:1fr 1fr}.cor-grid button{grid-column:1/-1}}@media(max-width:430px){.hero{padding:21px 18px;border-radius:21px}.match-meta{grid-template-columns:1fr 1fr}.points{font-size:96px}.controls button{min-height:68px}}</style></head><body><main class="page"><div class="container"><section class="section ref-app"><div class="hero"><div><div class="eyebrow" style="color:#ffc46e!important">Mode àrbitre · Realtime</div><h1>Marcador</h1><p>Selecciona el partit, posa’l en joc i actualitza el resultat. El marcador públic rep els canvis en directe.</p></div><div class="live-pill" id="syncStatus">● Connectant…</div></div><div class="selector-card"><div class="field"><label>Selecciona partit</label><select id="matchSelect"><option>Carregant partits…</option></select></div><div class="field"><label>Accés ràpid</label><select id="quickSelect"><option value="current">Seleccionat</option><option value="next">Següent preparat</option><option value="live">Partit en joc</option></select></div></div><div class="match-meta"><div class="meta-card"><span>Partit</span><b id="mCode">—</b></div><div class="meta-card"><span>Fase</span><b id="mStage">—</b></div><div class="meta-card"><span>Horari</span><b id="mTime">—</b></div><div class="meta-card"><span>Estat</span><b id="mState">—</b></div></div><div id="board"><div class="empty">Carregant marcador…</div></div><div class="footlinks"><a class="btn btn-secondary" href="/directe" target="_blank">Obrir pantalla pública</a><a class="btn btn-secondary" href="/resultats" target="_blank">Resultats</a><a class="btn btn-secondary" href="/quadre" target="_blank">Quadre</a></div></section></div></main><div class="toast" id="toastBox"></div><script src="/app.js"></script><script>(function(){const $=id=>document.getElementById(id);const refs={match:$('matchSelect'),quick:$('quickSelect'),board:$('board'),code:$('mCode'),stage:$('mStage'),time:$('mTime'),state:$('mState'),sync:$('syncStatus'),toast:$('toastBox')};let started=false,ids=[];function toast(t){refs.toast.textContent=t;refs.toast.classList.add('show');clearTimeout(window.__refToast);window.__refToast=setTimeout(()=>refs.toast.classList.remove('show'),1700)}function label(m){return m.status==='final'?'Finalitzat':m.status==='en joc'?'EN JOC':m.team1&&m.team2?'Preparat':'Pendent'}function selectedState(){const s=Torneig.loadState(),id=refs.match.value;return {s,id,m:s.matches[id]}}function populate(keep){const s=Torneig.loadState();ids=Torneig.allIds();const prev=keep||refs.match.value;refs.match.innerHTML=ids.map(id=>{const m=s.matches[id];const teams=m.team1&&m.team2?`${Torneig.pairName(m.team1)} vs ${Torneig.pairName(m.team2)}`:'Per definir';return `<option value="${id}">${id==='FINAL'?'FINAL':'Partit '+id} · ${teams}</option>`}).join('');refs.match.value=ids.includes(prev)?prev:(s.activeMatch&&ids.includes(s.activeMatch)?s.activeMatch:ids[0]);draw()}function draw(){const {s,id,m}=selectedState();if(!m){refs.board.innerHTML='<div class="empty">No s’ha pogut carregar aquest partit.</div>';return}const ready=!!(m.team1&&m.team2),locked=m.status==='final',t1=Torneig.escapeHtml(Torneig.pairName(m.team1)||'Per definir'),t2=Torneig.escapeHtml(Torneig.pairName(m.team2)||'Per definir');refs.code.textContent=id==='FINAL'?'FINAL':'#'+id;refs.stage.textContent=m.stage||Torneig.stageOf(id)||'—';refs.time.textContent=m.time||'Pendent';refs.state.textContent=label(m);refs.state.style.color=m.status==='en joc'?'#e17c00':m.status==='final'?'#087348':'';refs.board.innerHTML=`<div class="board"><section class="team"><div class="team-name">${t1}</div><div class="points">${m.s1||0}</div><div class="controls"><button class="btn btn-secondary" ${!ready||locked?'disabled':''} data-side="1" data-d="-1">−1</button><button class="btn btn-accent" ${!ready||locked?'disabled':''} data-side="1" data-d="1">+1</button></div></section><div class="versus"><div class="match-no">${id==='FINAL'?'FINAL':'PARTIT '+id}</div><div class="vs">VS</div></div><section class="team"><div class="team-name">${t2}</div><div class="points">${m.s2||0}</div><div class="controls"><button class="btn btn-secondary" ${!ready||locked?'disabled':''} data-side="2" data-d="-1">−1</button><button class="btn btn-accent" ${!ready||locked?'disabled':''} data-side="2" data-d="1">+1</button></div></section></div><div class="actions">${locked?`<button class="btn btn-accent" id="reopenBtn">Reobrir per corregir</button><button class="btn btn-secondary" disabled>Resultat ${m.s1}–${m.s2}</button>`:`<button class="btn btn-primary" id="finishBtn" ${!ready?'disabled':''}>✓ Finalitzar partit</button><button class="btn btn-secondary" id="liveBtn" ${!ready?'disabled':''}>● Posar EN JOC</button>`}</div><div class="correction"><div class="team-label">Correcció manual</div><div class="cor-grid"><div class="field"><label>${t1}</label><input id="scoreA" type="number" min="0" inputmode="numeric" value="${m.s1||0}" ${locked?'disabled':''}></div><div class="field"><label>${t2}</label><input id="scoreB" type="number" min="0" inputmode="numeric" value="${m.s2||0}" ${locked?'disabled':''}></div><button id="applyBtn" class="btn btn-secondary" ${!ready||locked?'disabled':''}>Aplicar</button></div></div>`;refs.board.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>change(+b.dataset.side,+b.dataset.d));const live=$('liveBtn'),finish=$('finishBtn'),reopen=$('reopenBtn'),apply=$('applyBtn');if(live)live.onclick=markLive;if(finish)finish.onclick=finishMatch;if(reopen)reopen.onclick=reopenMatch;if(apply)apply.onclick=applyManual}function save(s){s.activeMatch=refs.match.value;Torneig.saveState(s)}function change(side,d){const {s,m}=selectedState();if(!m||m.status==='final')return;const k=side===1?'s1':'s2';m[k]=Math.max(0,(m[k]||0)+d);m.status='en joc';save(s);draw()}function markLive(){const {s,m}=selectedState();if(!m?.team1||!m?.team2)return;m.status='en joc';save(s);draw();toast('Partit en joc · enviant en directe')}function applyManual(){const {s,m}=selectedState();if(!m||m.status==='final')return;m.s1=Math.max(0,Number($('scoreA').value)||0);m.s2=Math.max(0,Number($('scoreB').value)||0);m.status=(m.s1||m.s2)?'en joc':'pendent';save(s);draw();toast('Marcador corregit')}function finishMatch(){const {s,id,m}=selectedState();if(!m?.team1||!m?.team2)return;if(m.s1===m.s2)return alert('El partit no pot acabar empatat.');if(!confirm(`Confirmes ${m.s1}–${m.s2}?`))return;Torneig.finalizeMatch(s,id);draw();toast('Partit finalitzat')}function reopenMatch(){const {s,m}=selectedState();if(!confirm('Reobrir aquest partit?'))return;m.status='en joc';Torneig.propagate(s);save(s);draw()}function quick(){const s=Torneig.loadState();if(refs.quick.value==='next')refs.match.value=Torneig.nextPending(s,refs.match.value);if(refs.quick.value==='live'){const id=ids.find(x=>s.matches[x]?.status==='en joc');if(id)refs.match.value=id;else toast('No hi ha cap partit en joc')}refs.quick.value='current';draw()}function init(){if(started)return;started=true;refs.match.onchange=()=>{const s=Torneig.loadState();s.activeMatch=refs.match.value;save(s);draw()};refs.quick.onchange=quick;refs.sync.textContent='● Realtime actiu';populate()}window.addEventListener('admin:ready',init);window.addEventListener('supabase:change',()=>{if(started)populate(refs.match.value)});window.addEventListener('supabase:realtime',e=>{if(e.detail?.status==='SUBSCRIBED')refs.sync.textContent='● Realtime actiu'});setTimeout(()=>{if(!started&&window.Torneig)init()},1800)})();</script><script src="/professional-shell.js"></script></body></html>
