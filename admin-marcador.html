<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcador · Torneig 2026</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><header class="topbar"><a class="brand" href="/admin"><span class="brand-copy"><strong>Torneig 2026</strong><span>Organització</span></span></a><nav class="portal-nav"><a href="/admin">Dashboard</a><a class="active" href="/admin/marcador">Marcador</a><a href="/admin/horaris">Horaris</a><a href="/admin/pagaments">Pagaments</a><a href="/admin/dinars">Dinars</a><a href="/admin/parelles">Parelles</a><a href="/admin/avisos">Avisos</a></nav></header><section class="section"><div class="section-head"><div><div class="eyebrow">Arbitratge</div><h1 class="section-title">Marcador</h1></div></div><div class="form-panel"><div class="field"><label>Partit</label><select id="match"></select></div><div id="score" style="margin-top:18px"></div></div></section></div></main><script src="app.js"></script><script>let s=Torneig.loadState();const ids=Torneig.allIds();const sel=document.getElementById('match');sel.innerHTML=ids.map(id=>`<option value="${id}">${id} · ${s.matches[id].stage}</option>`).join('');function draw(){s=Torneig.loadState();const m=s.matches[sel.value];document.getElementById('score').innerHTML=`<div class="score-grid"><div class="score-card"><div class="team">${Torneig.escapeHtml(Torneig.pairName(m.team1)||'Per definir')}</div><div class="score">${m.s1}</div><div class="score-buttons"><button class="btn btn-accent" onclick="add(1,1)">+1</button><button class="btn btn-secondary" onclick="add(1,-1)">−1</button></div></div><div class="score-card"><div class="team">${Torneig.escapeHtml(Torneig.pairName(m.team2)||'Per definir')}</div><div class="score">${m.s2}</div><div class="score-buttons"><button class="btn btn-accent" onclick="add(2,1)">+1</button><button class="btn btn-secondary" onclick="add(2,-1)">−1</button></div></div></div><div class="actions"><button class="btn btn-dark" onclick="finish()">Finalitzar partit</button></div>`}function add(side,d){s=Torneig.loadState();const id=sel.value,m=s.matches[id];const k=side===1?'s1':'s2';m[k]=Math.max(0,m[k]+d);m.status='en joc';Torneig.saveState(s);draw()}function finish(){s=Torneig.loadState();const m=s.matches[sel.value];if(m.s1===m.s2){alert('No pot acabar empatat');return}Torneig.finalizeMatch(s,sel.value);Torneig.saveState(s);draw()}sel.onchange=draw;draw();</script></body></html>
