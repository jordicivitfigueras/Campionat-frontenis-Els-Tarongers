<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Marcador · Campionat Frontenis Els Tarongers 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.ref-wrap{max-width:1180px;margin:0 auto}.ref-top{display:grid;grid-template-columns:1.5fr .5fr;gap:16px;align-items:start}.ref-header{background:linear-gradient(135deg,#043a28,#086443);color:#fff;border-radius:24px;padding:26px 28px;box-shadow:0 18px 50px rgba(7,63,42,.18)}.ref-header .eyebrow{color:#f5bd68!important}.ref-header h1{font-size:clamp(38px,5vw,64px);line-height:.92;margin:6px 0 10px}.ref-header p{color:rgba(255,255,255,.75);margin:0}.ref-status{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.ref-status .big{font-size:28px;font-weight:950;color:var(--brand)}.ref-selector{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin:16px 0}.scoreboard{display:grid;grid-template-columns:1fr 120px 1fr;gap:14px;align-items:stretch}.team-panel{background:#fff;border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:370px}.team-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.team-name{font-size:clamp(20px,2.6vw,32px);font-weight:950;line-height:1.06;margin:8px 0 18px;color:var(--text);min-height:68px}.score-value{font-size:clamp(92px,12vw,150px);font-weight:950;line-height:.8;color:var(--brand);margin:auto 0;text-align:center}.score-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.score-controls button{min-height:64px;font-size:24px;font-weight:950}.vs-panel{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}.vs-badge{width:70px;height:70px;border-radius:50%;background:#eef3f0;display:grid;place-items:center;font-weight:950;color:var(--muted)}.match-chip{font-size:12px;font-weight:950;background:var(--accent);padding:8px 11px;border-radius:999px}.ref-info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.ref-info-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px}.ref-info-card b{display:block;color:var(--brand);font-size:16px}.ref-info-card span{font-size:11px;color:var(--muted)}.direct-edit{background:#f7faf8;border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px}.direct-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.direct-grid input{font-size:28px;text-align:center;font-weight:950}.primary-actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}.primary-actions .btn{min-height:54px;font-size:14px;font-weight:950}.ref-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.ref-links{display:flex;gap:8px;flex-wrap:wrap}.danger-zone{border-top:1px solid var(--border);margin-top:18px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:#0b6b49}.sync-dot{width:8px;height:8px;border-radius:50%;background:#18a66a}.locked{opacity:.62}.finish-summary{background:#eff8f3;border:1px solid #cfe7d8;border-radius:16px;padding:14px;margin-top:14px}.finish-summary strong{color:#0b6b49}.toast{position:fixed;right:22px;bottom:22px;background:#123b2d;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.2);z-index:999;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.ref-top,.ref-selector{grid-template-columns:1fr}.scoreboard{grid-template-columns:1fr}.vs-panel{flex-direction:row}.team-panel{min-height:300px}.ref-info{grid-template-columns:1fr 1fr}.direct-grid{grid-template-columns:1fr 1fr}.direct-grid button{grid-column:1/-1}.primary-actions{grid-template-columns:1fr}}@media(max-width:560px){.ref-header{padding:22px 18px}.team-panel{padding:18px}.score-value{font-size:104px}.score-controls button{min-height:72px}.ref-info{grid-template-columns:1fr 1fr}.team-name{min-height:auto}.danger-zone{align-items:flex-start;flex-direction:column}}</style></head><body><main class="page"><div class="container"><section class="section ref-wrap"><div class="ref-top"><div class="ref-header"><div class="eyebrow">Mode arbitratge · Edició 2026</div><h1>Marcador</h1><p>Pantalla operativa per gestionar el partit, validar el resultat i propagar automàticament els encreuaments.</p></div><aside class="ref-status"><div class="team-label">Estat del sistema</div><div id="stateLabel" class="big">—</div><div class="sync-badge"><span class="sync-dot"></span> Supabase connectat</div><div style="margin-top:12px" class="team-label">Progrés</div><div id="progressLabel" style="font-weight:950;font-size:22px">0/56</div></aside></div><div class="form-panel ref-selector"><div class="field"><label>Partit</label><select id="match"></select></div><div class="field"><label>Accés ràpid</label><select id="quick"><option value="current">Partit seleccionat</option><option value="next">Següent preparat</option><option value="live">Partit en joc</option></select></div></div><div class="ref-info"><div class="ref-info-card"><span>Partit</span><b id="matchCode">—</b></div><div class="ref-info-card"><span>Fase</span><b id="matchStage">—</b></div><div class="ref-info-card"><span>Horari</span><b id="timeLabel">—</b></div><div class="ref-info-card"><span>Pista</span><b id="courtLabel">—</b></div></div><div id="score"></div><div class="ref-bottom"><div class="ref-links"><a class="btn btn-secondary" href="/directe" target="_blank">Pantalla en directe</a><a class="btn btn-secondary" href="/quadre" target="_blank">Quadre</a><a class="btn btn-secondary" href="/resultats" target="_blank">Resultats</a></div><button class="btn btn-primary" onclick="quickNext()">Següent partit preparat →</button></div></section></div></main><div id="toast" class="toast"></div><script src="app.js"></script><script>let s=Torneig.loadState();const ids=Torneig.allIds(),sel=match;sel.innerHTML=ids.map(id=>`<option value="${id}">${id} · ${s.matches[id].stage||Torneig.stageOf(id)||''}</option>`).join('');function statusText(m){return m.status==='final'?'Finalitzat':m.status==='en joc'?'En joc':m.team1&&m.team2?'Preparat':'Pendent'}function notify(x){toast.textContent=x;toast.classList.add('show');clearTimeout(window.__to);window.__to=setTimeout(()=>toast.classList.remove('show'),1800)}function draw(){s=Torneig.loadState();const m=s.matches[sel.value],ready=m.team1&&m.team2,locked=m.status==='final';matchCode.textContent=m.id;matchStage.textContent=m.stage||Torneig.stageOf(m.id)||'';stateLabel.textContent=statusText(m);stateLabel.style.color=m.status==='en joc'?'#f39a20':m.status==='final'?'#0b6b49':'#1b3028';timeLabel.textContent=m.time||'Pendent';courtLabel.textContent=m.court||'Pista 1';progressLabel.textContent=`${ids.filter(id=>s.matches[id].status==='final').length}/56`;const t1=Torneig.escapeHtml(Torneig.pairName(m.team1)||'Per definir'),t2=Torneig.escapeHtml(Torneig.pairName(m.team2)||'Per definir');score.innerHTML=`<div class="scoreboard ${locked?'locked':''}"><section class="team-panel"><div class="team-label">Parella 1</div><div class="team-name">${t1}</div><div class="score-value">${m.s1}</div><div class="score-controls"><button class="btn btn-secondary" ${!ready||locked?'disabled':''} onclick="add(1,-1)">−1</button><button class="btn btn-accent" ${!ready||locked?'disabled':''} onclick="add(1,1)">+1</button></div></section><div class="vs-panel"><div class="match-chip">${m.id==='FINAL'?'FINAL':'Partit '+m.id}</div><div class="vs-badge">VS</div></div><section class="team-panel"><div class="team-label">Parella 2</div><div class="team-name">${t2}</div><div class="score-value">${m.s2}</div><div class="score-controls"><button class="btn btn-secondary" ${!ready||locked?'disabled':''} onclick="add(2,-1)">−1</button><button class="btn btn-accent" ${!ready||locked?'disabled':''} onclick="add(2,1)">+1</button></div></section></div>${locked?`<div class="finish-summary"><strong>Partit finalitzat · ${m.s1}–${m.s2}</strong><div class="meta">Si el resultat és incorrecte, reobre el partit abans de modificar-lo.</div></div>`:''}<div class="direct-edit"><div class="team-label">Correcció manual del marcador</div><div class="direct-grid"><div class="field"><label>${t1}</label><input id="direct1" inputmode="numeric" type="number" min="0" value="${m.s1}" ${locked?'disabled':''}></div><div class="field"><label>${t2}</label><input id="direct2" inputmode="numeric" type="number" min="0" value="${m.s2}" ${locked?'disabled':''}></div><button class="btn btn-secondary" ${!ready||locked?'disabled':''} onclick="applyDirect()">Aplicar</button></div></div><div class="primary-actions">${locked?`<button class="btn btn-accent" onclick="reopen()">Reobrir per corregir</button><button class="btn btn-secondary" disabled>Resultat bloquejat</button>`:`<button class="btn btn-primary" ${!ready?'disabled':''} onclick="finish()">✓ Finalitzar partit i propagar</button><button class="btn btn-secondary" ${!ready?'disabled':''} onclick="markLive()">● Marcar en joc</button>`}</div><div class="danger-zone"><div><strong>Accions de seguretat</strong><div class="meta">Reiniciar només si realment vols esborrar el marcador actual.</div></div><button class="btn btn-danger" onclick="resetScore()">Reiniciar marcador</button></div>`}function add(side,d){s=Torneig.loadState();const m=s.matches[sel.value],k=side===1?'s1':'s2';if(m.status==='final')return;m[k]=Math.max(0,(m[k]||0)+d);m.status='en joc';Torneig.saveState(s);draw()}function markLive(){s=Torneig.loadState();const m=s.matches[sel.value];if(!m.team1||!m.team2)return;m.status='en joc';Torneig.saveState(s);draw();notify('Partit marcat en joc')}function applyDirect(){s=Torneig.loadState();const m=s.matches[sel.value];if(m.status==='final')return;const a=Math.max(0,Number(direct1.value)||0),b=Math.max(0,Number(direct2.value)||0);m.s1=a;m.s2=b;m.status=(a||b)?'en joc':'pendent';Torneig.saveState(s);draw();notify('Marcador actualitzat')}function finish(){s=Torneig.loadState();const m=s.matches[sel.value];if(!m.team1||!m.team2)return alert('Les dues parelles han d’estar definides.');if(m.s1===m.s2)return alert('El partit no pot acabar empatat.');if(!confirm(`Confirmes el resultat final del partit ${sel.value}: ${m.s1}–${m.s2}?\n\nAixò actualitzarà els següents encreuaments.`))return;Torneig.finalizeMatch(s,sel.value);draw();notify('Partit finalitzat i quadre actualitzat')}function reopen(){if(!confirm('Reobrir aquest partit? Podràs corregir el marcador i tornar-lo a finalitzar.'))return;s=Torneig.loadState();const m=s.matches[sel.value];m.status='en joc';Torneig.propagate(s);Torneig.saveState(s);draw();notify('Partit reobert')}function resetScore(){if(!confirm('Segur que vols posar aquest marcador a 0–0?'))return;s=Torneig.loadState();const m=s.matches[sel.value];if(m.status==='final'){m.status='pendent';m.s1=0;m.s2=0;Torneig.propagate(s)}else{m.s1=0;m.s2=0;m.status='pendent'}Torneig.saveState(s);draw();notify('Marcador reiniciat')}function quickSelect(){s=Torneig.loadState();if(quick.value==='next'){sel.value=Torneig.nextPending(s,sel.value)}else if(quick.value==='live'){const id=ids.find(id=>s.matches[id].status==='en joc');if(id)sel.value=id}draw()}function quickNext(){s=Torneig.loadState();sel.value=Torneig.nextPending(s,sel.value);quick.value='current';draw()}sel.onchange=draw;quick.onchange=quickSelect;window.addEventListener('supabase:change',draw);draw();</script><script src="professional-shell.js"></script></body></html>
