<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Marcador · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Arbitratge</div><h1 class="section-title">Marcador</h1></div></div><div class="grid grid-2"><div class="form-panel"><div class="form-grid"><div class="field"><label>Partit</label><select id="match"></select></div><div class="field"><label>Estat</label><div id="status" class="chip" style="min-height:44px;display:flex;align-items:center"></div></div></div><div id="score" style="margin-top:18px"></div></div><div class="form-panel"><h2 style="margin-top:0">Dades del partit</h2><div id="meta"></div><div class="actions"><a class="btn btn-primary" href="/quadre" target="_blank">Obrir quadre públic</a><a class="btn btn-secondary" style="color:#111;border:1px solid #ddd" href="/resultats" target="_blank">Veure resultats</a></div><div class="production-note" style="margin-top:15px">Finalitzar un partit propaga automàticament guanyador i perdedor als següents encreuaments del quadre.</div></div></div></section></div></main><script src="app.js"></script><script>let s=Torneig.loadState();const ids=Torneig.allIds(),sel=document.getElementById('match');sel.innerHTML=ids.map(id=>`<option value="${id}">${id} · ${s.matches[id].stage||Torneig.stageOf(id)||''}</option>`).join('');function draw(){s=Torneig.loadState();const m=s.matches[sel.value],ready=m.team1&&m.team2;document.getElementById('status').textContent=m.status==='final'?'Finalitzat':m.status==='en joc'?'En joc':ready?'Preparat':'Pendent de definir';document.getElementById('meta').innerHTML=`<div class="list"><div class="list-item"><div><strong>${Torneig.escapeHtml(m.time||'Horari pendent')}</strong><div class="meta">${Torneig.escapeHtml(m.court||'Pista 1')}</div></div></div><div class="list-item"><div><strong>${Torneig.escapeHtml(m.stage||Torneig.stageOf(m.id)||'')}</strong><div class="meta">Partit ${m.id}</div></div></div></div>`;document.getElementById('score').innerHTML=`<div class="score-grid"><div class="score-card"><div class="team">${Torneig.escapeHtml(Torneig.pairName(m.team1)||'Per definir')}</div><div class="score">${m.s1}</div><div class="score-buttons"><button class="btn btn-accent" ${!ready||m.status==='final'?'disabled':''} onclick="add(1,1)">+1</button><button class="btn btn-secondary" ${!ready||m.status==='final'?'disabled':''} onclick="add(1,-1)">−1</button></div></div><div class="score-card"><div class="team">${Torneig.escapeHtml(Torneig.pairName(m.team2)||'Per definir')}</div><div class="score">${m.s2}</div><div class="score-buttons"><button class="btn btn-accent" ${!ready||m.status==='final'?'disabled':''} onclick="add(2,1)">+1</button><button class="btn btn-secondary" ${!ready||m.status==='final'?'disabled':''} onclick="add(2,-1)">−1</button></div></div></div><div class="actions"><button class="btn btn-dark" ${!ready||m.status==='final'?'disabled':''} onclick="finish()">Finalitzar partit</button><button class="btn btn-danger" onclick="resetScore()">Reiniciar marcador</button></div>`}function add(side,d){s=Torneig.loadState();const m=s.matches[sel.value],k=side===1?'s1':'s2';if(m.status==='final')return;m[k]=Math.max(0,m[k]+d);m.status='en joc';Torneig.saveState(s);draw()}function finish(){s=Torneig.loadState();const m=s.matches[sel.value];if(!m.team1||!m.team2){alert('Les dues parelles han d’estar definides.');return}if(m.s1===m.s2){alert('El partit no pot acabar empatat.');return}if(!confirm(`Finalitzar ${sel.value} amb resultat ${m.s1}-${m.s2}?`))return;Torneig.finalizeMatch(s,sel.value);Torneig.saveState(s);draw()}function resetScore(){if(!confirm('Reiniciar el marcador d’aquest partit?'))return;s=Torneig.loadState();const m=s.matches[sel.value];m.s1=0;m.s2=0;if(m.status!=='final')m.status='pendent';Torneig.saveState(s);draw()}sel.onchange=draw;draw();</script><script src="professional-shell.js"></script></body></html>
