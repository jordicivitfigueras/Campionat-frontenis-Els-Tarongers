<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Merchandising · Admin</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="admin-hero"><div class="eyebrow">Comandes</div><h1>Merchandising</h1><p>Control de comandes, talles, imports i pagaments des d’una sola pantalla.</p><div class="admin-status-row"><span class="admin-status"><span class="dot"></span>Supabase actiu</span><span class="admin-status" id="state">Carregant…</span></div></div><div class="dashboard-grid"><div class="quick-card"><div class="qtitle">Comandes</div><div id="ordersKpi" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Unitats</div><div id="unitsKpi" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Pagades</div><div id="paidKpi" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Import previst</div><div id="amountKpi" class="qvalue">—</div></div></div><div class="form-panel"><div class="form-grid"><div class="field"><label>Buscar</label><input id="search" placeholder="Nom, producte o talla"></div><div class="field"><label>Estat</label><select id="filter"><option value="all">Tots</option><option value="pending">Pendents</option><option value="verified">Pagats</option></select></div></div></div><div class="form-panel" style="padding:0!important;overflow:auto;margin-top:14px"><table class="admin-table"><thead><tr><th>Persona</th><th>Producte</th><th>Talla</th><th>Unitats</th><th>Import</th><th>Pagament</th><th>Accions</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>(function(){let data=[],started=false;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function wait(){for(let i=0;i<100;i++){if(window.SupaSync?.req)return;await new Promise(r=>setTimeout(r,75))}throw new Error('Supabase no disponible')}async function load(){await wait();data=await SupaSync.req('/rest/v1/merch_orders?order=created_at.asc&select=id,buyer_name,size,quantity,amount,bizum_name,payment_status,created_at,merch_products(name)')||[];$('ordersKpi').textContent=data.length;$('unitsKpi').textContent=data.reduce((a,x)=>a+Number(x.quantity||0),0);$('paidKpi').textContent=data.filter(x=>x.payment_status==='verified').length;$('amountKpi').textContent=data.reduce((a,x)=>a+Number(x.amount||0),0).toFixed(0)+' €';$('state').textContent=`${data.length} comandes`;render()}function render(){const q=$('search').value.toLowerCase().trim(),f=$('filter').value,out=data.filter(x=>{const st=x.payment_status==='verified'?'verified':'pending';return(f==='all'||st===f)&&(!q||`${x.buyer_name} ${x.merch_products?.name||''} ${x.size||''}`.toLowerCase().includes(q))});$('rows').innerHTML=out.map(x=>`<tr><td><strong>${esc(x.buyer_name)}</strong><div class="meta">${esc(x.bizum_name||'Sense nom Bizum')}</div></td><td>${esc(x.merch_products?.name||'Producte')}</td><td>${esc(x.size||'—')}</td><td>${Number(x.quantity||1)}</td><td><strong>${Number(x.amount||0).toFixed(0)} €</strong></td><td><span class="badge ${x.payment_status==='verified'?'green':'orange'}">${x.payment_status==='verified'?'Pagat':x.payment_status==='bizum_sent'?'Bizum enviat':'Pendent'}</span></td><td><div class="actions">${x.payment_status==='verified'?'':`<button class="btn btn-primary" onclick="verifyOrder('${x.id}')">Verificar</button>`}<button class="btn btn-secondary" onclick="deleteOrder('${x.id}')">Eliminar</button></div></td></tr>`).join('')||'<tr><td colspan="7">No hi ha comandes amb aquests filtres.</td></tr>'}window.verifyOrder=async id=>{await SupaSync.req(`/rest/v1/merch_orders?id=eq.${id}`,{method:'PATCH',body:{payment_status:'verified'}});await load()};window.deleteOrder=async id=>{if(!confirm('Eliminar aquesta comanda?'))return;await SupaSync.req(`/rest/v1/merch_orders?id=eq.${id}`,{method:'DELETE'});await load()};$('search').oninput=render;$('filter').onchange=render;async function start(){if(started)return;started=true;try{await load()}catch(e){$('state').textContent='Error carregant dades'}}window.addEventListener('admin:ready',start);window.addEventListener('supabase:change',()=>{if(started)load()});setTimeout(start,1200)})();</script><script src="/professional-shell.js?v=launch2"></script></body></html>
