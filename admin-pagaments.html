<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagaments · Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="container"><header class="topbar"><a class="brand" href="/admin"><span class="brand-copy"><strong>Torneig 2026</strong><span>Organització</span></span></a><nav class="portal-nav"><a href="/admin">Dashboard</a><a href="/admin/marcador">Marcador</a><a href="/admin/horaris">Horaris</a><a class="active" href="/admin/pagaments">Pagaments</a><a href="/admin/dinars">Dinars</a><a href="/admin/parelles">Parelles</a><a href="/admin/avisos">Avisos</a></nav></header><section class="section"><div class="section-head"><div><div class="eyebrow">Bizum</div><h1 class="section-title">Pagaments</h1></div></div><div class="notice-card" style="margin-bottom:16px"><strong>Flux de pagament</strong><div class="meta">Pendent → Bizum enviat → Verificat per l'organització</div></div><div class="form-panel" style="padding:0;overflow:auto"><table class="admin-table"><thead><tr><th>Concepte</th><th>Referència</th><th>Import</th><th>Estat</th><th>Acció</th></tr></thead><tbody id="payments"></tbody></table></div></section></div></main><script src="portal.js"></script><script>function render(){const s=Portal.load();const arr=s.payments||[];document.getElementById('payments').innerHTML=arr.length?arr.map((p,i)=>`<tr><td>${Portal.esc(p.kind||p.type||'Pagament')}</td><td>${Portal.esc(p.ref||p.name||'')}</td><td>${p.amount??0} €</td><td><span class="badge ${p.status==='verificat'?'':'orange'}">${Portal.esc((p.status||'pendent').replace('_',' '))}</span></td><td>${p.status==='verificat'?'✓':`<button class="btn btn-accent" onclick="verify(${i})">Verificar</button>`}</td></tr>`).join(''):'<tr><td colspan="5">Encara no hi ha pagaments.</td></tr>'}function verify(i){const s=Portal.load();s.payments[i].status='verificat';Portal.save(s);render()}render();</script></body></html>
