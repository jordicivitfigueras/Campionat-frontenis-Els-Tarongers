<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Pagaments · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Control Bizum</div><h1 class="section-title">Pagaments</h1></div></div><div class="bizum-flow"><div class="bizum-step"><b>Pendent</b>Reserva o comanda registrada sense confirmació de Bizum.</div><div class="bizum-step"><b>Bizum enviat</b>L'usuari declara haver fet el pagament.</div><div class="bizum-step"><b>Verificat</b>L'organització comprova el Bizum i valida el pagament.</div></div><div class="form-panel"><div class="form-grid"><div class="field"><label>Filtrar</label><select id="filter"><option value="all">Tots</option><option value="bizum_enviat">Pendents de verificar</option><option value="verificat">Verificats</option></select></div><div class="field"><label>Buscar</label><input id="search" placeholder="Nom o concepte"></div></div></div><div class="form-panel" style="padding:0;overflow:auto;margin-top:14px"><table class="admin-table"><thead><tr><th>Concepte</th><th>Nom / referència</th><th>Bizum</th><th>Import</th><th>Estat</th><th>Acció</th></tr></thead><tbody id="payments"></tbody></table></div></section></div></main><script src="portal.js"></script><script>function render(){const s=Portal.load(),f=filter.value,q=search.value.toLowerCase();const arr=(s.payments||[]).map((p,i)=>({...p,_i:i})).filter(p=>(f==='all'||p.status===f)&&JSON.stringify(p).toLowerCase().includes(q));payments.innerHTML=arr.length?arr.map(p=>`<tr><td>${Portal.esc(p.kind||p.type||'Pagament')}</td><td>${Portal.esc(p.ref||p.name||'')}</td><td>${Portal.esc(p.bizumName||'—')}</td><td><strong>${p.amount??0} €</strong></td><td><span class="badge ${p.status==='verificat'?'green':'orange'}">${Portal.esc((p.status||'pendent').replace('_',' '))}</span></td><td>${p.status==='verificat'?'✓ Verificat':`<button class="btn btn-accent" onclick="verify(${p._i})">Verificar</button>`}</td></tr>`).join(''):'<tr><td colspan="6">No hi ha pagaments amb aquests filtres.</td></tr>'}async function verify(i){const s=Portal.load(),p=s.payments[i];if(!p)return;if(!confirm('Marcar aquest pagament com a verificat?'))return;try{if(window.SupaSync&&p.dbId)await SupaSync.verifyPayment(p);p.status='verificat';Portal.save(s);if(window.SupaSync)await SupaSync.hydratePortal();render()}catch(e){alert('No s’ha pogut verificar: '+e.message)}}filter.onchange=render;search.oninput=render;window.addEventListener('supabase:ready',render);window.addEventListener('supabase:change',render);render();</script><script src="professional-shell.js"></script></body></html>
