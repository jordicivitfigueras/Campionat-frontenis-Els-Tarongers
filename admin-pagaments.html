<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Pagaments · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Control Bizum</div><h1 class="section-title">Pagaments</h1></div></div><div class="bizum-flow"><div class="bizum-step"><b>Pendent</b>Reserva o comanda registrada sense confirmació de Bizum.</div><div class="bizum-step"><b>Bizum enviat</b>L'usuari declara haver fet el pagament.</div><div class="bizum-step"><b>Verificat</b>L'organització comprova el Bizum i valida el pagament.</div></div><div class="form-panel"><div class="form-grid"><div class="field"><label>Filtrar</label><select id="filter"><option value="all">Tots</option><option value="bizum_enviat">Pendents de verificar</option><option value="verificat">Verificats</option></select></div><div class="field"><label>Buscar</label><input id="search" placeholder="Nom o concepte"></div></div></div><div class="form-panel" style="padding:0;overflow:auto;margin-top:14px"><table class="admin-table"><thead><tr><th>Concepte</th><th>Nom / referència</th><th>Bizum</th><th>Import</th><th>Estat</th><th>Acció</th></tr></thead><tbody id="payments"></tbody></table></div></section></div></main><script src="portal.js"></script><script>function render(){const s=Portal.load(),f=document.getElementById('filter').value,q=document.getElementById('search').value.toLowerCase();const arr=(s.payments||[]).map((p,i)=>({...p,_i:i})).filter(p=>(f==='all'||p.status===f)&&JSON.stringify(p).toLowerCase().includes(q));document.getElementById('payments').innerHTML=arr.length?arr.map(p=>`<tr><td>${Portal.esc(p.kind||p.type||'Pagament')}</td><td>${Portal.esc(p.ref||p.name||'')}</td><td>${Portal.esc(p.bizumName||'—')}</td><td><strong>${p.amount??0} €</strong></td><td><span class="badge ${p.status==='verificat'?'green':'orange'}">${Portal.esc((p.status||'pendent').replace('_',' '))}</span></td><td>${p.status==='verificat'?'✓ Verificat':`<button class="btn btn-accent" onclick="verify(${p._i})">Verificar</button>`}</td></tr>`).join(''):'<tr><td colspan="6">No hi ha pagaments amb aquests filtres.</td></tr>'}function verify(i){const s=Portal.load(),p=s.payments[i];if(!p)return;p.status='verificat';const ref=(p.ref||'').toLowerCase();(s.tournamentRegistrations||[]).forEach(r=>{if(ref.includes((r.p1||'').toLowerCase())||ref.includes((r.p2||'').toLowerCase()))r.status='verificat'});Object.keys(s.lunches||{}).forEach(k=>(s.lunches[k]||[]).forEach(x=>{if(typeof x==='object'&&ref.includes((x.name||'').toLowerCase()))x.status='verificat'}));(s.merchOrders||[]).forEach(o=>{if(ref.includes((o.buyer||'').toLowerCase()))o.status='verificat'});Portal.save(s);render()}document.getElementById('filter').onchange=render;document.getElementById('search').oninput=render;render();</script><script src="professional-shell.js"></script></body></html>
