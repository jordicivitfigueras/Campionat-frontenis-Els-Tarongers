<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Parelles · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Participants</div><h1 class="section-title">Parelles</h1></div></div><div class="form-panel"><div class="field"><label>Buscar jugador o parella</label><input id="search" placeholder="Nom o cognom"></div></div><div class="dashboard-grid" style="margin-top:14px"><div class="quick-card"><div class="qtitle">Quadre</div><div id="pairCount" class="qvalue">0</div><div class="meta">parelles carregades</div></div><div class="quick-card"><div class="qtitle">Inscripcions web</div><div id="regCount" class="qvalue">0</div><div class="meta">sol·licituds rebudes</div></div><div class="quick-card"><div class="qtitle">Màxim</div><div class="qvalue">32</div><div class="meta">places disponibles</div></div></div><h2 class="section-title" style="font-size:36px;margin-top:28px">Parelles del quadre</h2><div id="pairs" class="list"></div><h2 class="section-title" style="font-size:36px;margin-top:32px">Inscripcions rebudes</h2><div id="registrations" class="list"></div></section></div></main><script src="app.js"></script><script src="portal.js"></script><script>function render(){const s=Torneig.loadState(),p=Portal.load(),q=document.getElementById('search').value.toLowerCase(),pairs=(s.pairs||[]).filter(x=>Torneig.pairName(x).toLowerCase().includes(q)),regs=(p.tournamentRegistrations||[]).filter(r=>`${r.p1||''} ${r.p2||''}`.toLowerCase().includes(q));document.getElementById('pairCount').textContent=(s.pairs||[]).filter(x=>Torneig.pairName(x)).length;document.getElementById('regCount').textContent=(p.tournamentRegistrations||[]).length;document.getElementById('pairs').innerHTML=pairs.length?pairs.map((x,i)=>`<div class="list-item"><div><strong>${Torneig.escapeHtml(Torneig.pairName(x))}</strong><div class="meta">Parella ${i+1}</div></div></div>`).join(''):'<div class="list-item">No hi ha coincidències.</div>';document.getElementById('registrations').innerHTML=regs.length?regs.map(r=>`<div class="list-item"><div><strong>${Portal.esc(r.p1||'')} / ${Portal.esc(r.p2||'')}</strong><div class="meta">${r.member1?'Soci':'Normal'} · ${r.member2?'Soci':'Normal'} · ${(r.status||'pendent').replace('_',' ')}</div></div><span class="badge ${r.status==='verificat'?'green':'orange'}">${r.amount||''} €</span></div>`).join(''):'<div class="list-item">No hi ha inscripcions web amb aquest filtre.</div>'}document.getElementById('search').oninput=render;render();</script><script src="professional-shell.js"></script></body></html>
