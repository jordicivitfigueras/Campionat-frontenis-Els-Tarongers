<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Parelles · Organització</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Participants</div><h1 class="section-title">Parelles</h1></div></div><div class="form-panel"><div class="field"><label>Buscar jugador o parella</label><input id="search" placeholder="Nom o cognom"></div></div><div class="dashboard-grid" style="margin-top:14px"><div class="quick-card"><div class="qtitle">Quadre</div><div id="pairCount" class="qvalue">0</div><div class="meta">parelles carregades</div></div><div class="quick-card"><div class="qtitle">Pagaments històrics</div><div id="paidCount" class="qvalue">0</div><div class="meta">jugadors amb inscripció pagada</div></div><div class="quick-card"><div class="qtitle">Recaptat</div><div id="paidTotal" class="qvalue">0 €</div><div class="meta">inscripcions verificades</div></div></div><h2 class="section-title" style="font-size:36px;margin-top:28px">Parelles del quadre</h2><div id="pairs" class="list"></div><h2 class="section-title" style="font-size:36px;margin-top:32px">Inscripcions web noves</h2><div id="registrations" class="list"></div></section></div></main><script src="app.js"></script><script src="portal.js"></script><script>let paid={};const n=x=>(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');async function loadPaid(){try{if(!window.SupaSync)return;const rows=await SupaSync.req('/rest/v1/registration_payments?select=full_name,amount,registration_type,payment_date,payment_status');paid={};(rows||[]).forEach(r=>paid[n(r.full_name)]=r);render()}catch(e){console.warn(e)}}function badge(name){const p=paid[n(name)];if(!p)return '<span class="badge orange">Pendent</span>';const type=p.registration_type==='member'?'Soci':'Normal',date=p.payment_date?new Date(p.payment_date+'T12:00:00').toLocaleDateString('ca-ES'):'';return `<span class="badge green">${p.amount} € · ${type}${date?' · '+date:''}</span>`}function render(){const s=Torneig.loadState(),p=Portal.load(),q=search.value.toLowerCase(),allPairs=s.pairs||[],filtered=allPairs.filter(x=>Torneig.pairName(x).toLowerCase().includes(q)),regs=(p.tournamentRegistrations||[]).filter(r=>`${r.p1||''} ${r.p2||''}`.toLowerCase().includes(q)),hist=Object.values(paid);pairCount.textContent=allPairs.filter(x=>Torneig.pairName(x)).length;paidCount.textContent=hist.length;paidTotal.textContent=hist.reduce((a,x)=>a+Number(x.amount||0),0)+' €';pairs.innerHTML=filtered.length?filtered.map((x,i)=>`<div class="list-item"><div><strong>${Torneig.escapeHtml(Torneig.pairName(x))}</strong><div class="meta">Parella ${allPairs.indexOf(x)+1}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">${x.filter(Boolean).map(badge).join('')}</div></div></div>`).join(''):'<div class="list-item">No hi ha coincidències.</div>';registrations.innerHTML=regs.length?regs.map(r=>`<div class="list-item"><div><strong>${Portal.esc(r.p1||'')} / ${Portal.esc(r.p2||'')}</strong><div class="meta">${r.member1?'Soci':'Normal'} · ${r.member2?'Soci':'Normal'} · ${(r.status||'pendent').replace('_',' ')}</div></div><span class="badge ${r.status==='verificat'?'green':'orange'}">${r.amount||''} €</span></div>`).join(''):'<div class="list-item">No hi ha inscripcions web amb aquest filtre.</div>'}search.oninput=render;window.addEventListener('supabase:ready',loadPaid);window.addEventListener('supabase:change',loadPaid);render();</script><script src="professional-shell.js"></script></body></html>
