<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Salut del sistema · Admin</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"><style>.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.health{background:#fff;border:1px solid var(--border);border-radius:18px;padding:17px}.health.ok{background:#eef8f2;border-color:#b9ddc9}.health.warn{background:#fff8e8;border-color:#efd596}.health b{font-size:26px;color:var(--brand);display:block;margin:5px 0}.health strong{color:var(--brand-dark)}@media(max-width:760px){.health-grid{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="admin-hero"><div class="eyebrow">Control de qualitat</div><h1>Salut del sistema</h1><p>Comprovació en directe de les taules i processos crítics abans i durant el campionat.</p><div class="admin-status-row"><span class="admin-status"><span class="dot"></span>Supabase actiu</span><span class="admin-status" id="state">Executant comprovacions…</span></div></div><div id="summary" class="production-note" style="margin-bottom:16px"></div><div id="grid" class="health-grid"></div><div class="actions" style="margin-top:18px"><button class="btn btn-accent" onclick="runHealth()">Tornar a comprovar</button><a class="btn btn-secondary" href="/admin/exportacions">Fer còpia de seguretat</a></div></section></div></main><script>(function(){const $=id=>document.getElementById(id),norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();async function wait(){for(let i=0;i<100;i++){if(window.SupaSync?.req)return;await new Promise(r=>setTimeout(r,75))}throw new Error('Supabase no disponible')}window.runHealth=async()=>{state.textContent='Comprovant…';try{await wait();const [members,regs,players,pairs,matches,events,res,products,orders,config]=await Promise.all([SupaSync.req('/rest/v1/members_registry?select=*'),SupaSync.req('/rest/v1/tournament_registrations?select=*'),SupaSync.req('/rest/v1/players?select=*'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&select=*'),SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=*'),SupaSync.req('/rest/v1/lunch_events?select=*'),SupaSync.req('/rest/v1/lunch_reservations?select=*'),SupaSync.req('/rest/v1/merch_products?select=*'),SupaSync.req('/rest/v1/merch_orders?select=*'),SupaSync.req('/rest/v1/tournament_config?id=eq.2026&select=*')]);const playerNames=new Set(players.map(x=>norm(x.full_name))),regNames=regs.flatMap(r=>[r.player1_name,r.player2_name]).filter(n=>norm(n)&&norm(n)!=='parella pendent'),missing=regNames.filter(n=>!playerNames.has(norm(n))),dup=(arr,key)=>{const m=new Map();arr.forEach(x=>{const k=key(x);m.set(k,(m.get(k)||0)+1)});return[...m.values()].filter(v=>v>1).length},checks=[['Configuració',config.length===1,config.length,'registre 2026'],['Socis',members.length>0,members.length,'registres'],['Inscripcions',regs.length>0,regs.length,'parelles registrades'],['Jugadors',missing.length===0,players.length,missing.length?`${missing.length} inscripcions sense jugador`:'sincronitzats'],['Parelles',pairs.length===32,pairs.length,'files del quadre'],['Partits',matches.length===56,matches.length,'partits'],['Horaris',matches.every(m=>m.scheduled_at&&m.court),matches.filter(m=>m.scheduled_at&&m.court).length,'partits amb hora i pista'],['Àpats',events.length===3,events.length,'serveis configurats'],['Reserves',dup(res,x=>`${x.lunch_id}|${norm(x.full_name)}`)===0,res.length,'sense duplicats'],['Merchandising',products.filter(x=>x.active).length>=3,products.filter(x=>x.active).length,'productes actius'],['Comandes merch',true,orders.length,'comandes'],['Socis duplicats',dup(members,x=>norm(x.full_name))===0,dup(members,x=>norm(x.full_name)),'duplicats']];const bad=checks.filter(x=>!x[1]);grid.innerHTML=checks.map(([name,ok,val,meta])=>`<div class="health ${ok?'ok':'warn'}"><strong>${ok?'✓':'!'} ${name}</strong><b>${val}</b><span class="meta">${meta}</span></div>`).join('');summary.innerHTML=bad.length?`<strong>⚠ ${bad.length} comprovacions necessiten revisió.</strong><br>${bad.map(x=>x[0]).join(' · ')}`:'<strong>✓ Sistema preparat.</strong><br>Totes les comprovacions crítiques han passat.';state.textContent=`${checks.length} comprovacions · ${bad.length} incidències`}catch(e){summary.innerHTML='<strong>No s’ha pogut completar la comprovació.</strong>';state.textContent='Error'}};window.addEventListener('admin:ready',runHealth);setTimeout(runHealth,1300)})();</script><script src="/professional-shell.js?v=launch3"></script></body></html>
