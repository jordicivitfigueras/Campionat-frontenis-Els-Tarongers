<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Socis · Admin</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="admin-hero"><div class="eyebrow">Comunitat</div><h1>Gestió de socis</h1><p>Altes, activació 2026 i consulta del registre permanent de socis.</p><div class="admin-status-row"><span class="admin-status"><span class="dot"></span>Supabase actiu</span><span class="admin-status" id="state">Carregant…</span></div></div><div class="dashboard-grid"><div class="quick-card"><div class="qtitle">Socis totals</div><div id="total" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Actius 2026</div><div id="active" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Nous 2026</div><div id="new26" class="qvalue">—</div></div><div class="quick-card"><div class="qtitle">Proper número</div><div id="nextNo" class="qvalue">—</div></div></div><div class="grid grid-2"><div class="form-panel"><h2>Nou soci</h2><div class="field"><label>Nom i cognoms</label><input id="newName" placeholder="Nom complet"></div><div class="field" style="margin-top:10px"><label>Número de soci</label><input id="newNumber" type="number"></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:800"><input id="newActive" type="checkbox" checked> Actiu 2026</label><div class="actions"><button id="addBtn" class="btn btn-accent">Crear soci</button></div></div><div class="form-panel"><h2>Buscar</h2><div class="field"><label>Nom o número</label><input id="search" placeholder="Buscar soci"></div><div class="production-note" style="margin-top:14px">El número de soci és permanent. Evita canviar-lo un cop assignat.</div></div></div><div class="form-panel" style="padding:0!important;overflow:auto;margin-top:16px"><table class="admin-table"><thead><tr><th>Núm.</th><th>Soci</th><th>2026</th><th>Acció</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>(function(){let data=[],started=false;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function wait(){for(let i=0;i<100;i++){if(window.SupaSync?.req)return;await new Promise(r=>setTimeout(r,75))}throw new Error('Supabase no disponible')}async function load(){await wait();data=await SupaSync.req('/rest/v1/members_registry?order=member_number.asc&select=*')||[];const mx=Math.max(0,...data.map(x=>Number(x.member_number)||0));$('total').textContent=data.length;$('active').textContent=data.filter(x=>x.active_2026).length;$('new26').textContent=data.filter(x=>x.active_2026&&!x.active_2023&&!x.active_2024&&!x.active_2025).length;$('nextNo').textContent=mx+1;$('newNumber').value=mx+1;$('state').textContent=`${data.length} registres`;render()}function render(){const q=$('search').value.toLowerCase().trim(),out=data.filter(x=>!q||String(x.member_number).includes(q)||String(x.full_name).toLowerCase().includes(q));$('rows').innerHTML=out.map(x=>`<tr><td><strong>#${x.member_number}</strong></td><td>${esc(x.full_name)}</td><td><span class="badge ${x.active_2026?'green':'orange'}">${x.active_2026?'Actiu':'No actiu'}</span></td><td><button class="btn btn-secondary" onclick="toggleMember(${x.member_number},${!x.active_2026})">${x.active_2026?'Desactivar 2026':'Activar 2026'}</button></td></tr>`).join('')||'<tr><td colspan="4">No hi ha coincidències.</td></tr>'}window.toggleMember=async(n,v)=>{await SupaSync.req(`/rest/v1/members_registry?member_number=eq.${n}`,{method:'PATCH',body:{active_2026:v,updated_at:new Date().toISOString()}});await load()};$('addBtn').onclick=async()=>{const name=$('newName').value.trim(),n=Number($('newNumber').value);if(name.split(/\s+/).length<2||!n)return alert('Cal nom i cognoms i número de soci.');try{await SupaSync.req('/rest/v1/members_registry',{method:'POST',body:{member_number:n,full_name:name,active_2026:$('newActive').checked}});$('newName').value='';await load()}catch(e){alert('No s’ha pogut crear: '+(e.message||e))}};$('search').oninput=render;async function start(){if(started)return;started=true;try{await load()}catch(e){$('state').textContent='Error carregant dades'}}window.addEventListener('admin:ready',start);window.addEventListener('supabase:change',()=>{if(started)load()});setTimeout(start,1200)})();</script><script src="/professional-shell.js?v=launch2"></script></body></html>
