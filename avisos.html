<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Avisos · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Informació important</div><h1 class="section-title">Avisos</h1></div><span id="state" class="badge green">Connectant…</span></div><div class="production-note">Aquesta és la font oficial per a canvis d'horari, pista o informació d'última hora durant el torneig.</div><div id="notices" class="list"><div class="list-item">Carregant avisos…</div></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function render(){try{const rows=await SupaSync.req('/rest/v1/notices?published=eq.true&order=created_at.desc&select=id,title,body,notice_type,created_at')||[];state.textContent='● En directe';notices.innerHTML=rows.length?rows.map(n=>`<div class="notice-card"><strong>${esc(n.title)}</strong><div style="margin-top:6px">${esc(n.body)}</div><div class="meta">${new Date(n.created_at).toLocaleString('ca-ES')}</div></div>`).join(''):'<div class="list-item">No hi ha avisos.</div>'}catch(e){state.textContent='Sense connexió';state.className='badge orange';notices.innerHTML='<div class="production-note">No s’han pogut carregar els avisos. Torna-ho a provar.</div>'}}render();window.addEventListener('supabase:change',e=>{if(e.detail?.table==='notices')render()});</script><script src="professional-shell.js"></script></body></html>
