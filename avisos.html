<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Avisos · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Informació important</div><h1 class="section-title">Avisos</h1></div></div><div class="production-note">Aquesta és la font oficial per a canvis d'horari, pista o informació d'última hora durant el torneig.</div><div id="notices" class="list"></div></section></div></main><script src="portal.js"></script><script>function render(){const s=Portal.load();document.getElementById('notices').innerHTML=(s.notices||[]).length?s.notices.slice().reverse().map(n=>`<div class="notice-card"><strong>${Portal.esc(n.title)}</strong><div style="margin-top:6px">${Portal.esc(n.text)}</div><div class="meta">${Portal.esc(n.date||n.ts||'')}</div></div>`).join(''):'<div class="list-item">No hi ha avisos.</div>'}addEventListener('storage',render);render();</script><script src="professional-shell.js"></script></body></html>
