<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Dinars · Campionat 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.meal-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meal-card{border:2px solid var(--border);background:#fff;border-radius:18px;padding:17px;text-align:left;cursor:pointer}.meal-card.active{border-color:#0b5f43;background:#eef7f2}.meal-card b{display:block;font-size:20px;color:#0b5f43}.meal-total{font-size:33px;font-weight:950;color:#0b5f43}.people-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list-loading{padding:18px;text-align:center;color:#617068}.status-ok{color:#087348}.status-pending{color:#8a5900}@media(max-width:680px){.meal-cards,.people-grid{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Obert a tothom</div><h1 class="section-title">Reserva el teu dinar</h1><p style="color:#617068">Tria el dia, indica quantes persones sereu i revisa l'import abans d'enviar.</p></div></div><div class="grid grid-2" style="margin-top:16px"><div class="form-panel"><div class="meal-cards"><button class="meal-card active" data-id="af38c060-f814-4195-b29f-ee38697f5abf" data-title="Divendres · Fideus a la cassola"><span class="meta">Divendres 11</span><b>Fideus a la cassola</b><span>10 € · beguda no inclosa</span></button><button class="meal-card" data-id="8257e8a4-d780-4a59-ad74-6e0aeff592e0" data-title="Dissabte · Paella"><span class="meta">Dissabte 12</span><b>Paella</b><span>10 € · beguda no inclosa</span></button></div><input id="mealId" type="hidden" value="af38c060-f814-4195-b29f-ee38697f5abf"><input id="mealTitle" type="hidden" value="Divendres · Fideus a la cassola"><div class="field" style="margin-top:16px"><label>Nombre de persones</label><input id="count" type="number" min="1" max="12" value="1"></div><div id="people" class="people-grid" style="margin-top:12px"></div><div class="payment-box" style="margin-top:16px"><div class="meta">Import total</div><div id="mealTotal" class="meal-total">10 €</div><div class="meta">10 € per persona · beguda no inclosa</div></div><div class="field" style="margin-top:14px"><label>Nom utilitzat al Bizum</label><input id="bizumName" placeholder="Nom i cognoms"></div><label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-weight:800"><input id="bizumSent" type="checkbox"> He fet el Bizum</label><div class="actions"><button id="submitBtn" class="btn btn-accent" onclick="registerLunch()">Enviar reserva</button></div><div id="sendMsg" style="margin-top:12px"></div></div><div class="form-panel"><div class="section-head"><div><div class="eyebrow">Llista en directe</div><h2 style="margin:4px 0">Qui està apuntat?</h2></div><span id="connection" class="badge green">Connectant…</span></div><div class="field"><label>Buscar nom</label><input id="search" placeholder="Nom o cognom"></div><div id="summary" class="notice-card" style="margin:14px 0"></div><div id="list" class="list"><div class="list-loading">Carregant reserves…</div></div></div></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>const PRICE=10;let reservations=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function drawPeople(){const n=Math.max(1,Math.min(12,parseInt(count.value||1)));people.innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Persona ${i+1} · Nom i cognoms</label><input class="personName" placeholder="Nom i cognoms"></div>`).join('');mealTotal.textContent=(n*PRICE)+' €'}count.oninput=drawPeople;drawPeople();document.querySelectorAll('.meal-card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.meal-card').forEach(x=>x.classList.toggle('active',x===b));mealId.value=b.dataset.id;mealTitle.value=b.dataset.title;renderList()});async function loadReservations(){connection.textContent='Connectant…';try{reservations=await SupaSync.req('/rest/v1/lunch_reservations?select=id,lunch_id,full_name,bizum_name,payment_status,created_at&order=created_at.asc')||[];connection.textContent='● En directe';connection.className='badge green';renderList()}catch(e){connection.textContent='Sense connexió';connection.className='badge orange';list.innerHTML='<div class="production-note"><strong>No s’ha pogut carregar la llista.</strong><br>Torna-ho a provar en uns segons.</div>'}}function renderList(){const id=mealId.value,q=(search.value||'').trim().toLowerCase(),all=reservations.filter(x=>x.lunch_id===id),arr=all.filter(x=>(x.full_name||'').toLowerCase().includes(q));summary.innerHTML=`<strong>${esc(mealTitle.value)}</strong><div class="meta">${all.length} persones inscrites · ${all.length*PRICE} €</div>`;list.innerHTML=arr.length?arr.map(x=>`<div class="list-item"><div><strong>${esc(x.full_name)}</strong><div class="meta">Reserva registrada</div></div><span class="badge ${x.payment_status==='verified'?'green':'orange'}">${x.payment_status==='verified'?'✓ Pagat':x.payment_status==='bizum_sent'?'Bizum enviat':'Pendent'}</span></div>`).join(''):'<div class="list-item">Encara no hi ha reserves per aquest dinar.</div>'}search.oninput=renderList;async function registerLunch(){const names=[...document.querySelectorAll('.personName')].map(x=>x.value.trim()).filter(Boolean),bn=bizumName.value.trim(),sent=bizumSent.checked,id=mealId.value;if(!names.length||names.some(n=>n.split(/\s+/).length<2)){sendMsg.innerHTML='<div class="production-note">Cal posar nom i cognoms de totes les persones.</div>';return}const existing=reservations.filter(x=>x.lunch_id===id).map(x=>String(x.full_name).toLowerCase());const dup=names.find(n=>existing.includes(n.toLowerCase()));if(dup){sendMsg.innerHTML=`<div class="production-note"><strong>${esc(dup)}</strong> ja consta en aquest dinar.</div>`;return}submitBtn.disabled=true;submitBtn.textContent='Guardant…';try{const group=crypto.randomUUID();const rows=await SupaSync.req('/rest/v1/lunch_reservations',{method:'POST',prefer:'return=representation',body:names.map(full_name=>({lunch_id:id,full_name,reservation_group:group,bizum_name:bn||null,payment_status:sent?'bizum_sent':'pending'}))});reservations.push(...(rows||[]));sendMsg.innerHTML=`<div class="success-card"><strong>✓ Reserva registrada</strong><div>${names.length} persona${names.length>1?'es':''} · ${names.length*PRICE} €</div><div class="meta">${sent?'Bizum enviat · pendent de verificació':'Pagament pendent'}</div></div>`;count.value=1;drawPeople();bizumName.value='';bizumSent.checked=false;renderList()}catch(e){sendMsg.innerHTML='<div class="production-note"><strong>No s’ha pogut guardar la reserva.</strong><br>No tanquis aquesta pantalla i torna-ho a provar.</div>'}finally{submitBtn.disabled=false;submitBtn.textContent='Enviar reserva'}}loadReservations();window.addEventListener('supabase:change',e=>{if(e.detail?.table==='lunch_reservations')loadReservations()});</script><script src="professional-shell.js"></script></body></html>
