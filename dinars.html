<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Dinars · Campionat 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.meal-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meal-card{border:2px solid var(--border);background:#fff;border-radius:18px;padding:17px;text-align:left;cursor:pointer}.meal-card.active{border-color:#0b5f43;background:#eef7f2}.meal-card b{display:block;font-size:20px;color:#0b5f43}.meal-total{font-size:33px;font-weight:950;color:#0b5f43}.people-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:680px){.meal-cards,.people-grid{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Obert a tothom</div><h1 class="section-title">Reserva el teu dinar</h1><p style="color:#617068">Tria el dia, indica quantes persones sereu i revisa l'import abans d'enviar.</p></div></div><div id="closed" class="notice-card" style="display:none"><strong>Reserves tancades</strong></div><div class="grid grid-2" style="margin-top:16px"><div class="form-panel" id="formBox"><div class="stepper"><div class="step-pill active">1 · Dinar</div><div class="step-pill active">2 · Persones</div><div class="step-pill active">3 · Bizum</div></div><div class="meal-cards"><button class="meal-card active" data-meal="Divendres · Fideus a la cassola"><span class="meta">Divendres</span><b>Fideus a la cassola</b><span>~10 € · beguda no inclosa</span></button><button class="meal-card" data-meal="Dissabte · Paella"><span class="meta">Dissabte</span><b>Paella</b><span>~10 € · beguda no inclosa</span></button></div><input id="meal" type="hidden" value="Divendres · Fideus a la cassola"><div class="field" style="margin-top:16px"><label>Nombre de persones</label><input id="count" type="number" min="1" max="12" value="1"></div><div id="people" class="people-grid" style="margin-top:12px"></div><div class="payment-box" style="margin-top:16px"><div class="meta">Import estimat</div><div id="mealTotal" class="meal-total">10 €</div><div class="meta">10 € per persona · beguda no inclosa</div></div><div class="field" style="margin-top:14px"><label>Nom utilitzat al Bizum</label><input id="bizumName" placeholder="Nom i cognoms"></div><label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-weight:800"><input id="bizumSent" type="checkbox"> He fet el Bizum</label><div class="actions"><button id="submitBtn" class="btn btn-accent" onclick="registerLunch()">Enviar reserva</button></div><div id="sendMsg" style="margin-top:12px"></div></div><div class="form-panel"><h2 style="margin-top:0">Qui està apuntat?</h2><div class="field"><label>Buscar nom</label><input id="search" placeholder="Nom o cognom"></div><div id="summary" class="notice-card" style="margin:14px 0"></div><div id="list" class="list"></div></div></div></section></div></main><script src="portal.js"></script><script>const initial=Portal.load(),cfg=initial.config||{},mealPrice=Number(cfg.mealPrice||10),open=cfg.lunchOpen!==false;if(!open){closed.style.display='block';formBox.style.opacity='.55';submitBtn.disabled=true}function obj(x){return typeof x==='string'?{name:x,status:'pendent'}:x}function drawPeople(){const n=Math.max(1,Math.min(12,parseInt(count.value||1)));people.innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Persona ${i+1} · Nom i cognoms</label><input class="personName" placeholder="Nom i cognoms"></div>`).join('');mealTotal.textContent=(n*mealPrice)+' €'}count.oninput=drawPeople;document.querySelectorAll('.meal-card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.meal-card').forEach(x=>x.classList.toggle('active',x===b));meal.value=b.dataset.meal;render()});drawPeople();async function registerLunch(){if(!open)return alert('Les reserves estan tancades.');const mealName=meal.value,names=[...document.querySelectorAll('.personName')].map(x=>x.value.trim()),bn=bizumName.value.trim(),sent=bizumSent.checked;if(names.some(n=>n.split(/\s+/).length<2))return alert('Cal posar nom i cognoms de totes les persones.');const s=Portal.load();s.lunches[mealName]=s.lunches[mealName]||[];const existing=s.lunches[mealName].map(x=>obj(x).name.toLowerCase()),dup=names.find(n=>existing.includes(n.toLowerCase()));if(dup)return alert(dup+" ja consta a la llista d'aquest dinar.");submitBtn.disabled=true;submitBtn.textContent='Enviant…';try{let db=[];if(window.SupaSync)db=await SupaSync.reserveLunch(mealName,names,bn,sent)||[];names.forEach((n,i)=>s.lunches[mealName].push({id:db[i]?.id,name:n,status:sent?'bizum_enviat':'pendent',bizumName:bn,amount:mealPrice}));Portal.save(s);sendMsg.innerHTML=`<div class="success-card"><strong>✓ Reserva registrada</strong><div>${names.length} persona${names.length>1?'es':''} · ${names.length*mealPrice} €</div><div class="meta">${sent?'Bizum pendent de verificació':'Pagament pendent'}</div></div>`;count.value=1;drawPeople();bizumName.value='';bizumSent.checked=false;render()}catch(e){sendMsg.innerHTML=`<div class="production-note"><strong>No s’ha pogut enviar.</strong> ${Portal.esc(e.message||'Error de connexió')}</div>`}finally{submitBtn.disabled=false;submitBtn.textContent='Enviar reserva'}}function render(){const s=Portal.load(),mealName=meal.value,q=(search.value||'').toLowerCase(),all=(s.lunches[mealName]||[]).map(obj),arr=all.filter(x=>x.name.toLowerCase().includes(q));summary.innerHTML=`<strong>${mealName}</strong><div class="meta">${all.length} persones inscrites</div>`;list.innerHTML=arr.length?arr.map(x=>`<div class="list-item"><div><strong>${Portal.esc(x.name)}</strong></div><span class="badge ${x.status==='verificat'?'green':'orange'}">${x.status==='verificat'?'Confirmat':'Reserva'}</span></div>`).join(''):'<div class="list-item">No hi ha coincidències.</div>'}search.oninput=render;render();</script><script src="professional-shell.js"></script></body></html>
