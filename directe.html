<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>En directe · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.live-stage{min-height:70vh;display:grid;place-items:center}.live-panel{width:min(1100px,100%);background:#fff;border-radius:26px;box-shadow:0 25px 70px rgba(5,56,37,.18);padding:28px}.live-meta{text-align:center;color:#6d7a73;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.live-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-top:22px}.live-team{text-align:center;font-size:clamp(22px,4vw,52px);font-weight:900;line-height:1.05}.live-score{font-family:'Arial Narrow',Impact,sans-serif;font-size:clamp(70px,12vw,150px);color:#086443;white-space:nowrap}.next-live{margin-top:18px;background:#f1f5f2;border-radius:14px;padding:15px;text-align:center}@media(max-width:760px){.live-teams{grid-template-columns:1fr}.live-score{order:-1}.live-panel{padding:20px}}</style></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section live-stage"><div class="live-panel"><div class="live-meta" id="meta">Torneig Frontó Gelida 2026</div><div class="live-teams"><div class="live-team" id="team1">—</div><div class="live-score" id="score">0 – 0</div><div class="live-team" id="team2">—</div></div><div class="next-live" id="next">Esperant partit…</div></div></section></div></main><script src="app.js"></script><script>function render(){const s=Torneig.loadState(),ids=Torneig.allIds(),live=ids.find(id=>s.matches[id].status==='en joc'),current=live||ids.find(id=>s.matches[id].status!=='final'&&s.matches[id].team1&&s.matches[id].team2);if(!current){meta.textContent='Torneig finalitzat';team1.textContent='Gràcies';team2.textContent='a tothom';score.textContent='★';next.textContent='';return}const m=s.matches[current];meta.textContent=`Partit ${current} · ${m.stage||Torneig.stageOf(current)||''} · ${m.time||''} · ${m.court||'Pista 1'}`;team1.textContent=Torneig.pairName(m.team1);team2.textContent=Torneig.pairName(m.team2);score.textContent=m.status==='pendent'?'VS':`${m.s1} – ${m.s2}`;const idx=ids.indexOf(current),nextId=ids.slice(idx+1).find(id=>s.matches[id].status!=='final'&&s.matches[id].team1&&s.matches[id].team2);if(nextId){const n=s.matches[nextId];next.textContent=`Següent: ${nextId} · ${Torneig.pairName(n.team1)} vs ${Torneig.pairName(n.team2)} · ${n.time||''}`}else next.textContent='Sense següent partit confirmat'}if(Torneig.BC)Torneig.BC.onmessage=render;addEventListener('storage',render);setInterval(render,1200);render();</script><script src="professional-shell.js"></script></body></html>
