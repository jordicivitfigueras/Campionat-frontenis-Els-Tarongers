<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>En directe · Campionat 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.live-stage{min-height:72vh;display:grid;place-items:center}.live-panel{width:min(1180px,100%);background:#fff;border-radius:28px;box-shadow:0 25px 70px rgba(5,56,37,.18);padding:30px}.live-badge{display:inline-flex;align-items:center;gap:8px;background:#fff0d8;color:#9b5b00;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:950}.live-badge i{width:9px;height:9px;border-radius:50%;background:#ed9f24;box-shadow:0 0 0 5px rgba(237,159,36,.15)}.live-meta{text-align:center;color:#6d7a73;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-top:10px}.live-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:center;margin-top:24px}.live-team{text-align:center;font-size:clamp(22px,4vw,50px);font-weight:950;line-height:1.05}.live-score{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(76px,14vw,170px);color:#086443;white-space:nowrap}.next-live{margin-top:20px;background:#f1f5f2;border-radius:16px;padding:16px;text-align:center;font-weight:800}.next-live strong{color:#0b5f43}.live-top{text-align:center}.live-actions{display:flex;justify-content:center;gap:9px;margin-top:16px}@media(max-width:760px){.live-teams{grid-template-columns:1fr}.live-score{order:-1}.live-panel{padding:20px}.live-team{font-size:28px}.live-stage{min-height:64vh}}</style></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section live-stage"><div class="live-panel"><div class="live-top"><span id="badge" class="live-badge"><i></i><span>EN DIRECTE</span></span><div class="live-meta" id="meta">Campionat Frontenis Els Tarongers 2026</div></div><div class="live-teams"><div class="live-team" id="team1">—</div><div class="live-score" id="score">0 – 0</div><div class="live-team" id="team2">—</div></div><div class="next-live" id="next">Esperant partit…</div><div class="live-actions"><button class="btn btn-secondary" onclick="UX2?.share(document.title,'Segueix el Campionat Frontenis Els Tarongers en directe')">↗ Compartir</button><a class="btn btn-secondary" href="/horaris">Horaris</a></div></div></section></div></main><script src="app.js"></script><script>function render(){const s=Torneig.loadState(),ids=Torneig.allIds(),live=ids.find(id=>s.matches[id].status==='en joc'),current=live||ids.find(id=>s.matches[id].status!=='final'&&s.matches[id].team1&&s.matches[id].team2);if(!current){badge.style.display='none';meta.textContent='Campionat finalitzat';team1.textContent='Gràcies';team2.textContent='a tothom';score.textContent='★';next.textContent='';return}const m=s.matches[current],isLive=m.status==='en joc';badge.style.display='inline-flex';badge.querySelector('span').textContent=isLive?'EN DIRECTE':'PRÒXIM PARTIT';meta.textContent=`Partit ${current} · ${m.stage||Torneig.stageOf(current)||''} · ${m.time||''} · ${m.court||'Pista 1'}`;team1.textContent=Torneig.pairName(m.team1);team2.textContent=Torneig.pairName(m.team2);score.textContent=isLive?`${m.s1} – ${m.s2}`:'VS';const idx=ids.indexOf(current),nextId=ids.slice(idx+1).find(id=>s.matches[id].status!=='final'&&s.matches[id].team1&&s.matches[id].team2);if(nextId){const n=s.matches[nextId];next.innerHTML=`<strong>Següent · ${nextId}</strong><br>${Torneig.escapeHtml(Torneig.pairName(n.team1))} vs ${Torneig.escapeHtml(Torneig.pairName(n.team2))} · ${Torneig.escapeHtml(n.time||'')}`}else next.textContent=isLive?'Últim partit confirmat':'Sense següent partit confirmat'}if(Torneig.BC)Torneig.BC.onmessage=render;addEventListener('storage',render);window.addEventListener('supabase:change',render);setInterval(render,1000);render();</script><script src="professional-shell.js"></script></body></html>
