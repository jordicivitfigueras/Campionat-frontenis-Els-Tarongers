  <style>
    html.live-page,html.live-page body{margin:0;min-height:100%;background:#063f2d;overflow-x:hidden}html.live-page body{min-height:100dvh}html.live-page .page,html.live-page .container,html.live-page .section{width:100%;max-width:none;min-height:100dvh;margin:0;padding:0}
    .live-wrap{width:100%;min-height:100dvh;margin:0}.live-shell{box-sizing:border-box;min-height:100dvh;padding:clamp(16px,3vw,36px);color:#fff;background:linear-gradient(145deg,#063f2d 0%,#086443 58%,#0a7752 100%);display:flex;flex-direction:column;justify-content:center}

ne-block;width:8px;height:8px;border-radius:50%;background:#ffd08a;margin-right:6px;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.3}}
    @media(max-width:620px){.live-shell{padding:96px 9px 12px}.live-top{align-items:flex-start}.live-brand{max-width:200px;gap:8px;font-size:14px;line-height:1.15}.live-logo{width:62px;height:62px}.live-controls{flex-direction:column;align-items:flex-end}.live-control{font-size:12px;padding:7px 9px}.live-title{font-size:25px}.scoreboard{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:2px;margin-top:10px}.live-team-name{font-size:clamp(18px,5.4vw,25px);min-height:3.2em}.live-score{margin-top:18px;font-size:clamp(112px,32vw,168px)}.live-sep{font-size:30px}.history-box{margin-top:13px}.score-step{font-size:12px;padding:5px 8px}}
    @media(max-height:620px) and (orientation:landscape){.live-shell{padding:76px 18px 8px}.live-title{display:none}.live-meta{margin:3px 0}.scoreboard{margin-top:4px}.live-team-name{font-size:clamp(24px,3.2vw,38px);min-height:2em}.live-score{margin-top:12px;font-size:42vh}.history-box{margin-top:8px;padding:6px 10px}.history-title{display:none}.score-step{padding:4px 8px}.live-logo{width:60px;height:60px}.live-brand{font-size:16px}}

    /* Broadcast redesign */
    :root{--broadcast-deep:#021f17;--broadcast-green:#075039;--broadcast-accent:#f6bd60;--broadcast-line:rgba(255,255,255,.14)}
    .live-shell{position:relative;isolation:isolate;justify-content:flex-start;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(22,154,107,.32),transparent 42%),linear-gradient(135deg,var(--broadcast-deep),#063b2b 48%,#076044);padding:clamp(14px,2.2vw,30px)}
    .live-shell:before{content:"";position:absolute;z-index:-2;inset:-25%;opacity:.1;background:linear-gradient(90deg,transparent 49.9%,#fff 50%,transparent 50.1%),linear-gradient(0deg,transparent 49.9%,#fff 50%,transparent 50.1%);transform:rotate(-7deg) scale(1.2)}
    .live-shell:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.035),transparent 32%,transparent 70%,rgba(246,189,96,.065))}
    .live-top{position:relative;inset:auto;flex:0 0 auto}.live-brand{gap:15px;color:#fff;letter-spacing:0;text-transform:none}.live-logo{width:clamp(74px,7vw,108px);height:clamp(74px,7vw,108px);filter:drop-shadow(0 9px 24px rgba(0,0,0,.3))}.live-brand-copy{display:flex;flex-direction:column;min-width:0}.live-brand-kicker{color:var(--broadcast-accent);font-size:clamp(9px,1vw,12px);font-weight:950;letter-spacing:.18em;text-transform:uppercase}.live-brand-title{margin-top:4px;font-size:clamp(16px,1.8vw,25px);font-weight:950;letter-spacing:-.025em}.live-controls{align-items:center}.auto-update{display:flex;align-items:center;gap:7px;margin-right:5px;color:rgba(255,255,255,.7);font-size:11px;font-weight:800}.auto-update:before{content:"";width:7px;height:7px;border-radius:50%;background:#6de8ae;box-shadow:0 0 0 4px rgba(109,232,174,.12)}.live-control{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border-color:rgba(255,255,255,.2);background:rgba(1,27,20,.43);backdrop-filter:blur(14px);border-radius:12px;padding:9px 13px;font-size:12px;transition:.18s ease}.live-control:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.38);transform:translateY(-1px)}
    .live-title{display:none}#liveContent{display:flex;flex:1;min-height:0;flex-direction:column;justify-content:center}.live-meta{order:0;width:min(1380px,100%);box-sizing:border-box;margin:clamp(7px,1.2vh,16px) auto 9px;display:flex;align-items:center;justify-content:center;gap:8px}.live-meta span{padding:7px 11px;background:rgba(2,29,21,.42);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);font-size:10px;letter-spacing:.035em}.live-meta span:first-child{background:var(--broadcast-accent);border-color:var(--broadcast-accent);color:#21352a;letter-spacing:.11em}.live-meta .pulse{background:#20372b}
    .scoreboard{order:1;width:min(1380px,100%);min-height:min(59vh,620px);margin:0 auto;grid-template-columns:minmax(0,1fr) clamp(68px,7vw,108px) minmax(0,1fr);gap:0;align-items:stretch;background:rgba(1,24,18,.37);border:1px solid rgba(255,255,255,.16);border-radius:clamp(22px,2.4vw,36px);box-shadow:0 32px 90px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(18px);overflow:hidden}.live-team{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,3vw,44px)}.live-team:before{position:absolute;top:clamp(16px,2vw,26px);color:rgba(255,255,255,.42);font-size:10px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.live-team:first-child:before{content:"Equip A"}.live-team:last-child:before{content:"Equip B"}.live-team:after{content:"";position:absolute;top:0;left:14%;right:14%;height:4px;background:linear-gradient(90deg,transparent,var(--broadcast-accent),transparent)}.live-team-name{font-size:clamp(29px,3.7vw,56px);line-height:1.05;min-height:2.35em;letter-spacing:-.04em;text-wrap:balance}.live-score{margin-top:clamp(28px,4.5vh,58px);font-size:clamp(175px,34vh,360px);line-height:.67;text-shadow:0 16px 45px rgba(0,0,0,.22)}.live-sep{position:relative;align-self:center;display:grid;place-items:center;width:clamp(52px,5vw,74px);height:clamp(52px,5vw,74px);border-radius:50%;background:var(--broadcast-accent);color:#193328;font-size:clamp(31px,3vw,46px);box-shadow:0 13px 38px rgba(0,0,0,.3)}.live-sep:before{content:"";position:absolute;z-index:-1;top:calc(-29vh + 26px);bottom:calc(-29vh + 26px);left:50%;width:1px;background:linear-gradient(transparent,rgba(255,255,255,.22),transparent)}
    .history-box{order:2;width:min(1100px,calc(100% - 20px));display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:13px;margin:clamp(9px,1.6vh,17px) auto 0;background:rgba(1,24,18,.4);border-color:rgba(255,255,255,.13);border-radius:15px;padding:9px 12px;backdrop-filter:blur(12px)}.history-title{margin:0;color:var(--broadcast-accent);white-space:nowrap}.score-flow{scrollbar-width:none}.score-flow::-webkit-scrollbar{display:none}.score-step{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:rgba(255,255,255,.78)}.score-step.current{background:var(--broadcast-accent);border-color:var(--broadcast-accent);color:#173229}.pending{background:rgba(1,24,18,.4);box-shadow:0 25px 70px rgba(0,0,0,.25);backdrop-filter:blur(14px)}
    @media(max-width:720px){.live-shell{padding:10px 8px}.live-top{align-items:flex-start}.live-logo{width:62px;height:62px}.live-brand{gap:8px}.live-brand-title{max-width:145px;font-size:14px;line-height:1.12}.live-brand-kicker{font-size:8px}.auto-update,.live-controls .live-control:first-of-type{display:none}.live-control{min-height:38px;padding:7px 9px;font-size:10px}.live-meta{margin:7px auto;gap:5px}.live-meta span{padding:5px 7px;font-size:8px}.scoreboard{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);min-height:55vh;border-radius:20px}.live-team{padding:18px 6px 12px}.live-team:before{top:12px;font-size:7px}.live-team-name{font-size:clamp(17px,5.2vw,24px);min-height:3.4em}.live-score{margin-top:24px;font-size:clamp(110px,31vw,162px)}.live-sep{width:35px;height:35px;font-size:23px}.history-box{width:100%;grid-template-columns:1fr;gap:5px;margin-top:8px;padding:7px 9px}.history-title{text-align:center;font-size:8px}.score-step{font-size:10px;padding:5px 7px}}
    @media(max-height:650px) and (orientation:landscape){.live-shell{padding:7px 15px}.live-logo{width:50px;height:50px}.live-brand-title{font-size:14px}.live-brand-kicker{font-size:8px}.live-control{min-height:33px;padding:5px 8px}.live-meta{margin:2px auto 5px}.live-meta span{padding:4px 7px;font-size:8px}.scoreboard{min-height:0;height:calc(100dvh - 120px);border-radius:20px}.live-team{padding:14px 22px}.live-team:before{top:8px;font-size:7px}.live-team-name{font-size:clamp(20px,3vw,36px);min-height:2em}.live-score{margin-top:9px;font-size:43vh}.history-box{position:absolute;z-index:3;left:50%;bottom:5px;transform:translateX(-50%);margin:0;padding:4px 8px}.history-title{font-size:7px}.score-step{padding:3px 6px;font-size:9px}}
  </style>
</head>
<body>
<main class="page"><div class="container"><section class="section live-wrap">
  <div class="live-shell">
    <div class="live-top"><div class="live-brand"><img class="live-logo" src="/logo-frontenis-blanco.png" alt="Campionat Frontenis Els Tarongers"><div class="live-brand-copy"><span class="live-brand-kicker">Campionat 2026</span><span class="live-brand-title">Frontenis Els Tarongers</span></div></div><div class="live-controls"><span class="auto-update">Actualització automàtica</span><a class="live-control" href="/">Sortir</a><button class="live-control" id="fullscreenBtn" type="button">⛶ Pantalla completa</button></div></div>
    <div class="live-title">En directe</div>
    <div id="liveContent"><div class="pending"><strong>Carregant marcador…</strong></div></div>
  </div>
</section></div></main>
<script src="/app.js?v=score-history-vertical-1"></script>
<script src="/config.js"></script>
<script src="/supabase-sync.js?v=score-history-vertical-1"></script>
<script>
(function(){const box=document.getElementById('liveContent'),fullscreenBtn=document.getElementById('fullscreenBtn');let loading=false;const esc=s=>Torneig.escapeHtml(s||'—');function pairName(p,idMap){if(!p)return'—';return [idMap.get(p.player1_id),idMap.get(p.player2_id)].filter(Boolean).join(' / ')||'—'}function flow(rows,current){const seq=[];const push=(a,b)=>{const k=`${a}-${b}`;if(seq[seq.length-1]?.k!==k)seq.push({k,a,b})};push(0,0);(rows||[]).forEach(x=>push(Number(x.score1||0),Number(x.score2||0)));push(Number(current.score1||0),Number(current.score2||0));return seq.slice(-12).map((x,i,a)=>`<span class="score-step ${i===a.length-1?'current':''}">${x.a}–${x.b}</span>`).join('')}async function load(){if(loading||!window.SupaSync?.req)return;loading=true;try{const [matches,players,pairs]=await Promise.all([SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,team1_id,team2_id,score1,score2,updated_at'),SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&select=id,player1_id,player2_id')]);const pnames=new Map((players||[]).map(p=>[p.id,p.full_name])),pmap=new Map((pairs||[]).map(p=>[p.id,p]));let m=(matches||[]).find(x=>x.status==='live');if(!m){const finals=(matches||[]).filter(x=>x.status==='final').sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));m=finals[0]}if(!m){box.innerHTML='<div class="pending"><strong>Encara no hi ha cap partit en joc.</strong><br>Quan comenci un partit, aquí veuràs el marcador i tota la seva evolució punt a punt.</div>';return}const history=await SupaSync.req(`/rest/v1/match_score_history?tournament_id=eq.2026&match_id=eq.${encodeURIComponent(m.id)}&order=id.asc&select=score1,score2,event_type,created_at`)||[],t1=pairName(pmap.get(m.team1_id),pnames),t2=pairName(pmap.get(m.team2_id),pnames),isLive=m.status==='live';box.innerHTML=`<div class="live-meta"><span>${isLive?'<i class="pulse"></i>EN JOC':'FINALITZAT'}</span><span>Partit ${esc(m.id)}</span><span>${esc(m.stage||'')}</span><span>${esc(m.scheduled_at||'Horari pendent')}</span></div><div class="scoreboard"><div class="live-team"><div class="live-team-name">${esc(t1)}</div><div class="live-score">${Number(m.score1||0)}</div></div><div class="live-sep">–</div><div class="live-team"><div class="live-team-name">${esc(t2)}</div><div class="live-score">${Number(m.score2||0)}</div></div></div><div class="history-box"><div class="history-title">Últims punts</div><div class="score-flow">${flow(history,m)}</div></div>`;requestAnimationFrame(()=>{const f=box.querySelector('.score-flow');if(f)f.scrollLeft=f.scrollWidth})}catch(e){box.innerHTML='<div class="pending"><strong>No s’ha pogut carregar el marcador.</strong><br>Torna-ho a provar en uns segons.</div>'}finally{loading=false}}fullscreenBtn?.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}});document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=document.fullscreenElement?'× Sortir pantalla completa':'⛶ Pantalla completa'});window.addEventListener('supabase:ready',load);window.addEventListener('supabase:change',load);setInterval(load,5000);setTimeout(()=>{if(window.SupaSync){SupaSync.init().catch(()=>{});load()}},500)})();
</script>
<script src="/professional-shell.js?v=live-fullscreen-1"></script>
</body>
</html>
