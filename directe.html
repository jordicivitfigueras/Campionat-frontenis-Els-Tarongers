<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#086443">
  <title>En directe · Campionat 2026</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/professional.css">
  <style>
    .live-wrap{max-width:1240px;margin:0 auto}.live-shell{position:relative;overflow:hidden;background:linear-gradient(145deg,#063f2d 0%,#086443 58%,#0a7752 100%);border-radius:30px;padding:28px;color:#fff;box-shadow:0 28px 80px rgba(5,56,37,.22)}
    .live-shell:before{content:"";position:absolute;width:430px;height:430px;border-radius:50%;right:-190px;top:-260px;background:rgba(255,255,255,.07)}
    .live-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.live-kicker{font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#ffd08a}.live-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 13px;font-size:11px;font-weight:950}.live-badge i{width:8px;height:8px;border-radius:50%;background:#ffc46e;box-shadow:0 0 0 5px rgba(255,196,110,.15)}
    .match-meta{position:relative;text-align:center;font-size:12px;font-weight:850;letter-spacing:.045em;color:rgba(255,255,255,.72);margin:8px 0 19px}
    .score-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}.team-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:315px;padding:24px 26px 22px;text-align:center;background:rgba(255,255,255,.97);color:#143d2f;border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.11)}.team-side{font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#7a8b83}.team-name{display:flex;align-items:center;justify-content:center;flex:1;width:100%;padding:18px 10px 8px;font-size:clamp(23px,2.8vw,39px);font-weight:950;line-height:1.06;letter-spacing:-.035em}.point-box{width:min(230px,84%);height:150px;display:grid;place-items:center;background:#f3f7f5;border:1px solid #dbe7e1;border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}.point-value{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:clamp(78px,9vw,126px);font-weight:950;line-height:1;color:#07583e;letter-spacing:-.06em;font-variant-numeric:tabular-nums lining-nums}.score-grid.live .point-box{background:#fff3df;border-color:#f1c984}.score-grid.live .point-value{color:#143d2f}.versus-pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#f2a33b;color:#173229;border:6px solid #086443;font-size:13px;font-weight:950;letter-spacing:.06em;box-shadow:0 10px 28px rgba(0,0,0,.18)}
    .next-card{position:relative;margin-top:14px;padding:15px 18px;border-radius:16px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12);text-align:center;color:rgba(255,255,255,.84);font-size:13px;font-weight:750}.next-card strong{color:#fff}.live-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.live-actions .btn{background:#fff!important}.sync-note{text-align:center;margin-top:12px;color:rgba(255,255,255,.55);font-size:10px;font-weight:800}
    .no-match{grid-column:1/-1;background:#fff;color:#173229;border-radius:22px;padding:38px;text-align:center}.no-match h2{margin:0 0 8px;color:#073e2d}.no-match p{margin:0;color:#6f8179}
    @media(max-width:900px){.team-card{min-height:275px}.point-box{height:132px}.versus-pill{width:54px;height:54px;border-width:5px}.live-head{align-items:flex-start;flex-direction:column}}
    @media(max-width:620px){.live-shell{padding:18px 12px;border-radius:22px}.score-grid{gap:8px}.team-card{min-height:255px;padding:18px 10px 14px;border-radius:18px}.team-name{font-size:20px;padding:13px 2px 8px;word-break:normal}.point-box{width:92%;height:120px;border-radius:17px}.point-value{font-size:76px;letter-spacing:-.04em}.versus-pill{width:44px;height:44px;border-width:4px;font-size:10px}.match-meta{font-size:10px;line-height:1.5}}
    @media(max-width:390px){.team-card{min-height:240px}.team-name{font-size:18px}.point-box{height:108px}.point-value{font-size:68px}}
  </style>
</head>
<body>
<main class="page"><div class="container"><section class="section live-wrap">
  <div class="live-shell">
    <div class="live-head"><div><div class="live-kicker">Campionat Frontenis Els Tarongers · 2026</div></div><span id="badge" class="live-badge"><i></i><span>PRÒXIM PARTIT</span></span></div>
    <div id="meta" class="match-meta">Carregant el marcador…</div>
    <div id="scoreGrid" class="score-grid"><div class="no-match"><h2>Carregant partits…</h2><p>Connectant amb l’organització.</p></div></div>
    <div id="next" class="next-card">Esperant informació del següent partit…</div>
    <div class="live-actions"><button class="btn btn-secondary" onclick="UX2?.share(document.title,'Segueix el Campionat Frontenis Els Tarongers en directe')">↗ Compartir</button><a class="btn btn-secondary" href="/horaris">Horaris</a><a class="btn btn-secondary" href="/quadre">Quadre</a></div>
    <div id="syncNote" class="sync-note">Actualització automàtica en directe</div>
  </div>
</section></div></main>
<script src="/app.js?v=2026.08.11.2"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const badge=$('badge'),meta=$('meta'),grid=$('scoreGrid'),next=$('next'),syncNote=$('syncNote');
  function playable(s,id){const m=s?.matches?.[id];return !!(m&&m.status!=='final'&&m.team1&&m.team2)}
  function safeState(){
    let s=Torneig.loadState();
    const ids=Torneig.allIds();
    if(ids.some(id=>playable(s,id))||ids.some(id=>s.matches?.[id]?.status==='final')) return s;
    const fresh=Torneig.freshState();
    if(ids.some(id=>playable(fresh,id))) return fresh;
    return s;
  }
  function render(){
    const s=safeState(),ids=Torneig.allIds();
    const live=ids.find(id=>s.matches?.[id]?.status==='en joc'&&s.matches[id].team1&&s.matches[id].team2);
    const current=live||ids.find(id=>playable(s,id));
    if(!current){
      badge.style.display='none';
      meta.textContent='Campionat Frontenis Els Tarongers 2026';
      grid.className='score-grid';
      grid.innerHTML='<div class="no-match"><h2>Encara no hi ha cap partit disponible</h2><p>Quan l’organització activi el següent partit apareixerà aquí automàticament.</p></div>';
      next.textContent='Actualització automàtica activada';
      return;
    }
    const m=s.matches[current],isLive=m.status==='en joc';
    badge.style.display='inline-flex';badge.querySelector('span').textContent=isLive?'EN DIRECTE':'PRÒXIM PARTIT';
    meta.textContent=`${current==='FINAL'?'FINAL':'Partit '+current} · ${m.stage||Torneig.stageOf(current)||''} · ${m.time||'Horari pendent'} · ${m.court||'Pista 1'}`;
    const t1=Torneig.escapeHtml(Torneig.pairName(m.team1)),t2=Torneig.escapeHtml(Torneig.pairName(m.team2));
    const p1=isLive?String(m.s1||0):'—',p2=isLive?String(m.s2||0):'—';
    grid.className='score-grid'+(isLive?' live':'');
    grid.innerHTML=`<section class="team-card"><div class="team-side">Parella A</div><div class="team-name">${t1}</div><div class="point-box"><div class="point-value">${p1}</div></div></section><div class="versus-pill">${isLive?'—':'VS'}</div><section class="team-card"><div class="team-side">Parella B</div><div class="team-name">${t2}</div><div class="point-box"><div class="point-value">${p2}</div></div></section>`;
    const idx=ids.indexOf(current),nextId=ids.slice(idx+1).find(id=>playable(s,id));
    if(nextId){const n=s.matches[nextId];next.innerHTML=`<strong>Següent · ${nextId==='FINAL'?'FINAL':'Partit '+nextId}</strong><br>${Torneig.escapeHtml(Torneig.pairName(n.team1))} vs ${Torneig.escapeHtml(Torneig.pairName(n.team2))} · ${Torneig.escapeHtml(n.time||'Horari pendent')}`}
    else next.textContent=isLive?'Últim partit confirmat':'Sense següent partit confirmat';
  }
  if(Torneig.BC)Torneig.BC.onmessage=render;
  addEventListener('storage',render);
  addEventListener('supabase:change',render);
  addEventListener('supabase:realtime',e=>{syncNote.textContent=e.detail?.status==='SUBSCRIBED'?'● Connectat en directe':'Actualitzant connexió…'});
  setInterval(render,1200);render();
})();
</script>
<script src="/professional-shell.js?v=2026.08.11.7"></script>
</body></html>
