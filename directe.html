<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#086443">
  <title>En directe · Campionat 2026</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/professional.css">
  <style>
    html.live-page,html.live-page body{margin:0;min-height:100%;background:#063f2d;overflow-x:hidden}html.live-page body{min-height:100dvh}html.live-page .page,html.live-page .container,html.live-page .section{width:100%;max-width:none;min-height:100dvh;margin:0;padding:0}
    .live-wrap{width:100%;min-height:100dvh;margin:0}.live-shell{box-sizing:border-box;min-height:100dvh;padding:clamp(16px,3vw,36px);color:#fff;background:linear-gradient(145deg,#063f2d 0%,#086443 58%,#0a7752 100%);display:flex;flex-direction:column;justify-content:center}
    .live-top{position:absolute;inset:clamp(12px,2vw,24px) clamp(12px,2vw,24px) auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.live-brand{font-size:clamp(12px,1.5vw,16px);font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#ffd08a}.live-controls{display:flex;gap:8px}.live-control{border:1px solid rgba(255,255,255,.28);background:rgba(4,44,31,.55);color:#fff;border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;font-weight:900;text-decoration:none;cursor:pointer}.live-control:hover{background:rgba(255,255,255,.16)}
    .live-title{font-size:clamp(20px,3vw,34px);font-weight:950;line-height:1;margin:0 0 10px;text-align:center;text-transform:uppercase}.live-meta{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:8px 0}.live-meta span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.17);padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(8px,2vw,24px);align-items:center;width:min(1180px,100%);margin:clamp(12px,2.5vh,26px) auto 0}.live-team{text-align:center;min-width:0}.live-team-name{font-size:clamp(18px,3vw,38px);font-weight:950;line-height:1.15;min-height:2.5em;display:flex;align-items:center;justify-content:center;text-wrap:balance}.live-score{font-size:clamp(110px,25vh,260px);font-weight:950;line-height:.78;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.live-sep{font-size:clamp(32px,5vw,68px);font-weight:950;color:#ffd08a}.history-box{width:min(900px,100%);box-sizing:border-box;margin:clamp(16px,3vh,30px) auto 0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);border-radius:16px;padding:10px 12px}.history-title{font-size:10px;text-align:center;text-transform:uppercase;letter-spacing:.11em;font-weight:950;color:#ffd08a;margin-bottom:7px}.score-flow{display:flex;align-items:center;justify-content:flex-start;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:1px 0 3px}.score-step{flex:0 0 auto;display:block;background:rgba(255,255,255,.92);color:#074b35;border-radius:9px;padding:6px 10px;font-weight:950;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}.score-step.current{background:#ffd08a;color:#173229}.pending{width:min(760px,100%);box-sizing:border-box;margin:18px auto 0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:22px;line-height:1.6;text-align:center}.pending strong{color:#ffd08a}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd08a;margin-right:6px;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.3}}
    @media(max-width:620px){.live-shell{padding:70px 12px 16px}.live-top{align-items:flex-start}.live-brand{max-width:145px}.live-control{font-size:12px;padding:8px 10px}.live-title{font-size:21px}.scoreboard{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:3px;margin-top:14px}.live-team-name{font-size:15px;min-height:3.4em}.live-score{font-size:clamp(92px,25vw,130px)}.live-sep{font-size:27px}.history-box{margin-top:18px}.score-step{font-size:12px;padding:5px 8px}}
    @media(max-height:620px) and (orientation:landscape){.live-shell{padding:58px 18px 12px}.live-title{display:none}.live-meta{margin:4px 0}.scoreboard{margin-top:8px}.live-team-name{font-size:20px;min-height:2.2em}.live-score{font-size:34vh}.history-box{margin-top:12px;padding:7px 10px}.history-title{display:none}.score-step{padding:4px 8px}}
  </style>
</head>
<body>
<main class="page"><div class="container"><section class="section live-wrap">
  <div class="live-shell">
    <div class="live-top"><div class="live-brand">Frontenis Els Tarongers · 2026</div><div class="live-controls"><a class="live-control" href="/">Sortir</a><button class="live-control" id="fullscreenBtn" type="button">⛶ Pantalla completa</button></div></div>
    <div class="live-title">En directe</div>
    <div id="liveContent"><div class="pending"><strong>Carregant marcador…</strong></div></div>
  </div>
</section></div></main>
<script src="/app.js?v=score-history-vertical-1"></script>
<script src="/config.js"></script>
<script src="/supabase-sync.js?v=score-history-vertical-1"></script>
<script>
(function(){const box=document.getElementById('liveContent'),fullscreenBtn=document.getElementById('fullscreenBtn');let loading=false;const esc=s=>Torneig.escapeHtml(s||'—');function pairName(p,idMap){if(!p)return'—';return [idMap.get(p.player1_id),idMap.get(p.player2_id)].filter(Boolean).join(' / ')||'—'}function flow(rows,current){const seq=[];const push=(a,b)=>{const k=`${a}-${b}`;if(seq[seq.length-1]?.k!==k)seq.push({k,a,b})};push(0,0);(rows||[]).forEach(x=>push(Number(x.score1||0),Number(x.score2||0)));push(Number(current.score1||0),Number(current.score2||0));return seq.slice(-12).map((x,i,a)=>`<span class="score-step ${i===a.length-1?'current':''}">${x.a}–${x.b}</span>`).join('')}async function load(){if(loading||!window.SupaSync?.req)return;loading=true;try{const [matches,players,pairs]=await Promise.all([SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,team1_id,team2_id,score1,score2,updated_at'),SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&select=id,player1_id,player2_id')]);const pnames=new Map((players||[]).map(p=>[p.id,p.full_name])),pmap=new Map((pairs||[]).map(p=>[p.id,p]));let m=(matches||[]).find(x=>x.status==='live');if(!m){const finals=(matches||[]).filter(x=>x.status==='final').sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));m=finals[0]}if(!m){box.innerHTML='<div class="pending"><strong>Encara no hi ha cap partit en joc.</strong><br>Quan comenci un partit, aquí veuràs el marcador i tota la seva evolució punt a punt.</div>';return}const history=await SupaSync.req(`/rest/v1/match_score_history?tournament_id=eq.2026&match_id=eq.${encodeURIComponent(m.id)}&order=id.asc&select=score1,score2,event_type,created_at`)||[],t1=pairName(pmap.get(m.team1_id),pnames),t2=pairName(pmap.get(m.team2_id),pnames),isLive=m.status==='live';box.innerHTML=`<div class="live-meta"><span>${isLive?'<i class="pulse"></i>EN JOC':'FINALITZAT'}</span><span>Partit ${esc(m.id)}</span><span>${esc(m.stage||'')}</span><span>${esc(m.scheduled_at||'Horari pendent')}</span></div><div class="scoreboard"><div class="live-team"><div class="live-team-name">${esc(t1)}</div><div class="live-score">${Number(m.score1||0)}</div></div><div class="live-sep">–</div><div class="live-team"><div class="live-team-name">${esc(t2)}</div><div class="live-score">${Number(m.score2||0)}</div></div></div><div class="history-box"><div class="history-title">Últims punts</div><div class="score-flow">${flow(history,m)}</div></div>`;requestAnimationFrame(()=>{const f=box.querySelector('.score-flow');if(f)f.scrollLeft=f.scrollWidth})}catch(e){box.innerHTML='<div class="pending"><strong>No s’ha pogut carregar el marcador.</strong><br>Torna-ho a provar en uns segons.</div>'}finally{loading=false}}fullscreenBtn?.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}});document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=document.fullscreenElement?'× Sortir pantalla completa':'⛶ Pantalla completa'});window.addEventListener('supabase:ready',load);window.addEventListener('supabase:change',load);setInterval(load,5000);setTimeout(()=>{if(window.SupaSync){SupaSync.init().catch(()=>{});load()}},500)})();
</script>
<script src="/professional-shell.js?v=live-fullscreen-1"></script>
</body>
</html>
