<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#086443">
  <title>En directe · Campionat 2026</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/professional.css">
  <style>
    .live-wrap{max-width:1000px;margin:0 auto}.live-shell{background:linear-gradient(145deg,#063f2d 0%,#086443 58%,#0a7752 100%);border-radius:30px;padding:30px;color:#fff;box-shadow:0 28px 80px rgba(5,56,37,.22)}
    .live-kicker{font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#ffd08a}.live-title{font-size:clamp(34px,6vw,64px);font-weight:950;line-height:.95;margin:10px 0 14px;text-transform:uppercase}.live-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.live-meta span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.17);padding:8px 11px;border-radius:999px;font-size:11px;font-weight:900}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-top:22px}.live-team{text-align:center}.live-team-name{font-size:clamp(17px,3vw,28px);font-weight:950;line-height:1.25;min-height:70px;display:flex;align-items:center;justify-content:center}.live-score{font-size:clamp(92px,18vw,170px);font-weight:950;line-height:.85;letter-spacing:-.08em}.live-sep{font-size:42px;font-weight:950;color:#ffd08a}.history-box{margin-top:26px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);border-radius:22px;padding:18px}.history-title{font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:950;color:#ffd08a;margin-bottom:12px}.score-flow{display:flex;flex-direction:column;align-items:stretch;gap:7px;max-width:240px;margin:0 auto}.score-step{display:block;background:#fff;color:#074b35;border-radius:12px;padding:10px 14px;font-weight:950;font-size:15px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.08);font-variant-numeric:tabular-nums}.score-step.current{background:#ffd08a;color:#173229}.pending{margin-top:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:22px;line-height:1.6}.pending strong{color:#ffd08a}.live-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.live-actions .btn{background:#fff!important}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd08a;margin-right:6px;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.3}}@media(max-width:620px){.live-shell{padding:22px 18px;border-radius:22px}.scoreboard{grid-template-columns:1fr 34px 1fr;gap:5px}.live-team-name{font-size:15px;min-height:62px}.live-score{font-size:88px}.live-sep{font-size:28px}.score-flow{max-width:190px}.score-step{font-size:13px;padding:9px 10px}}
  </style>
</head>
<body>
<main class="page"><div class="container"><section class="section live-wrap">
  <div class="live-shell">
    <div class="live-kicker">Campionat Frontenis Els Tarongers · 2026</div>
    <div class="live-title">En directe</div>
    <div id="liveContent"><div class="pending"><strong>Carregant marcador…</strong></div></div>
    <div class="live-actions"><a class="btn btn-secondary" href="/horaris">Horaris</a><a class="btn btn-secondary" href="/resultats">Resultats</a><a class="btn btn-secondary" href="/quadre">Quadre</a></div>
  </div>
</section></div></main>
<script src="/app.js?v=score-history-vertical-1"></script>
<script src="/config.js"></script>
<script src="/supabase-sync.js?v=score-history-vertical-1"></script>
<script>
(function(){const box=document.getElementById('liveContent');let loading=false;const esc=s=>Torneig.escapeHtml(s||'—');function pairName(p,idMap){if(!p)return'—';return [idMap.get(p.player1_id),idMap.get(p.player2_id)].filter(Boolean).join(' / ')||'—'}function flow(rows,current){const seq=[];const push=(a,b)=>{const k=`${a}-${b}`;if(seq[seq.length-1]?.k!==k)seq.push({k,a,b})};push(0,0);(rows||[]).forEach(x=>push(Number(x.score1||0),Number(x.score2||0)));push(Number(current.score1||0),Number(current.score2||0));return seq.map((x,i)=>`<span class="score-step ${i===seq.length-1?'current':''}">${x.a}–${x.b}</span>`).join('')}async function load(){if(loading||!window.SupaSync?.req)return;loading=true;try{const [matches,players,pairs]=await Promise.all([SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,team1_id,team2_id,score1,score2,updated_at'),SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&select=id,player1_id,player2_id')]);const pnames=new Map((players||[]).map(p=>[p.id,p.full_name])),pmap=new Map((pairs||[]).map(p=>[p.id,p]));let m=(matches||[]).find(x=>x.status==='live');if(!m){const finals=(matches||[]).filter(x=>x.status==='final').sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));m=finals[0]}if(!m){box.innerHTML='<div class="pending"><strong>Encara no hi ha cap partit en joc.</strong><br>Quan comenci un partit, aquí veuràs el marcador i tota la seva evolució punt a punt.</div>';return}const history=await SupaSync.req(`/rest/v1/match_score_history?tournament_id=eq.2026&match_id=eq.${encodeURIComponent(m.id)}&order=id.asc&select=score1,score2,event_type,created_at`)||[],t1=pairName(pmap.get(m.team1_id),pnames),t2=pairName(pmap.get(m.team2_id),pnames),isLive=m.status==='live';box.innerHTML=`<div class="live-meta"><span>${isLive?'<i class="pulse"></i>EN JOC':'FINALITZAT'}</span><span>Partit ${esc(m.id)}</span><span>${esc(m.stage||'')}</span><span>${esc(m.scheduled_at||'Horari pendent')}</span></div><div class="scoreboard"><div class="live-team"><div class="live-team-name">${esc(t1)}</div><div class="live-score">${Number(m.score1||0)}</div></div><div class="live-sep">–</div><div class="live-team"><div class="live-team-name">${esc(t2)}</div><div class="live-score">${Number(m.score2||0)}</div></div></div><div class="history-box"><div class="history-title">Evolució del marcador</div><div class="score-flow">${flow(history,m)}</div></div>`}catch(e){box.innerHTML='<div class="pending"><strong>No s’ha pogut carregar el marcador.</strong><br>Torna-ho a provar en uns segons.</div>'}finally{loading=false}}window.addEventListener('supabase:ready',load);window.addEventListener('supabase:change',load);setInterval(load,5000);setTimeout(()=>{if(window.SupaSync){SupaSync.init().catch(()=>{});load()}},500)})();
</script>
<script src="/professional-shell.js?v=score-history-vertical-1"></script>
</body>
</html>
