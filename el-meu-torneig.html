<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>El meu torneig · Campionat 2026</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"><style>.my-hero{background:linear-gradient(135deg,#052f22 0%,#07543a 55%,#0b6b49 100%);border-radius:28px;padding:32px;color:#fff;box-shadow:0 20px 50px rgba(3,49,34,.18);position:relative;overflow:hidden}.my-hero:after{content:"";position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06)}.my-hero h1{font-size:clamp(46px,7vw,78px);line-height:.9;margin:7px 0 14px;letter-spacing:-.04em}.my-hero p{max-width:760px;color:#d9eee5;font-size:16px;line-height:1.6}.search-panel{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px;position:relative;z-index:2}.search-panel input{min-height:56px!important;font-size:17px!important;border:0!important;box-shadow:0 8px 24px rgba(0,0,0,.12)}.search-panel .btn{min-width:190px}.shell-note{margin-top:11px;color:#c7e0d5;font-size:12px;position:relative;z-index:2}.identity{background:#fff;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-top:18px}.identity-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.identity h2{margin:4px 0 5px;font-size:32px;color:#073e2d}.identity-sub{color:#65746d}.pair-badge{background:#edf7f2;border:1px solid #c6e4d4;border-radius:999px;padding:9px 13px;font-weight:900;color:#0b6b49;white-space:nowrap}.progress-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.progress-step{border:1px solid var(--border);border-radius:16px;padding:14px;background:#f8faf9;display:flex;align-items:center;gap:11px}.progress-step .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e2e9e5;color:#6c7973;font-weight:950;flex:0 0 auto}.progress-step.done{background:#edf8f2;border-color:#c2e2d1}.progress-step.done .dot{background:#0b6b49;color:#fff}.progress-step.current{background:#fff8e8;border-color:#efd596}.progress-step.current .dot{background:#d69521;color:#fff}.progress-step strong{display:block;color:#173d30;font-size:12px}.progress-step span{display:block;color:#7b8982;font-size:10px;margin-top:2px}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.metric{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;min-height:108px}.metric .label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:950}.metric .value{font-size:18px;font-weight:950;color:#073e2d;margin-top:7px}.metric .meta{margin-top:5px}.main-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.panel h3{margin:3px 0 14px;color:#073e2d;font-size:20px}.next-match{background:linear-gradient(135deg,#fffaf0,#fff3d6);border:1px solid #efd596;border-radius:18px;padding:18px}.next-match .when{font-size:24px;font-weight:950;color:#6d4a00;margin:5px 0}.next-match .stage{font-weight:900;color:#173d30}.reservation-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}.reservation-row:last-child{border-bottom:0}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick-actions a{justify-content:center}.possible-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.possible-list button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 13px;font-weight:850;cursor:pointer}.empty{color:#748078;font-size:13px}.status-ok{color:#0b6b49}.status-warn{color:#9a6500}@media(max-width:900px){.main-grid{grid-template-columns:1fr}.overview{grid-template-columns:1fr 1fr}}@media(max-width:720px){.search-panel{grid-template-columns:1fr}.search-panel .btn{width:100%}.identity-top{flex-direction:column}.overview,.progress-wrap,.quick-actions{grid-template-columns:1fr}.my-hero{padding:24px}.identity h2{font-size:26px}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="my-hero"><div class="eyebrow" style="color:#ffc46e!important">Espai personal del jugador</div><h1>El meu torneig</h1><p>Consulta en un únic lloc tot el que t’afecta: parella, estat del pagament, soci 2026, reserves, pròxim partit i accessos ràpids.</p><div class="search-panel"><input id="q" type="search" placeholder="Escriu nom i primer cognom…" autocomplete="off"><button class="btn btn-accent" id="searchBtn">Obrir el meu torneig</button></div><div class="shell-note">No cal iniciar sessió. Selecciona el teu nom i carregarem la informació pública vinculada.</div></div><div id="result"></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s'-]/g,' ').replace(/\s+/g,' ').trim(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function tokens(s){return norm(s).split(' ').filter(Boolean)}function distance(a,b){a=String(a||'');b=String(b||'');const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const old=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return d[b.length]}function samePerson(a,b){const x=norm(a),y=norm(b);if(!x||!y)return false;if(x===y)return true;const ax=tokens(a),by=tokens(b);return ax.length>=2&&by.length>=2&&((ax[0]===by[0]||distance(ax[0],by[0])<=1)&&(ax[1]===by[1]||distance(ax[1],by[1])<=1))}function personScore(query,name){const qn=norm(query),nn=norm(name),qt=tokens(query),nt=tokens(name);if(!qn||!nn)return 0;if(qn===nn)return 100;if(qt.length>=2&&nt.length>=2){if(qt[0]===nt[0]&&qt[1]===nt[1])return 98;if(nn.startsWith(qn+' '))return 96;if((qt[0]===nt[0]||distance(qt[0],nt[0])<=1)&&(qt[1]===nt[1]||distance(qt[1],nt[1])<=1))return 82;if(nt[0].startsWith(qt[0])&&nt[1].startsWith(qt[1]))return 75}if(qt.length===1&&nn.includes(qn))return 55;return 0}async function loadAll(){const [players,pairs,matches,regs,meals,events,members]=await Promise.all([SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&order=seed.asc&select=id,seed,player1_id,player2_id'),SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,team1_id,team2_id,score1,score2'),SupaSync.req('/rest/v1/rpc/public_registration_summary',{method:'POST',body:{}}),SupaSync.req('/rest/v1/rpc/public_lunch_reservations',{method:'POST',body:{}}),SupaSync.req('/rest/v1/lunch_events?select=id,title,price'),SupaSync.req('/rest/v1/rpc/public_member_registry',{method:'POST',body:{}})]);return{players,pairs,matches,regs,meals,events,members}}function paymentLabel(s){return s==='verified'?'Pagament verificat':s==='bizum_sent'?'Bizum enviat':'Pagament pendent'}function memberLabel(m){if(!m?.active_2026)return'No actiu';return m.member_type_2026==='player'?'Soci Jugador':'Soci No Jugador'}function fmtWhen(v){if(!v)return'Horari pendent';const s=String(v);const m=s.match(/(\d{1,2}:\d{2})/);return m?m[1]:s}function renderPlayer(player,d){const pmap=new Map(d.players.map(p=>[p.id,p.full_name])),pair=d.pairs.find(p=>p.player1_id===player.id||p.player2_id===player.id),mate=pair?(pmap.get(pair.player1_id===player.id?pair.player2_id:pair.player1_id)||'Parella pendent'):'No assignada',reg=d.regs.find(r=>samePerson(r.player1_name,player.full_name)||samePerson(r.player2_name,player.full_name)),member=d.members.find(m=>samePerson(m.full_name,player.full_name)),titles=new Map(d.events.map(e=>[e.id,e.title])),myMeals=d.meals.filter(m=>samePerson(m.full_name,player.full_name)),next=pair?d.matches.filter(m=>m.status!=='final'&&(m.team1_id===pair.id||m.team2_id===pair.id)).sort((a,b)=>String(a.scheduled_at||'').localeCompare(String(b.scheduled_at||'')))[0]:null,paid=reg?.payment_status==='verified',regStatus=reg?paymentLabel(reg.payment_status):'No consta',memberText=memberLabel(member),reservationHtml=myMeals.length?myMeals.map(m=>`<div class="reservation-row"><div><strong>${esc(titles.get(m.lunch_id)||'Reserva')}</strong><div class="meta">Reserva registrada</div></div><span class="badge ${m.payment_status==='verified'?'green':'orange'}">${m.payment_status==='verified'?'Pagat':m.payment_status==='bizum_sent'?'Bizum enviat':'Pendent'}</span></div>`).join(''):'<div class="empty">No tens cap dinar o sopar reservat.</div>';return `<div class="identity"><div class="identity-top"><div><div class="eyebrow">Jugador localitzat</div><h2>${esc(player.full_name)}</h2><div class="identity-sub">Parella: <strong>${esc(mate)}</strong></div></div><div class="pair-badge">${pair?'Parella #'+pair.seed:'Parella pendent'}</div></div><div class="progress-wrap"><div class="progress-step done"><div class="dot">1</div><div><strong>Inscripció</strong><span>Registre localitzat</span></div></div><div class="progress-step ${paid?'done':'current'}"><div class="dot">2</div><div><strong>Pagament</strong><span>${paid?'Verificat':'Pendent de verificar'}</span></div></div><div class="progress-step ${pair?'done':''}"><div class="dot">3</div><div><strong>Quadre</strong><span>${pair?'Parella assignada':'Encara pendent'}</span></div></div></div><div class="overview"><div class="metric"><div class="label">Inscripció</div><div class="value ${paid?'status-ok':'status-warn'}">${esc(regStatus)}</div><div class="meta">${reg?'Registre confirmat':'No consta cap registre'}</div></div><div class="metric"><div class="label">Soci 2026</div><div class="value">${esc(memberText)}</div><div class="meta">${member?.active_2026?'Actiu aquest any':'Sense alta activa'}</div></div><div class="metric"><div class="label">Dinars / sopar</div><div class="value">${myMeals.length}</div><div class="meta">reserva${myMeals.length===1?'':'es'} registrada${myMeals.length===1?'':'des'}</div></div><div class="metric"><div class="label">Parella</div><div class="value">${pair?'#'+pair.seed:'—'}</div><div class="meta">${esc(mate)}</div></div></div><div class="main-grid"><div class="panel"><div class="eyebrow">Competició</div><h3>Pròxim partit</h3>${next?`<div class="next-match"><div class="stage">${esc(next.stage||next.id)}</div><div class="when">${esc(fmtWhen(next.scheduled_at))}</div><div class="meta">Consulta Horaris per veure el detall complet del partit.</div></div>`:`<div class="next-match"><div class="stage">Encara no determinat</div><div class="when">Horari pendent</div><div class="meta">El pròxim partit apareixerà aquí quan el camí del quadre estigui definit.</div></div>`}<div style="margin-top:16px"><div class="eyebrow">Hospitality</div><h3>Dinars i sopar</h3>${reservationHtml}</div></div><div class="panel"><div class="eyebrow">Accions ràpides</div><h3>Què vols fer?</h3><div class="quick-actions"><a class="btn btn-secondary" href="/horaris?jugador=${encodeURIComponent(player.full_name)}">Veure horaris</a><a class="btn btn-secondary" href="/quadre">Veure quadre</a><a class="btn btn-secondary" href="/dinars">Reservar dinars</a><a class="btn btn-secondary" href="/sopar">Reservar sopar</a><a class="btn btn-secondary" href="/merchandising">Merchandising</a><a class="btn btn-secondary" href="/socis">Socis</a></div></div></div></div>`}async function run(forcedName){const term=norm(forcedName||q.value);if(term.length<2){result.innerHTML='<div class="identity"><strong>Escriu almenys 2 lletres.</strong><div class="meta">Exemple: Jordi Civit</div></div>';return}if(forcedName)q.value=forcedName;result.innerHTML='<div class="identity"><strong>Carregant el teu torneig…</strong><div class="meta">Consultant dades actuals.</div></div>';try{const d=await loadAll(),ranked=d.players.map(p=>({p,score:personScore(term,p.full_name)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.p.full_name.localeCompare(b.p.full_name));if(!ranked.length){result.innerHTML='<div class="identity"><strong>No hem trobat cap jugador amb aquest nom.</strong><div class="meta">Comprova nom i primer cognom o prova amb menys lletres.</div></div>';return}const best=ranked[0].score,bestHits=ranked.filter(x=>x.score===best);if(bestHits.length===1&&best>=75){result.innerHTML=renderPlayer(bestHits[0].p,d);return}const candidates=ranked.slice(0,6);result.innerHTML=`<div class="identity"><div class="eyebrow">Coincidències</div><h2 style="font-size:24px">Selecciona el teu nom</h2><div class="possible-list">${candidates.map(x=>`<button type="button" data-name="${esc(x.p.full_name)}">${esc(x.p.full_name)}</button>`).join('')}</div></div>`;result.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>run(b.dataset.name))}catch(e){result.innerHTML='<div class="production-note"><strong>No s’han pogut carregar les dades.</strong><br>Torna-ho a provar en uns segons.</div>'}}searchBtn.onclick=()=>run();q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script><script src="/professional-shell.js?v=my-tournament-pro-2"></script></body></html>
