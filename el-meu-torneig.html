<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>El meu torneig · Campionat 2026</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"><style>.hero{background:linear-gradient(135deg,#043a28,#086443);border-radius:24px;padding:26px;color:#fff}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.92;margin:6px 0 12px}.hero p{color:#d7e9e1;max-width:680px}.searchbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}.searchbar input{font-size:18px;padding:15px}.person-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.status{background:#f7faf8;border:1px solid var(--border);border-radius:14px;padding:13px}.status span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.status b{display:block;margin-top:5px;color:var(--brand-dark);font-size:13px}.meal{padding:8px 0;border-bottom:1px solid var(--border)}.meal:last-child{border:0}.next{background:#fff8e9;border:1px solid #efd6aa;border-radius:16px;padding:16px;margin-top:14px}.next h3{margin:4px 0;color:var(--brand-dark)}@media(max-width:700px){.status-grid{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="hero"><div class="eyebrow" style="color:#ffc46e!important">La teva vista personal</div><h1>El meu torneig</h1><p>Busca el teu nom i consulta en un sol lloc la parella, el pròxim partit, l'estat de la inscripció i tots els àpats reservats.</p><div class="searchbar"><input id="q" type="search" placeholder="Nom o cognom…" autocomplete="off"><button class="btn btn-accent" id="searchBtn">Veure el meu torneig</button></div></div><div id="result"></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function loadAll(){const [players,pairs,matches,regs,meals,events,members]=await Promise.all([SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&order=seed.asc&select=id,seed,player1_id,player2_id'),SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,court,team1_id,team2_id,score1,score2'),SupaSync.req('/rest/v1/rpc/public_registration_summary',{method:'POST',body:{}}),SupaSync.req('/rest/v1/rpc/public_lunch_reservations',{method:'POST',body:{}}),SupaSync.req('/rest/v1/lunch_events?select=id,title,price'),SupaSync.req('/rest/v1/rpc/public_member_registry',{method:'POST',body:{}})]);return{players,pairs,matches,regs,meals,events,members}}function paymentLabel(s){return s==='verified'?'✓ Pagada':s==='bizum_sent'?'Bizum enviat':'Pendent'}async function run(){const term=norm(q.value);if(term.length<2){result.innerHTML='<div class="person-card">Escriu almenys 2 lletres.</div>';return}result.innerHTML='<div class="person-card">Carregant dades actuals…</div>';try{const d=await loadAll(),pmap=new Map(d.players.map(p=>[p.id,p.full_name])),pairMap=new Map(d.pairs.map(p=>[p.id,p])),hits=d.players.filter(p=>norm(p.full_name).includes(term));if(!hits.length){result.innerHTML='<div class="person-card">No hem trobat cap jugador amb aquest nom.</div>';return}result.innerHTML=hits.map(player=>{const pair=d.pairs.find(p=>p.player1_id===player.id||p.player2_id===player.id),mate=pair?(pmap.get(pair.player1_id===player.id?pair.player2_id:pair.player1_id)||'Parella pendent'):'No assignada',reg=d.regs.find(r=>norm(r.player1_name)===norm(player.full_name)||norm(r.player2_name)===norm(player.full_name)),member=d.members.find(m=>norm(m.full_name)===norm(player.full_name)),titles=new Map(d.events.map(e=>[e.id,e.title])),myMeals=d.meals.filter(m=>norm(m.full_name)===norm(player.full_name)),next=pair?d.matches.filter(m=>m.status!=='final'&&(m.team1_id===pair.id||m.team2_id===pair.id)).sort((a,b)=>String(a.scheduled_at||'').localeCompare(String(b.scheduled_at||'')))[0]:null;const mealHtml=myMeals.length?myMeals.map(m=>`<div class="meal"><strong>${esc(titles.get(m.lunch_id)||'Àpat')}</strong><div class="meta">${paymentLabel(m.payment_status)}</div></div>`).join(''):'<div class="meta">Cap àpat reservat.</div>';return `<div class="person-card"><div class="eyebrow">${esc(player.full_name)}</div><h2 style="margin:5px 0;color:#0b5f43">${esc(player.full_name)} / ${esc(mate)}</h2><div class="status-grid"><div class="status"><span>Inscripció</span><b>${reg?paymentLabel(reg.payment_status):'No consta'}</b></div><div class="status"><span>Soci 2026</span><b>${member?.active_2026?'✓ Sí':'No'}</b></div><div class="status"><span>Àpats reservats</span><b>${myMeals.length}</b></div></div>${next?`<div class="next"><div class="eyebrow">Pròxim partit</div><h3>${esc(next.stage||next.id)}</h3><strong>${esc(next.scheduled_at||'Horari pendent')} · ${esc(next.court||'Pista pendent')}</strong></div>`:''}<div style="margin-top:16px"><h3>Àpats</h3>${mealHtml}</div><div class="actions"><a class="btn btn-secondary" href="/dinars">Reservar àpats</a><a class="btn btn-secondary" href="/horaris">Horaris</a></div></div>`}).join('')}catch(e){result.innerHTML='<div class="production-note"><strong>No s’han pogut carregar les dades.</strong><br>Torna-ho a provar en uns segons.</div>'}}searchBtn.onclick=run;q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script><script src="/professional-shell.js?v=livefix1"></script></body></html>
