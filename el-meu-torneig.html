<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>El meu torneig · Campionat 2026</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"><style>.hero{background:linear-gradient(135deg,#043a28,#086443);border-radius:24px;padding:26px;color:#fff}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.92;margin:6px 0 12px}.hero p{color:#d7e9e1;max-width:680px}.searchbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}.searchbar input{font-size:18px;padding:15px}.person-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.status{background:#f7faf8;border:1px solid var(--border);border-radius:14px;padding:13px}.status span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.status b{display:block;margin-top:5px;color:var(--brand-dark);font-size:13px}.meal{padding:8px 0;border-bottom:1px solid var(--border)}.meal:last-child{border:0}.next{background:#fff8e9;border:1px solid #efd6aa;border-radius:16px;padding:16px;margin-top:14px}.next h3{margin:4px 0;color:var(--brand-dark)}.possible-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.possible-list button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 12px;font-weight:850;cursor:pointer}@media(max-width:700px){.status-grid{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="hero"><div class="eyebrow" style="color:#ffc46e!important">La teva vista personal</div><h1>El meu torneig</h1><p>Busca el teu nom i primer cognom i consulta en un sol lloc la parella, el pròxim partit, l'estat de la inscripció i tots els àpats reservats.</p><div class="searchbar"><input id="q" type="search" placeholder="Nom i primer cognom…" autocomplete="off"><button class="btn btn-accent" id="searchBtn">Veure el meu torneig</button></div></div><div id="result"></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s'-]/g,' ').replace(/\s+/g,' ').trim(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function tokens(s){return norm(s).split(' ').filter(Boolean)}function identityKey(s){return tokens(s).slice(0,2).join(' ')}function distance(a,b){a=String(a||'');b=String(b||'');const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const old=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return d[b.length]}function samePerson(a,b){const x=norm(a),y=norm(b);if(!x||!y)return false;if(x===y)return true;const ax=tokens(a),by=tokens(b);if(ax.length<2||by.length<2)return false;if(ax[0]===by[0]&&ax[1]===by[1])return true;if((ax[0]===by[0]||distance(ax[0],by[0])<=1)&&(ax[1]===by[1]||distance(ax[1],by[1])<=1))return true;return false}function personScore(query,name){const qn=norm(query),nn=norm(name),qt=tokens(query),nt=tokens(name);if(!qn||!nn)return 0;if(qn===nn)return 100;if(qt.length>=2&&nt.length>=2){if(qt[0]===nt[0]&&qt[1]===nt[1])return 98;if(nn.startsWith(qn+' '))return 96;if((qt[0]===nt[0]||distance(qt[0],nt[0])<=1)&&(qt[1]===nt[1]||distance(qt[1],nt[1])<=1))return 82;if(nt[0].startsWith(qt[0])&&nt[1].startsWith(qt[1]))return 75}if(qt.length===1&&nn.includes(qn))return 55;return 0}async function loadAll(){const [players,pairs,matches,regs,meals,events,members]=await Promise.all([SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&order=seed.asc&select=id,seed,player1_id,player2_id'),SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,court,team1_id,team2_id,score1,score2'),SupaSync.req('/rest/v1/rpc/public_registration_summary',{method:'POST',body:{}}),SupaSync.req('/rest/v1/rpc/public_lunch_reservations',{method:'POST',body:{}}),SupaSync.req('/rest/v1/lunch_events?select=id,title,price'),SupaSync.req('/rest/v1/rpc/public_member_registry',{method:'POST',body:{}})]);return{players,pairs,matches,regs,meals,events,members}}function paymentLabel(s){return s==='verified'?'✓ Pagada':s==='bizum_sent'?'Bizum enviat':'Pendent'}function renderPlayer(player,d){const pmap=new Map(d.players.map(p=>[p.id,p.full_name])),pair=d.pairs.find(p=>p.player1_id===player.id||p.player2_id===player.id),mate=pair?(pmap.get(pair.player1_id===player.id?pair.player2_id:pair.player1_id)||'Parella pendent'):'No assignada',reg=d.regs.find(r=>samePerson(r.player1_name,player.full_name)||samePerson(r.player2_name,player.full_name)),member=d.members.find(m=>samePerson(m.full_name,player.full_name)),titles=new Map(d.events.map(e=>[e.id,e.title])),myMeals=d.meals.filter(m=>samePerson(m.full_name,player.full_name)),next=pair?d.matches.filter(m=>m.status!=='final'&&(m.team1_id===pair.id||m.team2_id===pair.id)).sort((a,b)=>String(a.scheduled_at||'').localeCompare(String(b.scheduled_at||'')))[0]:null,mealHtml=myMeals.length?myMeals.map(m=>`<div class="meal"><strong>${esc(titles.get(m.lunch_id)||'Àpat')}</strong><div class="meta">${paymentLabel(m.payment_status)}</div></div>`).join(''):'<div class="meta">Cap àpat reservat.</div>';return `<div class="person-card"><div class="eyebrow">${esc(player.full_name)}</div><h2 style="margin:5px 0;color:#0b5f43">${esc(player.full_name)} / ${esc(mate)}</h2><div class="status-grid"><div class="status"><span>Inscripció</span><b>${reg?paymentLabel(reg.payment_status):'No consta'}</b></div><div class="status"><span>Soci 2026</span><b>${member?.active_2026?'✓ Sí':'No'}</b></div><div class="status"><span>Àpats reservats</span><b>${myMeals.length}</b></div></div>${next?`<div class="next"><div class="eyebrow">Pròxim partit</div><h3>${esc(next.stage||next.id)}</h3><strong>${esc(next.scheduled_at||'Horari pendent')} · ${esc(next.court||'Pista pendent')}</strong></div>`:''}<div style="margin-top:16px"><h3>Àpats</h3>${mealHtml}</div><div class="actions"><a class="btn btn-secondary" href="/dinars">Reservar àpats</a><a class="btn btn-secondary" href="/horaris">Horaris</a></div></div>`}async function run(forcedName){const term=norm(forcedName||q.value);if(term.length<2){result.innerHTML='<div class="person-card">Escriu almenys 2 lletres.</div>';return}if(forcedName)q.value=forcedName;result.innerHTML='<div class="person-card">Carregant dades actuals…</div>';try{const d=await loadAll(),ranked=d.players.map(p=>({p,score:personScore(term,p.full_name)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.p.full_name.localeCompare(b.p.full_name));if(!ranked.length){result.innerHTML='<div class="person-card">No hem trobat cap jugador amb aquest nom.</div>';return}const best=ranked[0].score,bestHits=ranked.filter(x=>x.score===best);if(bestHits.length===1&&best>=75){result.innerHTML=renderPlayer(bestHits[0].p,d);return}const candidates=ranked.slice(0,6);result.innerHTML=`<div class="person-card"><strong>Hem trobat possibles coincidències.</strong><div class="meta">Selecciona la teva persona:</div><div class="possible-list">${candidates.map(x=>`<button type="button" data-name="${esc(x.p.full_name)}">${esc(x.p.full_name)}</button>`).join('')}</div></div>`;result.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>run(b.dataset.name))}catch(e){result.innerHTML='<div class="production-note"><strong>No s’han pogut carregar les dades.</strong><br>Torna-ho a provar en uns segons.</div>'}}searchBtn.onclick=()=>run();q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script><script src="/professional-shell.js?v=livefix3"></script></body></html>
