<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#086443">
<title>El meu torneig · Campionat 2026</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/professional.css">
<style>
.my-hero{background:linear-gradient(135deg,#052f22 0%,#07543a 55%,#0b6b49 100%);border-radius:28px;padding:32px;color:#fff;box-shadow:0 20px 50px rgba(3,49,34,.18)}
.my-hero h1{font-size:clamp(46px,7vw,78px);line-height:.9;margin:7px 0 14px;letter-spacing:-.04em}.my-hero p{max-width:760px;color:#d9eee5;font-size:16px;line-height:1.6}
.search-panel{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}.search-panel input{min-height:56px!important;font-size:17px!important;border:0!important}.search-panel .btn{min-width:190px}
.shell-note{margin-top:11px;color:#c7e0d5;font-size:12px}.identity{background:#fff;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-top:18px}
.identity-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.identity h2{margin:4px 0 5px;font-size:32px;color:#073e2d}.identity-sub{color:#65746d}
.pair-badge{background:#edf7f2;border:1px solid #c6e4d4;border-radius:999px;padding:9px 13px;font-weight:900;color:#0b6b49;white-space:nowrap}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.metric{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;min-height:108px}.metric .label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:950}.metric .value{font-size:18px;font-weight:950;color:#073e2d;margin-top:7px}.metric .meta{margin-top:5px}
.phase-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.panel h3{margin:3px 0 14px;color:#073e2d;font-size:20px}
.match-card{border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:10px;background:#fafcfb}.match-card strong{color:#073e2d}.match-meta{font-size:12px;color:#708078;margin-top:5px}
.path-card{border:1px solid #c8dfd3;border-radius:18px;padding:16px;margin-top:12px;background:#f6fbf8}.path-card.first{border-color:#efd596;background:#fffaf0}.path-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.path-title{font-weight:950;color:#073e2d}.group-pill{border-radius:999px;background:#0b6b49;color:#fff;padding:6px 10px;font-weight:950;font-size:12px}.rivals{margin-top:12px;display:grid;gap:8px}.rival{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px}.rival small{display:block;color:#7a8781;margin-top:3px}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.quick-actions a{justify-content:center}.empty{color:#748078;font-size:13px}.status-ok{color:#0b6b49}.status-warn{color:#9a6500}
@media(max-width:900px){.phase-grid{grid-template-columns:1fr}.overview{grid-template-columns:1fr 1fr}}@media(max-width:720px){.search-panel{grid-template-columns:1fr}.search-panel .btn{width:100%}.identity-top{flex-direction:column}.overview,.quick-actions{grid-template-columns:1fr}.my-hero{padding:24px}.identity h2{font-size:26px}}
</style>
</head>
<body>
<main class="page"><div class="container"><section class="section">
<div class="my-hero"><div class="eyebrow" style="color:#ffc46e!important">Espai personal del jugador</div><h1>El meu torneig</h1><p>Consulta la teva parella, els partits de primera fase i els camins possibles de la segona fase amb només els rivals que et poden correspondre.</p><div class="search-panel"><input id="q" type="search" placeholder="Escriu nom i primer cognom…" autocomplete="off"><button class="btn btn-accent" id="searchBtn">Obrir el meu torneig</button></div><div class="shell-note">No cal iniciar sessió. Selecciona el teu nom i carregarem la informació pública vinculada.</div></div>
<div id="result"></div>
</section></div></main>
<script src="/config.js"></script><script src="/supabase-sync.js"></script>
<script>
const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s'-]/g,' ').replace(/\s+/g,' ').trim(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function tokens(s){return norm(s).split(' ').filter(Boolean)}
function distance(a,b){a=String(a||'');b=String(b||'');const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const old=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return d[b.length]}
function samePerson(a,b){const x=norm(a),y=norm(b);if(!x||!y)return false;if(x===y)return true;const ax=tokens(a),by=tokens(b);return ax.length>=2&&by.length>=2&&((ax[0]===by[0]||distance(ax[0],by[0])<=1)&&(ax[1]===by[1]||distance(ax[1],by[1])<=1))}
function personScore(query,name){const qn=norm(query),nn=norm(name),qt=tokens(query),nt=tokens(name);if(!qn||!nn)return 0;if(qn===nn)return 100;if(qt.length>=2&&nt.length>=2){if(qt[0]===nt[0]&&qt[1]===nt[1])return 98;if(nn.startsWith(qn+' '))return 96;if((qt[0]===nt[0]||distance(qt[0],nt[0])<=1)&&(qt[1]===nt[1]||distance(qt[1],nt[1])<=1))return 82;if(nt[0].startsWith(qt[0])&&nt[1].startsWith(qt[1]))return 75}if(qt.length===1&&nn.includes(qn))return 55;return 0}
async function loadAll(){const [players,pairs,matches,regs,members]=await Promise.all([SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&order=seed.asc&select=id,seed,player1_id,player2_id'),SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,team1_id,team2_id,score1,score2'),SupaSync.req('/rest/v1/rpc/public_registration_summary',{method:'POST',body:{}}),SupaSync.req('/rest/v1/rpc/public_member_registry',{method:'POST',body:{}})]);return{players,pairs,matches,regs,members}}
function paymentLabel(s){return s==='verified'?'Pagament verificat':s==='bizum_sent'?'Bizum enviat':'Pagament pendent'}
function memberLabel(m){if(!m?.active_2026)return'No actiu';return m.member_type_2026==='player'?'Soci Jugador':'Soci No Jugador'}
function fmtWhen(v){if(!v)return'Horari pendent';const s=String(v);const day=s.match(/2026-09-(10|11|12)/)?.[1],time=s.match(/T(\d{2}:\d{2})/)?.[1]||s.match(/(\d{1,2}:\d{2})/)?.[1];const d=day==='10'?'Dijous 10':day==='11'?'Divendres 11':day==='12'?'Dissabte 12':'';return [d,time].filter(Boolean).join(' · ')||s}
function pairName(pair,pmap){if(!pair)return'Parella pendent';return `${pmap.get(pair.player1_id)||'Pendent'} / ${pmap.get(pair.player2_id)||'Pendent'}`}
function firstPhaseGroup(pair,matches){if(!pair)return null;const ms=matches.filter(m=>(m.team1_id===pair.id||m.team2_id===pair.id)&&/^[A-H][1-3]$/.test(String(m.id)));return ms.length?String(ms[0].id)[0]:null}
function firstPhaseMatches(pair,matches){if(!pair)return[];return matches.filter(m=>(m.team1_id===pair.id||m.team2_id===pair.id)&&/^[A-H][1-3]$/.test(String(m.id))).sort((a,b)=>String(a.scheduled_at||'').localeCompare(String(b.scheduled_at||'')))}
const FG='ABCDEFGH'.split(''),SG='IJKLMNOP'.split('');
function secondGroupInfo(group,position,d,pmap){const idx=FG.indexOf(group);if(idx<0)return null;const sg=position===1?SG[idx]:SG[(idx+7)%8],seed=position===1?idx+1:((idx+7)%8)+1,other=position===1?FG[(idx+1)%8]:FG[(idx+7)%8],otherPos=position===1?2:1,seedPair=d.pairs.find(p=>p.seed===seed);return{group:sg,seed,seedName:pairName(seedPair,pmap),otherGroup:other,otherPos}}
function seededSecondGroupInfo(seed,d,pmap){if(seed<1||seed>8)return null;const idx=seed-1,sg=SG[idx],first=FG[idx],second=FG[(idx+1)%8];return{group:sg,seed,seedName:pairName(d.pairs.find(p=>p.seed===seed),pmap),firstGroup:first,secondGroup:second}}
function pathHtml(info,label){return `<div class="path-card ${label.includes('1r')?'first':''}"><div class="path-head"><div class="path-title">${esc(label)}</div><div class="group-pill">Grup ${esc(info.group)}</div></div><div class="rivals"><div class="rival"><strong>Cap de sèrie #${info.seed}: ${esc(info.seedName)}</strong><small>Entra directament a la 2a fase</small></div><div class="rival"><strong>${info.otherPos}r del grup ${esc(info.otherGroup)}</strong><small>Aquest és l’únic altre rival possible del teu grup de 2a fase</small></div></div></div>`}
function renderPlayer(player,d){const pmap=new Map(d.players.map(p=>[p.id,p.full_name])),pair=d.pairs.find(p=>p.player1_id===player.id||p.player2_id===player.id),mate=pair?(pmap.get(pair.player1_id===player.id?pair.player2_id:pair.player1_id)||'Parella pendent'):'No assignada',reg=d.regs.find(r=>samePerson(r.player1_name,player.full_name)||samePerson(r.player2_name,player.full_name)),member=d.members.find(m=>samePerson(m.full_name,player.full_name)),paid=reg?.payment_status==='verified',regStatus=reg?paymentLabel(reg.payment_status):'No consta',memberText=memberLabel(member),group=firstPhaseGroup(pair,d.matches),phase1=firstPhaseMatches(pair,d.matches);
let phase1Html='',phase2Html='';
if(pair&&pair.seed<=8){phase1Html='<div class="empty">Cap de sèrie: entres directament a la segona fase.</div>';const inf=seededSecondGroupInfo(pair.seed,d,pmap);phase2Html=`<div class="path-card first"><div class="path-head"><div class="path-title">Entrada directa</div><div class="group-pill">Grup ${inf.group}</div></div><div class="rivals"><div class="rival"><strong>1r del grup ${inf.firstGroup}</strong><small>Possible rival</small></div><div class="rival"><strong>2n del grup ${inf.secondGroup}</strong><small>Possible rival</small></div></div></div>`}
else{phase1Html=phase1.length?phase1.map(m=>`<div class="match-card"><strong>Partit ${esc(m.id)} · Grup ${esc(String(m.id)[0])}</strong><div class="match-meta">${esc(fmtWhen(m.scheduled_at))}</div></div>`).join(''):'<div class="empty">Partits de primera fase pendents d’assignar.</div>';if(group){const p1=secondGroupInfo(group,1,d,pmap),p2=secondGroupInfo(group,2,d,pmap);phase2Html=pathHtml(p1,`Si quedes 1r del grup ${group}`)+pathHtml(p2,`Si quedes 2n del grup ${group}`)}else phase2Html='<div class="empty">Encara no es pot determinar el teu camí de segona fase.</div>'}
return `<div class="identity"><div class="identity-top"><div><div class="eyebrow">Jugador localitzat</div><h2>${esc(player.full_name)}</h2><div class="identity-sub">Parella: <strong>${esc(mate)}</strong>${group?` · Grup ${esc(group)}`:''}</div></div><div class="pair-badge">${pair?'Parella #'+pair.seed:'Parella pendent'}</div></div><div class="overview"><div class="metric"><div class="label">Inscripció</div><div class="value ${paid?'status-ok':'status-warn'}">${esc(regStatus)}</div><div class="meta">${reg?'Registre localitzat':'No consta'}</div></div><div class="metric"><div class="label">Soci 2026</div><div class="value">${esc(memberText)}</div><div class="meta">${member?.active_2026?'Actiu aquest any':'Sense alta activa'}</div></div><div class="metric"><div class="label">Primera fase</div><div class="value">${pair?.seed<=8?'Directe 2a fase':group?'Grup '+group:'—'}</div><div class="meta">${pair?.seed<=8?'Cap de sèrie':'3 parelles per grup'}</div></div><div class="metric"><div class="label">Parella</div><div class="value">${pair?'#'+pair.seed:'—'}</div><div class="meta">${esc(mate)}</div></div></div><div class="phase-grid"><div class="panel"><div class="eyebrow">1a fase</div><h3>Els teus partits</h3>${phase1Html}</div><div class="panel"><div class="eyebrow">2a fase</div><h3>Possibles rivals</h3><div class="match-meta">Només es mostren els rivals que poden acabar al teu grup segons la classificació de la 1a fase.</div>${phase2Html}</div></div><div class="quick-actions"><a class="btn btn-secondary" href="/horaris?jugador=${encodeURIComponent(player.full_name)}">Veure horaris</a><a class="btn btn-secondary" href="/quadre">Veure quadre</a><a class="btn btn-secondary" href="/resultats">Resultats</a></div></div>`}
async function run(forcedName){const term=norm(forcedName||q.value);if(term.length<2){result.innerHTML='<div class="identity"><strong>Escriu almenys 2 lletres.</strong></div>';return}if(forcedName)q.value=forcedName;result.innerHTML='<div class="identity"><strong>Carregant el teu torneig…</strong></div>';try{const d=await loadAll(),ranked=d.players.map(p=>({p,score:personScore(term,p.full_name)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.p.full_name.localeCompare(b.p.full_name));if(!ranked.length){result.innerHTML='<div class="identity"><strong>No hem trobat cap jugador amb aquest nom.</strong></div>';return}const best=ranked[0].score,bestHits=ranked.filter(x=>x.score===best);if(bestHits.length===1&&best>=75){result.innerHTML=renderPlayer(bestHits[0].p,d);return}const candidates=ranked.slice(0,6);result.innerHTML=`<div class="identity"><div class="eyebrow">Coincidències</div><h2 style="font-size:24px">Selecciona el teu nom</h2><div class="possible-list">${candidates.map(x=>`<button type="button" data-name="${esc(x.p.full_name)}">${esc(x.p.full_name)}</button>`).join('')}</div></div>`;result.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>run(b.dataset.name))}catch(e){result.innerHTML='<div class="identity"><strong>No s’han pogut carregar les dades.</strong><div class="meta">Torna-ho a provar en uns segons.</div></div>'}}
searchBtn.onclick=()=>run();q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
<script src="/professional-shell.js?v=my-tournament-phase2-20260909"></script>
</body></html>
