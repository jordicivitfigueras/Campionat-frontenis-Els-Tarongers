<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>El meu torneig · Campionat 2026</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"><style>
.my-hero{background:linear-gradient(135deg,#052f22,#0b6b49);border-radius:28px;padding:32px;color:#fff;box-shadow:var(--shadow)}.my-hero h1{font-size:clamp(44px,7vw,76px);line-height:.92;margin:7px 0 14px}.my-hero p{max-width:800px;color:#d9eee5;line-height:1.6}.search-panel{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}.search-panel input{min-height:56px!important;font-size:17px!important;border:0!important}.identity{background:#fff;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-top:18px}.identity-top{display:flex;justify-content:space-between;gap:18px}.identity h2{margin:4px 0 5px;font-size:32px;color:#073e2d}.pair-badge{background:#edf7f2;border:1px solid #c6e4d4;border-radius:999px;padding:9px 13px;font-weight:900;color:#0b6b49;white-space:nowrap}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.metric{background:#fff;border:1px solid var(--border);border-radius:18px;padding:15px}.metric .label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:950}.metric .value{font-size:18px;font-weight:950;color:#073e2d;margin-top:7px}.section-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:16px}.section-card h3{margin:3px 0 12px;color:#073e2d}.rival-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rival-card{border:1px solid #dfe8e3;border-radius:15px;padding:13px;background:#fafcfb}.rival-card strong{display:block;color:#073e2d}.rival-card small{display:block;color:#6f7e77;margin-top:4px}.path-card{border:1px solid #c8dfd3;border-radius:18px;padding:16px;margin-top:14px;background:#f6fbf8}.path-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.path-title{font-weight:950;color:#073e2d}.pill{border-radius:999px;background:#0b6b49;color:#fff;padding:6px 10px;font-weight:950;font-size:11px}.round{margin-top:12px;border-top:1px solid #dfe8e3;padding-top:12px}.round:first-of-type{border-top:0}.round-title{font-size:12px;font-weight:950;color:#805d16;text-transform:uppercase;letter-spacing:.06em}.names{display:grid;gap:6px;margin-top:8px}.name{background:#fff;border:1px solid #e2e9e5;border-radius:11px;padding:9px 10px;font-size:12px;font-weight:800}.meta{font-size:11px;color:#748078;margin-top:4px}.empty{color:#748078;font-size:13px}.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.quick-actions a{justify-content:center}@media(max-width:850px){.overview,.rival-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.search-panel,.overview,.rival-grid,.quick-actions{grid-template-columns:1fr}.identity-top{flex-direction:column}.my-hero{padding:24px}}
</style></head><body><main class="page"><div class="container"><section class="section"><div class="my-hero"><div class="eyebrow" style="color:#ffc46e!important">Espai personal del jugador</div><h1>El meu torneig</h1><p>Consulta tots els rivals possibles des de la teva primera fase fins a la final, tenint en compte tots els camins que pot generar la classificació.</p><div class="search-panel"><input id="q" type="search" placeholder="Escriu nom i primer cognom…" autocomplete="off"><button class="btn btn-accent" id="searchBtn">Obrir el meu torneig</button></div></div><div id="result"></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>
const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s'-]/g,' ').replace(/\s+/g,' ').trim(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function tokens(s){return norm(s).split(' ').filter(Boolean)}function distance(a,b){a=String(a||'');b=String(b||'');const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const old=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return d[b.length]}function samePerson(a,b){const ax=tokens(a),bx=tokens(b);return norm(a)===norm(b)||(ax.length>=2&&bx.length>=2&&(ax[0]===bx[0]||distance(ax[0],bx[0])<=1)&&(ax[1]===bx[1]||distance(ax[1],bx[1])<=1))}function personScore(q,n){const qt=tokens(q),nt=tokens(n);if(norm(q)===norm(n))return 100;if(qt.length>=2&&nt.length>=2&&(qt[0]===nt[0]||distance(qt[0],nt[0])<=1)&&(qt[1]===nt[1]||distance(qt[1],nt[1])<=1))return 85;if(norm(n).includes(norm(q)))return 55;return 0}
async function loadAll(){const [players,pairs,matches,regs,members]=await Promise.all([SupaSync.req('/rest/v1/players?select=id,full_name'),SupaSync.req('/rest/v1/pairs?tournament_id=eq.2026&order=seed.asc&select=id,seed,player1_id,player2_id'),SupaSync.req('/rest/v1/matches?tournament_id=eq.2026&select=id,stage,status,scheduled_at,team1_id,team2_id,score1,score2'),SupaSync.req('/rest/v1/rpc/public_registration_summary',{method:'POST',body:{}}),SupaSync.req('/rest/v1/rpc/public_member_registry',{method:'POST',body:{}})]);return{players,pairs,matches,regs,members}}
const FG='ABCDEFGH'.split(''),SG='IJKLMNOP'.split('');const V={V1:['1I','2M'],V8:['1P','2L'],V4:['1L','2P'],V5:['1M','2I'],V3:['1K','2O'],V6:['1N','2J'],V2:['1J','2N'],V7:['1O','2K']};const Q={Q1:['V1','V8'],Q2:['V4','V5'],Q3:['V3','V6'],Q4:['V2','V7']};const S={S1:['Q1','Q2'],S2:['Q3','Q4']};
function pmap(d){return new Map(d.players.map(x=>[x.id,x.full_name]))}function pairName(p,d){const m=pmap(d);return p?`${m.get(p.player1_id)||'Pendent'} / ${m.get(p.player2_id)||'Pendent'}`:'Parella pendent'}function uniqPairs(a){const m=new Map;a.filter(Boolean).forEach(p=>m.set(p.id,p));return [...m.values()]}function firstGroupPairs(g,d){const ids=new Set;d.matches.filter(m=>String(m.id).startsWith(g)&&/^[A-H][1-3]$/.test(String(m.id))).forEach(m=>{if(m.team1_id)ids.add(m.team1_id);if(m.team2_id)ids.add(m.team2_id)});return d.pairs.filter(p=>ids.has(p.id))}function firstGroupOf(pair,d){const m=d.matches.find(x=>/^[A-H][1-3]$/.test(String(x.id))&&(x.team1_id===pair.id||x.team2_id===pair.id));return m?String(m.id)[0]:null}function secondCandidates(g,d){const i=SG.indexOf(g);if(i<0)return[];return uniqPairs([d.pairs.find(p=>p.seed===i+1),...firstGroupPairs(FG[i],d),...firstGroupPairs(FG[(i+1)%8],d)])}function slotCandidates(slot,d){const g=slot.slice(1);return secondCandidates(g,d)}function vCandidates(v,d){return uniqPairs(V[v].flatMap(s=>slotCandidates(s,d)))}function qCandidates(q,d){return uniqPairs(Q[q].flatMap(v=>vCandidates(v,d)))}function sCandidates(s,d){return uniqPairs(S[s].flatMap(q=>qCandidates(q,d)))}function namesHtml(arr,d,self){const xs=uniqPairs(arr).filter(p=>p.id!==self?.id);return xs.length?`<div class="names">${xs.map(p=>`<div class="name">${esc(pairName(p,d))}</div>`).join('')}</div>`:'<div class="empty">Encara no hi ha cap rival possible.</div>'}function matchTime(id,d){const m=d.matches.find(x=>x.id===id);return m?.scheduled_at||'Horari pendent'}
function firstPhaseHtml(pair,d){if(pair.seed<=8)return'<div class="empty">Cap de sèrie: no jugues 1a fase.</div>';const g=firstGroupOf(pair,d),r=firstGroupPairs(g,d).filter(p=>p.id!==pair.id);return `<div class="meta">Grup ${g}</div>${namesHtml(r,d,pair)}`}
function secondEntries(pair,d){if(pair.seed<=8)return[{label:'Entrada directa',group:SG[pair.seed-1]}];const g=firstGroupOf(pair,d),i=FG.indexOf(g);return[{label:`Si quedes 1r del grup ${g}`,group:SG[i]},{label:`Si quedes 2n del grup ${g}`,group:SG[(i+7)%8]}]}
function vPath(group,pos){const key=`${pos}${group}`;for(const [id,slots] of Object.entries(V)){const k=slots.indexOf(key);if(k>=0)return{id,opp:slots[1-k]}}return null}function parentQ(v){return Object.entries(Q).find(([,a])=>a.includes(v))?.[0]}function parentS(q){return Object.entries(S).find(([,a])=>a.includes(q))?.[0]}function sibling(id,map){const e=Object.entries(map).find(([,a])=>a.includes(id));return e?e[1].find(x=>x!==id):null}
function pathBlock(entry,pair,d){const sec=secondCandidates(entry.group,d).filter(p=>p.id!==pair.id);let html=`<div class="path-card"><div class="path-head"><div class="path-title">${esc(entry.label)}</div><div class="pill">Grup ${entry.group}</div></div><div class="round"><div class="round-title">2a fase · possibles rivals</div>${namesHtml(sec,d,pair)}</div>`;[1,2].forEach(pos=>{const vp=vPath(entry.group,pos);if(!vp)return;const q=parentQ(vp.id),ov=sibling(vp.id,Q),s=parentS(q),oq=sibling(q,S),os=sibling(s,{FINAL:['S1','S2']});html+=`<div class="round"><div class="round-title">Si quedes ${pos}r a la 2a fase → Vuitens ${vp.id}</div><div class="meta">${esc(matchTime(vp.id,d))}</div>${namesHtml(slotCandidates(vp.opp,d),d,pair)}</div><div class="round"><div class="round-title">Quarts ${q}</div><div class="meta">${esc(matchTime(q,d))}</div>${namesHtml(vCandidates(ov,d),d,pair)}</div><div class="round"><div class="round-title">Semifinal ${s}</div><div class="meta">${esc(matchTime(s,d))}</div>${namesHtml(qCandidates(oq,d),d,pair)}</div><div class="round"><div class="round-title">Final</div><div class="meta">${esc(matchTime('FINAL',d))}</div>${namesHtml(sCandidates(os,d),d,pair)}</div>`});return html+'</div>'}
function renderPlayer(player,d){const pair=d.pairs.find(p=>p.player1_id===player.id||p.player2_id===player.id),m=pmap(d),mate=pair?(m.get(pair.player1_id===player.id?pair.player2_id:pair.player1_id)||'Pendent'):'No assignada',reg=d.regs.find(r=>samePerson(r.player1_name,player.full_name)||samePerson(r.player2_name,player.full_name)),member=d.members.find(x=>samePerson(x.full_name,player.full_name));if(!pair)return'<div class="identity">Parella no assignada.</div>';const entries=secondEntries(pair,d);return `<div class="identity"><div class="identity-top"><div><div class="eyebrow">Jugador localitzat</div><h2>${esc(player.full_name)}</h2><div class="meta">Parella: <strong>${esc(mate)}</strong></div></div><div class="pair-badge">Parella #${pair.seed}</div></div><div class="overview"><div class="metric"><div class="label">Pagament</div><div class="value">${reg?.payment_status==='verified'?'Verificat':reg?.payment_status||'—'}</div></div><div class="metric"><div class="label">Soci 2026</div><div class="value">${member?.active_2026?'Actiu':'No actiu'}</div></div><div class="metric"><div class="label">1a fase</div><div class="value">${pair.seed<=8?'Directe 2a':`Grup ${firstGroupOf(pair,d)}`}</div></div><div class="metric"><div class="label">Seed</div><div class="value">#${pair.seed}</div></div></div><div class="section-card"><div class="eyebrow">1a fase</div><h3>Rivals possibles</h3>${firstPhaseHtml(pair,d)}</div><div class="section-card"><div class="eyebrow">2a fase → Final</div><h3>Tots els camins i rivals possibles</h3><div class="meta">Es mostren tots els rivals que poden arribar a creuar-se amb tu segons la teva classificació a cada fase.</div>${entries.map(e=>pathBlock(e,pair,d)).join('')}</div><div class="quick-actions"><a class="btn btn-secondary" href="/horaris?jugador=${encodeURIComponent(player.full_name)}">Horaris</a><a class="btn btn-secondary" href="/quadre">Quadre</a><a class="btn btn-secondary" href="/resultats">Resultats</a></div></div>`}
async function run(forced){const term=norm(forced||q.value);if(term.length<2){result.innerHTML='<div class="identity">Escriu almenys 2 lletres.</div>';return}if(forced)q.value=forced;result.innerHTML='<div class="identity">Carregant…</div>';try{const d=await loadAll(),rank=d.players.map(p=>({p,s:personScore(term,p.full_name)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);if(!rank.length){result.innerHTML='<div class="identity">No hem trobat cap jugador.</div>';return}if(rank.length===1||rank[0].s>rank[1].s){result.innerHTML=renderPlayer(rank[0].p,d);return}result.innerHTML=`<div class="identity"><h3>Selecciona el teu nom</h3>${rank.slice(0,6).map(x=>`<button class="btn btn-secondary" style="margin:4px" data-name="${esc(x.p.full_name)}">${esc(x.p.full_name)}</button>`).join('')}</div>`;result.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>run(b.dataset.name))}catch(e){result.innerHTML='<div class="identity">No s’han pogut carregar les dades.</div>'}}searchBtn.onclick=()=>run();q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script><script src="/professional-shell.js?v=my-tournament-all-rivals-20260909"></script></body></html>
