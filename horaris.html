<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Horaris · Campionat Frontenis Els Tarongers 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.schedule-hero{background:linear-gradient(135deg,#043a28,#086443);color:#fff;border-radius:26px;padding:32px;display:flex;justify-content:space-between;gap:24px;align-items:center;box-shadow:var(--shadow)}.schedule-hero h1{margin:5px 0 8px;font-size:clamp(38px,6vw,68px);line-height:.9;text-transform:uppercase}.schedule-hero p{max-width:680px;color:rgba(255,255,255,.78)}.day-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.day-tab{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer}.day-tab.active{background:var(--accent);border-color:var(--accent)}.schedule-tools{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:12px}.day-block{margin-top:26px}.day-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:10px}.day-head h2{font-size:34px;margin:0;color:var(--brand)}.schedule-list{display:flex;flex-direction:column;gap:9px}.schedule-row{display:grid;grid-template-columns:90px 80px 110px 1fr 70px;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px 15px;box-shadow:0 8px 24px rgba(12,45,32,.07)}.schedule-row.live{border:2px solid var(--accent)}.schedule-row.social{background:#fff8e9;border-color:#efd6aa}.schedule-time{font-size:21px;font-weight:950;color:var(--brand)}.schedule-code{font-size:11px;font-weight:950;background:#edf3ef;padding:6px 8px;border-radius:999px;text-align:center}.schedule-stage{font-size:11px;font-weight:900;color:#63736b;text-transform:uppercase}.schedule-teams{font-weight:900;line-height:1.4}.schedule-teams small{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-top:2px}.schedule-court{font-size:11px;font-weight:900;text-align:right}.schedule-note{background:#fff8e9;border:1px solid #f1d6a8;border-radius:14px;padding:13px 15px;font-size:12px;color:#6c511e;margin-top:15px}@media(max-width:800px){.schedule-hero{padding:25px 20px}.schedule-tools{grid-template-columns:1fr}.schedule-row{grid-template-columns:72px 62px 1fr}.schedule-stage{display:none}.schedule-teams{grid-column:3}.schedule-court{grid-column:3;text-align:left}.day-head{align-items:start;flex-direction:column}}</style></head><body><main class="page"><div class="container"><section class="section"><div class="schedule-hero"><div><div class="eyebrow" style="color:#ffc46e!important">Edició 2026 · 10–12 setembre</div><h1>Agenda</h1><p>Partits i activitats del Campionat Frontenis Els Tarongers en una única agenda.</p></div><div style="font-size:72px">◷</div></div><div class="day-tabs" id="tabs"></div><div class="form-panel"><div class="schedule-tools"><div class="field"><label>Buscar jugador o parella</label><input id="search" type="search" placeholder="Nom o cognom"></div><div class="field"><label>Fase</label><select id="stage"><option value="all">Totes les fases</option></select></div><div class="field"><label>Pista</label><select id="court"><option value="all">Totes les pistes</option></select></div></div></div><div class="schedule-note"><strong>Important:</strong> els horaris socials que encara no tenen hora tancada apareixen com “Per confirmar”. L'organització els actualitzarà quan quedin definitius.</div><div id="schedule"></div></section></div></main><script src="app.js"></script><script>const DAYS=['Dijous 10','Divendres 11','Dissabte 12'];const SOCIAL=[{day:'Divendres 11',clock:'Per confirmar',title:'Dinar · Fideus a la cassola',detail:'~10 € · beguda no inclosa',href:'/dinars'},{day:'Dissabte 12',clock:'Per confirmar',title:'Dinar · Paella',detail:'~10 € · beguda no inclosa',href:'/dinars'},{day:'Dissabte 12',clock:'Per confirmar',title:'Sopar · Bocata',detail:'6 € · reserva des de l’app',href:'/sopar'},{day:'Dissabte 12',clock:'Per confirmar',title:'Concert / ambient',detail:'Horari pendent de confirmació',href:''}];let selected='all';const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');function parseTime(t){const m=String(t||'').match(/^(.*?) · (\d{2}:\d{2})$/);return m?{day:m[1],clock:m[2]}:{day:'Sense dia',clock:'—'}}function allMatches(){const s=Torneig.loadState();return Torneig.allIds().map(id=>s.matches[id]).filter(Boolean)}function setupFilters(){const ms=allMatches(),stages=[...new Set(ms.map(m=>m.stage).filter(Boolean))],courts=[...new Set(ms.map(m=>m.court).filter(Boolean))];stage.innerHTML='<option value="all">Totes les fases</option>'+stages.map(x=>`<option>${Torneig.escapeHtml(x)}</option>`).join('');court.innerHTML='<option value="all">Totes les pistes</option>'+courts.map(x=>`<option>${Torneig.escapeHtml(x)}</option>`).join('');tabs.innerHTML=`<button class="day-tab active" data-day="all">Tots</button>`+DAYS.map(d=>`<button class="day-tab" data-day="${d}">${d}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.day;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()})}function teams(m){return `<div class="schedule-teams">${Torneig.escapeHtml(Torneig.pairName(m.team1))} <span style="color:#9aa6a0">vs</span> ${Torneig.escapeHtml(Torneig.pairName(m.team2))}<small>${m.status==='final'?`Finalitzat · ${m.s1}–${m.s2}`:m.status==='en joc'?'Partit en joc':'Pendent'}</small></div>`}function render(){const q=norm(search.value),st=stage.value,ct=court.value;let ms=allMatches().map(m=>({type:'match',m,...parseTime(m.time)})).filter(x=>(selected==='all'||x.day===selected)&&(st==='all'||x.m.stage===st)&&(ct==='all'||x.m.court===ct)&&(!q||norm(Torneig.pairName(x.m.team1)+' '+Torneig.pairName(x.m.team2)).includes(q)));let social=SOCIAL.filter(x=>(selected==='all'||x.day===selected)&&st==='all'&&ct==='all'&&!q).map(x=>({type:'social',...x}));const order=d=>DAYS.indexOf(d)<0?99:DAYS.indexOf(d),clockOrder=c=>/^\d/.test(c)?c:'99:99';const all=[...ms,...social].sort((a,b)=>order(a.day)-order(b.day)||clockOrder(a.clock).localeCompare(clockOrder(b.clock)));const groups=[...new Set(all.map(x=>x.day))];schedule.innerHTML=groups.length?groups.map(day=>{const rows=all.filter(x=>x.day===day);return `<section class="day-block"><div class="day-head"><h2>${Torneig.escapeHtml(day)}</h2><span>${rows.length} elements</span></div><div class="schedule-list">${rows.map(x=>x.type==='social'?`<div class="schedule-row social"><div class="schedule-time">${x.clock}</div><div class="schedule-code">ACTIVITAT</div><div class="schedule-stage">Social</div><div class="schedule-teams">${Torneig.escapeHtml(x.title)}<small>${Torneig.escapeHtml(x.detail)}</small></div><div class="schedule-court">${x.href?`<a href="${x.href}">Reservar</a>`:''}</div></div>`:`<div class="schedule-row ${x.m.status==='en joc'?'live':''}"><div class="schedule-time">${x.clock}</div><div class="schedule-code">${x.m.id==='FINAL'?'FINAL':Torneig.escapeHtml(x.m.id)}</div><div class="schedule-stage">${Torneig.escapeHtml(x.m.stage||'')}</div>${teams(x.m)}<div class="schedule-court">${Torneig.escapeHtml(x.m.court||'Pista 1')}</div></div>`).join('')}</div></section>`}).join(''):'<div class="empty-schedule">No hi ha elements que coincideixin amb aquests filtres.</div>'}search.oninput=render;stage.onchange=render;court.onchange=render;setupFilters();render();if(Torneig.BC)Torneig.BC.onmessage=render;addEventListener('storage',render);window.addEventListener('supabase:change',render);</script><script src="professional-shell.js"></script></body></html>
