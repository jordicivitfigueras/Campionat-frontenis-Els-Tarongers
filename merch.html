<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Merchandising · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Sota demanda</div><h1 class="section-title">Merchandising</h1></div></div><div class="product-grid"><div class="product"><div class="mock-img">POLO TÈCNIC</div><h3>Polo tècnic</h3><div class="price">30 €</div><p class="meta">Talles XS–XXL</p><button class="btn btn-accent" onclick="order('Polo tècnic',30)">Demanar</button></div><div class="product"><div class="mock-img">POLO COTÓ</div><h3>Polo de cotó</h3><div class="price">30 €</div><p class="meta">Talles XS–XXL</p><button class="btn btn-accent" onclick="order('Polo de cotó',30)">Demanar</button></div><div class="product"><div class="mock-img">GORRA</div><h3>Gorra</h3><div class="price">15 €</div><p class="meta">Talla única</p><button class="btn btn-accent" onclick="order('Gorra',15)">Demanar</button></div></div><div id="orderBox" class="form-panel" style="margin-top:22px;display:none"></div></section></div></main><script src="portal.js"></script><script>function order(product,price){document.getElementById('orderBox').style.display='block';document.getElementById('orderBox').innerHTML=`<h2 style="margin-top:0">${product}</h2><div class="form-grid"><div class="field"><label>Nom i cognoms</label><input id="buyer"></div><div class="field"><label>Talla</label><select id="size"><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>Talla única</option></select></div><div class="field"><label>Quantitat</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Nom utilitzat al Bizum</label><input id="bizumName"></div></div><div class="payment-box" style="margin-top:14px"><strong>${price} € / unitat</strong><div class="meta">L'organització verificarà el Bizum abans de donar la comanda per pagada.</div></div><label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-weight:800;color:#33463e"><input id="bizumSent" type="checkbox"> He fet el Bizum</label><div class="actions"><button class="btn btn-accent" onclick="confirmOrder('${product}',${price})">Enviar comanda</button></div>`}function confirmOrder(product,price){const buyer=document.getElementById('buyer').value.trim(),size=document.getElementById('size').value,qty=Math.max(1,parseInt(document.getElementById('qty').value||1)),bizumName=document.getElementById('bizumName').value.trim(),sent=document.getElementById('bizumSent').checked;if(buyer.split(/\s+/).length<2){alert('Posa nom i cognoms.');return}const s=Portal.load();s.merchOrders=s.merchOrders||[];s.merchOrders.push({buyer,product,size,qty,total:qty*price,bizumName,status:sent?'bizum_enviat':'pendent',createdAt:new Date().toISOString()});Portal.save(s);if(sent)Portal.registerBizum('Merchandising',qty*price,buyer+' · '+product,bizumName||buyer);alert(sent?'Comanda registrada. Bizum pendent de verificació.':'Comanda registrada. Pagament pendent.');document.getElementById('orderBox').style.display='none'}</script><script src="professional-shell.js"></script></body></html>
