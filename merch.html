<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Merchandising · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Sota demanda</div><h1 class="section-title">Merchandising</h1><p class="meta">Productes i preus actualitzats directament des del portal de l’organització.</p></div></div><div id="closed" class="notice-card" style="display:none;margin-bottom:16px"><strong>Comandes tancades</strong><div class="meta">L'organització ha tancat temporalment el merchandising.</div></div><div class="product-grid" id="products"><div class="notice-card">Carregant productes…</div></div><div id="orderBox" class="form-panel" style="margin-top:22px;display:none"></div></section></div></main><script src="/config.js"></script><script src="/supabase-sync.js"></script><script>let OPEN=true,PRODUCTS=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){try{const [cfg,prods]=await Promise.all([SupaSync.req('/rest/v1/tournament_config?id=eq.2026&select=merch_open'),SupaSync.req('/rest/v1/merch_products?active=eq.true&order=name.asc&select=id,name,price,sizes,active')]);OPEN=cfg?.[0]?.merch_open!==false;PRODUCTS=prods||[];closed.style.display=OPEN?'none':'block';products.style.opacity=OPEN?'1':'.55';products.innerHTML=PRODUCTS.length?PRODUCTS.map(p=>`<div class="product"><div class="mock-img">${esc(p.name).toUpperCase()}</div><h3>${esc(p.name)}</h3><div class="price">${Number(p.price||0).toFixed(0)} €</div><p class="meta">${Array.isArray(p.sizes)?p.sizes.join(' · '):'Talla segons producte'}</p><button class="btn btn-accent" ${OPEN?'':'disabled'} onclick="order('${p.id}')">Demanar</button></div>`).join(''):'<div class="notice-card">Encara no hi ha productes actius.</div>'}catch(e){products.innerHTML='<div class="production-note">No s’han pogut carregar els productes.</div>'}}function order(id){if(!OPEN)return;const p=PRODUCTS.find(x=>x.id===id);if(!p)return;const sizes=Array.isArray(p.sizes)&&p.sizes.length?p.sizes:['Talla única'];orderBox.style.display='block';orderBox.innerHTML=`<h2 style="margin-top:0">${esc(p.name)}</h2><div class="form-grid"><div class="field"><label>Nom i cognoms</label><input id="buyer"></div><div class="field"><label>Talla</label><select id="size">${sizes.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Quantitat</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Nom utilitzat al Bizum</label><input id="bizumName"></div></div><div class="payment-box" style="margin-top:14px"><strong>${Number(p.price||0).toFixed(0)} € / unitat</strong><div class="meta">L'organització verificarà el pagament des del portal.</div></div><label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-weight:800;color:#33463e"><input id="bizumSent" type="checkbox"> He fet el Bizum</label><div class="actions"><button id="orderSubmit" class="btn btn-accent" onclick="confirmOrder('${p.id}')">Enviar comanda</button></div><div id="orderMsg" style="margin-top:12px"></div>`}async function confirmOrder(id){if(!OPEN)return alert('Les comandes estan tancades.');const p=PRODUCTS.find(x=>x.id===id);if(!p)return;const buyer=document.getElementById('buyer').value.trim(),size=document.getElementById('size').value,qty=Math.max(1,parseInt(document.getElementById('qty').value||1)),bn=document.getElementById('bizumName').value.trim(),sent=document.getElementById('bizumSent').checked;if(buyer.split(/\s+/).length<2)return alert('Posa nom i cognoms.');orderSubmit.disabled=true;orderSubmit.textContent='Enviant…';try{await SupaSync.req('/rest/v1/merch_orders',{method:'POST',body:{product_id:p.id,buyer_name:buyer,size,quantity:qty,amount:qty*Number(p.price||0),bizum_name:bn||null,payment_status:sent?'bizum_sent':'pending'}});orderMsg.innerHTML=`<div class="success-card"><strong>✓ Comanda registrada</strong><div>${esc(p.name)} · ${qty} unitat${qty>1?'s':''}</div><div class="meta">${sent?'Bizum enviat · pendent de verificació':'Pagament pendent'}</div></div>`;setTimeout(()=>orderBox.style.display='none',1200)}catch(e){orderMsg.innerHTML='<div class="production-note"><strong>No s’ha pogut enviar.</strong> Torna-ho a provar.</div>'}finally{orderSubmit.disabled=false;orderSubmit.textContent='Enviar comanda'}}load();window.addEventListener('supabase:change',e=>{if(e.detail?.table==='merch_products'||e.detail?.table==='tournament_config')load()});</script><script src="professional-shell.js?v=launch2"></script></body></html>
