<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Merchandising · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Sota demanda</div><h1 class="section-title">Merchandising</h1></div></div><div id="closed" class="notice-card" style="display:none;margin-bottom:16px"><strong>Comandes tancades</strong><div class="meta">L'organització ha tancat temporalment el merchandising.</div></div><div class="product-grid" id="products"><div class="product"><div class="mock-img">POLO TÈCNIC</div><h3>Polo tècnic</h3><div class="price">30 €</div><p class="meta">Talles XS–XXL</p><button class="btn btn-accent orderBtn" onclick="order('Polo tècnic',30)">Demanar</button></div><div class="product"><div class="mock-img">POLO COTÓ</div><h3>Polo de cotó</h3><div class="price">30 €</div><p class="meta">Talles XS–XXL</p><button class="btn btn-accent orderBtn" onclick="order('Polo de cotó',30)">Demanar</button></div><div class="product"><div class="mock-img">GORRA</div><h3>Gorra</h3><div class="price">15 €</div><p class="meta">Talla única</p><button class="btn btn-accent orderBtn" onclick="order('Gorra',15)">Demanar</button></div></div><div id="orderBox" class="form-panel" style="margin-top:22px;display:none"></div></section></div></main><script src="portal.js"></script><script>const initial=Portal.load(),cfg=initial.config||{},open=cfg.merchOpen!==false;if(!open){closed.style.display='block';products.style.opacity='.55';document.querySelectorAll('.orderBtn').forEach(b=>b.disabled=true)}function order(product,price){if(!open)return;orderBox.style.display='block';orderBox.innerHTML=`<h2 style="margin-top:0">${product}</h2><div class="form-grid"><div class="field"><label>Nom i cognoms</label><input id="buyer"></div><div class="field"><label>Talla</label><select id="size"><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>Talla única</option></select></div><div class="field"><label>Quantitat</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Nom utilitzat al Bizum</label><input id="bizumName"></div></div><div class="payment-box" style="margin-top:14px"><strong>${price} € / unitat</strong><div class="meta">L'organització verificarà el Bizum abans de donar la comanda per pagada.</div></div><label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-weight:800;color:#33463e"><input id="bizumSent" type="checkbox"> He fet el Bizum</label><div class="actions"><button id="orderSubmit" class="btn btn-accent" onclick="confirmOrder('${product}',${price})">Enviar comanda</button></div><div id="orderMsg" style="margin-top:12px"></div>`}async function confirmOrder(product,price){if(!open){alert('Les comandes estan tancades.');return}const buyer=document.getElementById('buyer').value.trim(),size=document.getElementById('size').value,qty=Math.max(1,parseInt(document.getElementById('qty').value||1)),bn=document.getElementById('bizumName').value.trim(),sent=document.getElementById('bizumSent').checked;if(buyer.split(/\s+/).length<2){alert('Posa nom i cognoms.');return}const o={buyer,product,size,qty,total:qty*price,unitPrice:price,bizumName:bn,status:sent?'bizum_enviat':'pendent',createdAt:new Date().toISOString()};orderSubmit.disabled=true;orderSubmit.textContent='Enviant…';try{if(window.SupaSync){const db=await SupaSync.orderMerch(o);if(db?.[0])o.id=db[0].id}const s=Portal.load();s.merchOrders=s.merchOrders||[];s.merchOrders.push(o);Portal.save(s);orderMsg.innerHTML=`<div class="notice-card"><strong>Comanda registrada</strong><div class="meta">${sent?'Bizum pendent de verificació.':'Pagament pendent.'}</div></div>`;setTimeout(()=>orderBox.style.display='none',1000)}catch(e){orderMsg.innerHTML=`<div class="production-note"><strong>No s’ha pogut enviar.</strong> ${Portal.esc(e.message||'Error de connexió')}</div>`}finally{orderSubmit.disabled=false;orderSubmit.textContent='Enviar comanda'}}</script><script src="professional-shell.js"></script></body></html>
