<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Quan jugo? · Campionat 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.my-search{background:linear-gradient(135deg,#043a28,#086443);border-radius:24px;padding:24px;color:#fff}.my-search h1{font-size:clamp(42px,7vw,74px);margin:4px 0 14px;line-height:.92}.my-search .search-row input{font-size:18px;padding:15px}.player-summary{background:#fff;border:1px solid var(--border);border-radius:22px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}.next-match{background:#fff8e9;border:1px solid #efd6aa;border-radius:18px;padding:18px;margin-top:14px}.next-match h3{font-size:26px;color:#0b5f43;margin:3px 0 8px}.next-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.next-cell{background:#fff;border-radius:12px;padding:11px}.next-cell b{display:block;color:#0b5f43}.route-stack{margin-top:12px}.route-card{margin-top:8px}@media(max-width:760px){.next-grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="my-search"><div class="eyebrow" style="color:#ffc46e!important">El teu campionat</div><h1>Quan jugo?</h1><p style="color:#cfe4da;max-width:650px">Busca el teu nom i veuràs el pròxim partit, pista, rival i possibles encreuaments.</p><div class="search-row"><input id="q" type="search" placeholder="Escriu el teu nom o cognom…" autocomplete="off"><button class="btn btn-accent" onclick="runSearch()">Buscar</button></div></div><div id="hits" class="search-results"></div></section></div></main><script src="app.js"></script><script>function norm(x){return(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function pairContains(pair,term){return Array.isArray(pair)&&pair.some(n=>norm(n).includes(term))}function samePair(a,b){return Array.isArray(a)&&Array.isArray(b)&&norm(a.join('|'))===norm(b.join('|'))}function sourceMap(){return {A:[['1','W'],['2','W']],B:[['3','W'],['4','W']],C:[['5','W'],['6','W']],D:[['7','W'],['8','W']],E:[['9','W'],['10','W']],F:[['11','W'],['12','W']],G:[['13','W'],['14','W']],H:[['15','W'],['16','W']],I:[['1','L'],['2','L']],J:[['3','L'],['4','L']],K:[['5','L'],['6','L']],L:[['7','L'],['8','L']],M:[['9','L'],['10','L']],N:[['11','L'],['12','L']],O:[['13','L'],['14','L']],P:[['15','L'],['16','L']],R1:[['A','L'],['M','W']],R2:[['B','L'],['N','W']],R3:[['C','L'],['O','W']],R4:[['D','L'],['P','W']],R5:[['E','L'],['I','W']],R6:[['F','L'],['J','W']],R7:[['G','L'],['K','W']],R8:[['H','L'],['L','W']],O1:[['A','W'],['R8','W']],O2:[['B','W'],['R7','W']],O3:[['C','W'],['R6','W']],O4:[['D','W'],['R5','W']],O5:[['E','W'],['R4','W']],O6:[['F','W'],['R3','W']],O7:[['G','W'],['R2','W']],O8:[['H','W'],['R1','W']],Q1:[['O1','W'],['O2','W']],Q2:[['O3','W'],['O4','W']],Q3:[['O5','W'],['O6','W']],Q4:[['O7','W'],['O8','W']],S1:[['Q1','W'],['Q2','W']],S2:[['Q3','W'],['Q4','W']],FINAL:[['S1','W'],['S2','W']],'3/4':[['S1','L'],['S2','L']]}}function possibilitiesForPair(s,pair){const out=[];Torneig.allIds().forEach(id=>{const m=s.matches[id];if((samePair(m.team1,pair)||samePair(m.team2,pair))&&m.status!=='final')out.push({id,type:'confirmed',m})});const initialId=Object.keys(s.matches).find(id=>/^\d+$/.test(id)&&(samePair(s.matches[id].team1,pair)||samePair(s.matches[id].team2,pair)));if(!initialId)return out;const sm=sourceMap();function canReach(target,fromId){if(target===fromId)return true;if(!sm[target])return false;return sm[target].some(src=>canReach(src[0],fromId))}for(const id of Torneig.allIds()){if(id===initialId||!sm[id])continue;if(canReach(id,initialId)){const m=s.matches[id];if(m.status==='final'||out.some(x=>x.id===id))continue;out.push({id,type:'possible',m})}}return out}function opponent(m,pair){if(samePair(m.team1,pair))return Torneig.pairName(m.team2);if(samePair(m.team2,pair))return Torneig.pairName(m.team1);return'Per definir'}function countdown(time){const map={'Dijous 10':10,'Divendres 11':11,'Dissabte 12':12,'Diumenge 13':13};const p=String(time||'').split(' · ');if(!map[p[0]]||!p[1])return'';const [h,min]=p[1].split(':').map(Number),d=new Date(2026,8,map[p[0]],h,min),diff=d-Date.now();if(diff<=0)return'';const hrs=Math.floor(diff/3600000),mins=Math.floor((diff%3600000)/60000);if(hrs>24)return`D'aquí ${Math.floor(hrs/24)} dies`;return`D'aquí ${hrs} h ${mins} min`}function runSearch(){const s=Torneig.loadState(),term=norm(q.value.trim());if(term.length<2){hits.innerHTML='<div class="player-summary">Escriu almenys 2 lletres.</div>';return}const found=s.pairs.map((p,i)=>({pair:p,index:i})).filter(x=>pairContains(x.pair,term));if(!found.length){hits.innerHTML='<div class="player-summary">No hem trobat cap jugador amb aquest nom.</div>';return}hits.innerHTML=found.map(x=>{const routes=possibilitiesForPair(s,x.pair),next=routes.find(r=>r.type==='confirmed'),pairLabel=Torneig.escapeHtml(Torneig.pairName(x.pair));let top='';if(next){const m=next.m,opp=opponent(m,x.pair),cd=countdown(m.time);top=`<div class="next-match"><div class="eyebrow">Pròxim partit confirmat</div><h3>${next.id==='FINAL'?'Final':'Partit '+next.id} · ${Torneig.escapeHtml(m.stage||'')}</h3><div class="next-grid"><div class="next-cell"><span class="meta">Hora</span><b>${Torneig.escapeHtml(m.time||'Pendent')}</b></div><div class="next-cell"><span class="meta">Pista</span><b>${Torneig.escapeHtml(m.court||'Pista 1')}</b></div><div class="next-cell"><span class="meta">Rival</span><b>${Torneig.escapeHtml(opp)}</b></div><div class="next-cell"><span class="meta">Compte enrere</span><b>${cd||'—'}</b></div></div><div class="actions"><button class="btn btn-accent" onclick="UX2?.share('El meu pròxim partit','${pairLabel} · ${Torneig.escapeHtml(m.time||'')} · ${Torneig.escapeHtml(m.court||'Pista 1')}')">↗ Compartir per WhatsApp</button></div></div>`}const possibles=routes.filter(r=>r.type==='possible').slice(0,6).map(r=>`<div class="route-card possible"><div class="route-head"><div><div class="route-stage">${Torneig.escapeHtml(r.m.stage)}</div><div class="route-id">${r.id==='FINAL'?'Final':'Partit '+r.id}</div></div><span class="chip">Possible</span></div><div class="route-time">${Torneig.escapeHtml(r.m.time||'Horari pendent')}</div></div>`).join('');return `<div class="player-summary"><strong style="font-size:22px;color:#0b5f43">${pairLabel}</strong><div class="meta">Parella ${x.index+1}</div>${top}${possibles?`<div class="route-stack"><h3>Possibles següents encreuaments</h3>${possibles}</div>`:''}</div>`}).join('')}q.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});</script><script src="professional-shell.js"></script></body></html>
