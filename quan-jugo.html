<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Quan jugo? · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Buscador de jugadors</div><h1 class="section-title">Quan jugo?</h1></div></div><div class="search-panel"><div class="search-row"><input id="q" type="search" placeholder="Escriu el teu nom o cognom…" autocomplete="off"><button class="btn btn-accent" onclick="runSearch()">Buscar</button></div><div id="hits" class="search-results"></div></div></section><div class="footer"><span>Torneig Frontó Gelida 2026</span><span>Partits confirmats i possibles camins</span></div></div></main><script src="app.js"></script><script>function norm(x){return (x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function pairContains(pair,term){return Array.isArray(pair)&&pair.some(n=>norm(n).includes(term))}function samePair(a,b){return Array.isArray(a)&&Array.isArray(b)&&norm(a.join('|'))===norm(b.join('|'))}function sourceMap(){return {A:[['1','W'],['2','W']],B:[['3','W'],['4','W']],C:[['5','W'],['6','W']],D:[['7','W'],['8','W']],E:[['9','W'],['10','W']],F:[['11','W'],['12','W']],G:[['13','W'],['14','W']],H:[['15','W'],['16','W']],I:[['1','L'],['2','L']],J:[['3','L'],['4','L']],K:[['5','L'],['6','L']],L:[['7','L'],['8','L']],M:[['9','L'],['10','L']],N:[['11','L'],['12','L']],O:[['13','L'],['14','L']],P:[['15','L'],['16','L']],R1:[['A','L'],['M','W']],R2:[['B','L'],['N','W']],R3:[['C','L'],['O','W']],R4:[['D','L'],['P','W']],R5:[['E','L'],['I','W']],R6:[['F','L'],['J','W']],R7:[['G','L'],['K','W']],R8:[['H','L'],['L','W']],O1:[['A','W'],['R8','W']],O2:[['B','W'],['R7','W']],O3:[['C','W'],['R6','W']],O4:[['D','W'],['R5','W']],O5:[['E','W'],['R4','W']],O6:[['F','W'],['R3','W']],O7:[['G','W'],['R2','W']],O8:[['H','W'],['R1','W']],Q1:[['O1','W'],['O2','W']],Q2:[['O3','W'],['O4','W']],Q3:[['O5','W'],['O6','W']],Q4:[['O7','W'],['O8','W']],S1:[['Q1','W'],['Q2','W']],S2:[['Q3','W'],['Q4','W']],F:[['S1','W'],['S2','W']],'3/4':[['S1','L'],['S2','L']]}}function possibilitiesForPair(s,pair){const out=[];Torneig.allIds().forEach(id=>{const m=s.matches[id];if((samePair(m.team1,pair)||samePair(m.team2,pair))&&m.status!=='final')out.push({id,type:'confirmed',stage:m.stage,time:m.time||'Horari pendent',note:'Partit confirmat segons el quadre actual.'})});const initialId=Object.keys(s.matches).find(id=>/^\d+$/.test(id)&&(samePair(s.matches[id].team1,pair)||samePair(s.matches[id].team2,pair)));if(!initialId)return out;const sm=sourceMap();function canReach(target,fromId){if(target===fromId)return true;if(!sm[target])return false;return sm[target].some(src=>canReach(src[0],fromId))}for(const id of Torneig.allIds()){if(id===initialId||!sm[id])continue;if(canReach(id,initialId)){const m=s.matches[id];if(m.status==='final'||out.some(x=>x.id===id))continue;out.push({id,type:'possible',stage:m.stage,time:m.time||'Horari pendent',note:'Possible partit segons els resultats anteriors.'})}}return out}function runSearch(){const s=Torneig.loadState(),term=norm(document.getElementById('q').value.trim()),hits=document.getElementById('hits');if(term.length<2){hits.innerHTML='<div class="player-hit">Escriu almenys 2 lletres.</div>';return}const found=s.pairs.map((p,i)=>({pair:p,index:i})).filter(x=>pairContains(x.pair,term));if(!found.length){hits.innerHTML='<div class="player-hit">No hem trobat cap jugador amb aquest nom.</div>';return}hits.innerHTML=found.map(x=>{const routes=possibilitiesForPair(s,x.pair),pairLabel=Torneig.escapeHtml(Torneig.pairName(x.pair)),cards=routes.length?routes.map(r=>`<div class="route-card ${r.type}"><div class="route-head"><div><div class="route-stage">${r.stage}</div><div class="route-id">Partit ${r.id}</div></div><span class="chip">${r.type==='confirmed'?'Confirmat':'Possible'}</span></div><div class="route-time">${Torneig.escapeHtml(r.time)}</div><div class="route-note">${r.note}</div></div>`).join(''):'<div class="route-card eliminated">No hi ha cap altre partit pendent segons el quadre actual.</div>';return `<div class="player-hit"><strong>${pairLabel}</strong><div class="route-note">Parella ${x.index+1}</div></div>${cards}`}).join('')}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});</script><script src="professional-shell.js"></script></body></html>
