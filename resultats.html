<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Resultats · Campionat 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.results-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.results-tools button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 13px;font-weight:900;cursor:pointer}.results-tools button.active{background:#0b5f43;color:#fff}.result-list{display:flex;flex-direction:column;gap:10px}.result-row{display:grid;grid-template-columns:130px 1fr 100px;gap:14px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:17px;padding:15px 17px;box-shadow:0 8px 24px rgba(12,45,32,.06)}.result-row.live{border:2px solid #efad37}.result-id{font-size:11px;font-weight:950;color:#718179;text-transform:uppercase}.result-time{font-size:12px;color:#7a8882}.result-teams{font-weight:900;line-height:1.5}.result-score{text-align:right;font-size:27px;font-weight:950;color:#0b5f43}.result-score.pending{font-size:12px;color:#7a8882}@media(max-width:680px){.result-row{grid-template-columns:75px 1fr 62px;padding:12px}.result-score{font-size:22px}}</style></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Actualització en directe</div><h1 class="section-title">Resultats</h1><p style="color:#64736c">Primer veuràs els últims partits jugats. Pots filtrar per fase o veure també els pendents.</p></div><span class="status live">● En directe</span></div><div class="results-tools" id="filters"><button class="active" data-f="latest">Últims resultats</button><button data-f="all">Tots</button><button data-f="live">En joc</button><button data-f="pending">Pendents</button></div><div id="results" class="result-list"></div></section></div></main><script src="app.js"></script><script>let filter='latest';function parseStamp(m){const x=String(m.time||'');const dayOrder={'Dijous 10':1,'Divendres 11':2,'Dissabte 12':3,'Diumenge 13':4};const p=x.split(' · ');return (dayOrder[p[0]]||9)*10000+Number((p[1]||'99:99').replace(':',''))}function render(){const s=Torneig.loadState();let ms=Torneig.allIds().map(id=>s.matches[id]).filter(Boolean);if(filter==='latest')ms=ms.filter(m=>m.status==='final').sort((a,b)=>parseStamp(b)-parseStamp(a));else if(filter==='live')ms=ms.filter(m=>m.status==='en joc');else if(filter==='pending')ms=ms.filter(m=>m.status!=='final');else ms=ms.sort((a,b)=>parseStamp(a)-parseStamp(b));if(filter==='latest'&&!ms.length)ms=Torneig.allIds().map(id=>s.matches[id]).filter(m=>m&&m.status==='en joc');results.innerHTML=ms.length?ms.map(m=>`<div class="result-row ${m.status==='en joc'?'live':''}"><div><div class="result-id">${m.id} · ${m.stage||''}</div><div class="result-time">${m.time||'Horari pendent'} · ${m.court||'Pista 1'}</div></div><div class="result-teams">${Torneig.escapeHtml(Torneig.pairName(m.team1))}<br>${Torneig.escapeHtml(Torneig.pairName(m.team2))}</div><div class="result-score ${m.status==='pendent'?'pending':''}">${m.status==='final'||m.status==='en joc'?`${m.s1}–${m.s2}`:'Pendent'}</div></div>`).join(''):'<div class="form-panel">Encara no hi ha resultats en aquesta vista.</div>'}filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});if(Torneig.BC)Torneig.BC.onmessage=render;addEventListener('storage',render);window.addEventListener('supabase:change',render);render();</script><script src="professional-shell.js"></script></body></html>
