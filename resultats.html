<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Resultats · Campionat 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><style>.results-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.results-tools button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 13px;font-weight:900;cursor:pointer}.results-tools button.active{background:#0b5f43;color:#fff}.result-list{display:flex;flex-direction:column;gap:12px}.result-row{background:#fff;border:1px solid var(--border);border-radius:17px;padding:15px 17px;box-shadow:0 8px 24px rgba(12,45,32,.06)}.result-row.live{border:2px solid #efad37}.result-main{display:grid;grid-template-columns:130px 1fr 100px;gap:14px;align-items:center}.result-id{font-size:11px;font-weight:950;color:#718179;text-transform:uppercase}.result-time{font-size:12px;color:#7a8882}.result-teams{font-weight:900;line-height:1.5}.result-score{text-align:right;font-size:27px;font-weight:950;color:#0b5f43}.result-score.pending{font-size:12px;color:#7a8882}.score-evo{margin-top:13px;border-top:1px solid #e4ebe7;padding-top:12px}.score-evo-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#718179;font-weight:950;margin-bottom:7px}.score-evo-grid{display:grid;grid-template-columns:1fr 1fr;max-width:420px;border:1px solid #e2ebe6;border-radius:12px;overflow:hidden;background:#f8fbf9}.score-evo-head{padding:8px 10px;font-size:11px;font-weight:950;background:#edf5f1}.score-evo-head+div{border-left:1px solid #dde7e1}.score-evo-cell{padding:5px 10px;font-weight:900;border-top:1px solid #e5ece8;font-variant-numeric:tabular-nums}.score-evo-cell.right{border-left:1px solid #e5ece8}.score-evo-cell.last{background:#fff4dc;color:#855900}.no-evo{font-size:11px;color:#849089}@media(max-width:680px){.result-main{grid-template-columns:75px 1fr 62px}.result-row{padding:12px}.result-score{font-size:22px}.score-evo-grid{max-width:none}}</style></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">Actualització en directe</div><h1 class="section-title">Resultats</h1><p style="color:#64736c">Consulta el resultat i l’evolució punt a punt de cada partit.</p></div><span class="status live">● En directe</span></div><div class="results-tools" id="filters"><button class="active" data-f="latest">Últims resultats</button><button data-f="all">Tots</button><button data-f="live">En joc</button><button data-f="pending">Pendents</button></div><div id="results" class="result-list"></div></section></div></main>
<script src="app.js?v=flow-sync-20260909"></script><script>let filter='latest';
function parseStamp(m){const x=String(m.time||''),dayOrder={'Dijous 10':1,'Divendres 11':2,'Dissabte 12':3,'Diumenge 13':4},p=x.split(' · ');return(dayOrder[p[0]]||9)*10000+Number((p[1]||'99:99').replace(':',''))}
function evo(m){const h=Array.isArray(m.history)?m.history:[];if(!h.length)return '<div class="score-evo"><div class="no-evo">Encara no hi ha evolució registrada.</div></div>';const n1=Torneig.escapeHtml(Torneig.pairName(m.team1)),n2=Torneig.escapeHtml(Torneig.pairName(m.team2));return `<div class="score-evo"><div class="score-evo-title">Evolució del marcador</div><div class="score-evo-grid"><div class="score-evo-head">${n1}</div><div class="score-evo-head">${n2}</div>${h.map((x,i)=>`<div class="score-evo-cell ${i===h.length-1?'last':''}">${Number(x.s1)||0}</div><div class="score-evo-cell right ${i===h.length-1?'last':''}">${Number(x.s2)||0}</div>`).join('')}</div></div>`}
function render(){const s=Torneig.loadState();let ms=Torneig.allIds().map(id=>s.matches[id]).filter(Boolean);if(filter==='latest')ms=ms.filter(m=>m.status==='final').sort((a,b)=>parseStamp(b)-parseStamp(a));else if(filter==='live')ms=ms.filter(m=>m.status==='en joc');else if(filter==='pending')ms=ms.filter(m=>m.status!=='final');else ms=ms.sort((a,b)=>parseStamp(a)-parseStamp(b));if(filter==='latest'&&!ms.length)ms=Torneig.allIds().map(id=>s.matches[id]).filter(m=>m&&m.status==='en joc');results.innerHTML=ms.length?ms.map(m=>`<div class="result-row ${m.status==='en joc'?'live':''}"><div class="result-main"><div><div class="result-id">${m.id} · ${m.stage||''}</div><div class="result-time">${m.time||'Horari pendent'}</div></div><div class="result-teams">${Torneig.escapeHtml(Torneig.pairName(m.team1))}<br>${Torneig.escapeHtml(Torneig.pairName(m.team2))}</div><div class="result-score ${m.status==='pendent'?'pending':''}">${m.status==='final'||m.status==='en joc'?`${m.s1}–${m.s2}`:'Pendent'}</div></div>${m.status==='final'||m.status==='en joc'?evo(m):''}</div>`).join(''):'<div class="form-panel">Encara no hi ha resultats en aquesta vista.</div>'}filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});if(Torneig.BC)Torneig.BC.onmessage=render;addEventListener('storage',render);
window.addEventListener('supabase:ready',render);window.addEventListener('supabase:change',render);
render();</script><script src="professional-shell.js?v=realtime-only-20260909"></script></body></html>
