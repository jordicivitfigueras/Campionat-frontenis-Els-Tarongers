<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Resultats · Torneig 2026</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"></head><body><main class="page"><div class="container"><header class="topbar"></header><section class="section"><div class="section-head"><div><div class="eyebrow">En directe</div><h1 class="section-title">Horaris i resultats</h1></div><span class="status live">Actualitzat</span></div><div class="production-note">Els resultats i canvis d'horari es mostren aquí tan bon punt l'organització els registra.</div><div id="results" class="public-results-grid"></div></section><div class="footer"><span>Torneig Frontó Gelida 2026</span><span>Resultats oficials</span></div></div></main><script src="app.js"></script><script>function render(){const s=Torneig.loadState();const ids=Torneig.allIds();const el=document.getElementById('results');el.innerHTML=ids.map(id=>{const m=s.matches[id];const hasTeams=Torneig.pairName(m.team1)||Torneig.pairName(m.team2);if(!hasTeams&&!m.time)return '';const result=m.status==='final'?`${m.s1} – ${m.s2}`:'Pendent';return `<div class="public-result"><div class="rmeta">${id} · ${m.stage||Torneig.stageOf(id)||''}${m.time?' · '+m.time:''}</div><div class="teams">${Torneig.escapeHtml(Torneig.pairName(m.team1)||'Per definir')}<br>${Torneig.escapeHtml(Torneig.pairName(m.team2)||'Per definir')}</div><div class="scoreline">${result}</div></div>`}).join('')||'<div class="panel panel-pad">Encara no hi ha partits disponibles.</div>'}if(Torneig.BC)Torneig.BC.onmessage=render;addEventListener('storage',render);render();</script><script src="professional-shell.js"></script></body></html>
