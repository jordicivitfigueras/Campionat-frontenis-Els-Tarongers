<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086443"><title>Sopar dissabte · Campionat 2026</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/professional.css"></head><body><main class="page"><div class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">Dissabte 12 · Obert a tothom</div><h1 class="section-title">Sopar de bocata</h1><p class="meta">Reserva només el sopar, sense haver d’agafar cap dinar.</p></div></div><div class="form-panel"><div class="quick-card"><div class="qtitle">Preu</div><div class="qvalue">6 €</div><div class="meta">per persona</div></div><div class="field" style="margin-top:16px"><label>Nombre de persones</label><input id="count" type="number" min="1" max="12" value="1"></div><div id="people" class="form-grid" style="margin-top:12px"></div><div class="payment-box" style="margin-top:16px"><div class="meta">Total</div><div id="total" style="font-size:34px;font-weight:950;color:#0b5f43">6 €</div></div><div class="production-note" style="margin-top:14px"><strong>Bizum a Arnau Costa · +34 677 48 87 48</strong></div><div class="field" style="margin-top:14px"><label>Nom utilitzat al Bizum</label><input id="bizumName"></div><label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-weight:800"><input id="bizumSent" type="checkbox"> He fet el Bizum</label><div class="actions"><button id="submit" class="btn btn-accent">Enviar reserva</button><a class="btn btn-secondary" href="/dinars">Veure tots els àpats</a></div><div id="msg"></div></div></section></div></main><script>const SB='https://mojwomfkgpvpwviqnptl.supabase.co',KEY='sb_publishable_UtAmoVy3jwRJe1ehoGJI_g_oBsh5jvl',DINNER='c87024b6-aad6-42bc-bee9-0e452ff5e893';async function req(path,opt={}){const r=await fetch(SB+path,{method:opt.method||'GET',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:opt.body?JSON.stringify(opt.body):undefined});if(!r.ok)throw new Error(await r.text())}function draw(){const n=Math.max(1,Math.min(12,parseInt(count.value||1)));people.innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Persona ${i+1} · Nom</label><input class="personName" placeholder="Nom i cognoms"></div>`).join('');total.textContent=(n*6)+' €'}count.oninput=draw;submit.onclick=async()=>{const names=[...document.querySelectorAll('.personName')].map(x=>x.value.trim()),bn=bizumName.value.trim(),sent=bizumSent.checked;if(names.some(x=>!x))return msg.innerHTML='<div class="production-note">Falta algun nom.</div>';submit.disabled=true;try{const group=crypto.randomUUID();await req('/rest/v1/lunch_reservations',{method:'POST',body:names.map(full_name=>({lunch_id:DINNER,full_name,reservation_group:group,bizum_name:bn||null,payment_status:sent?'bizum_sent':'pending'}))});msg.innerHTML=`<div class="success-card" style="text-align:center;padding:22px"><div style="font-size:42px">✓</div><strong>RESERVA DEL SOPAR REGISTRADA</strong><div>${names.length} persona${names.length>1?'es':''} · ${names.length*6} €</div><div class="meta">${sent?'Bizum enviat · pendent de verificació':'Pagament pendent'}</div></div>`;count.value=1;draw();bizumName.value='';bizumSent.checked=false}catch(e){msg.innerHTML='<div class="production-note">No s’ha pogut guardar. Torna-ho a provar.</div>'}finally{submit.disabled=false}};draw();</script><script src="/professional-shell.js?v=sopar-independent-1"></script></body></html>
